<nb-card class="actions-card">
    <nb-card-header>{{pageNavigation}}
        <ngx-report-button (click)="RptButtonAction()"></ngx-report-button>
    </nb-card-header>
    <nb-card-body>
        <div class="row">
            <div class="col-4">
                <div class="form-group row">
                    <label for="companyId" class="col-4 col-form-label">Company Name <span>*</span></label>
                    <div class="col-sm-8">
                        <ng-select nbselect (change)="getBranch(this.$event.id);" [items]="companies" name="companyId"
                            bindLabel="name" id="companyId" [(ngModel)]="companySelected"
                            [ngModelOptions]="{standalone: true}" placeholder="Select Company" appendTo="body">
                        </ng-select>
                    </div>
                </div>
            </div>
            <div class="col-4">
                <div class="form-group row">
                    <label for="BranchId" class="col-4 col-form-label">Branch Name <span>*</span></label>
                    <div class="col-sm-8">
                        <ng-select nbselect [items]="branchs" name="BranchId" bindLabel="name" id="BranchId"
                            [(ngModel)]="branchSelected" [ngModelOptions]="{standalone: true}"
                            placeholder="Select Branch" appendTo="body">
                        </ng-select>
                    </div>
                </div>
            </div>
            <div class="col-4">
                <div class="form-group row">
                    <label for="fromdateSelected" class="col-4 col-form-label">From Date <span>*</span></label>
                    <div class="col-sm-8">
                        <input required [(ngModel)]="fromdateSelected" [nbDatepicker]="fdatepicker" nbInput fullWidth
                            placeholder="From Date" [ngModelOptions]="{standalone: true}">
                        <nb-datepicker #fdatepicker></nb-datepicker>
                    </div>
                </div>
            </div>
            <div class="col-4">
                <div class="form-group row">
                    <label for="todateSelected" class="col-4 col-form-label">To Date <span>*</span></label>
                    <div class="col-sm-8">
                        <input required [(ngModel)]="todateSelected" [nbDatepicker]="datepicker" nbInput fullWidth
                            placeholder="To Date" [ngModelOptions]="{standalone: true}">
                        <nb-datepicker #datepicker></nb-datepicker>
                    </div>
                </div>
            </div>
        </div>
    </nb-card-body>
</nb-card>

<nb-card *ngIf="showbody">
    <nb-card-body>
        <div class="row" style="padding: 0px 15px 0px 15px;">
            <table id="simple_table" class="table table-bordered">
                <thead style="background-color:lightgray;border-bottom:groove;">
                    <tr>
                        <th style="text-align:center;vertical-align: middle;">Ratios</th>
                        <th style="text-align:center;vertical-align: middle;">Formula</th>
                        <th style="text-align:center;vertical-align: middle;"></th>
                    </tr>
                </thead>

                <tbody>
                    <tr *ngFor="let item of bodyData;">
                        <td style="width:30%;">{{item.noteName}}</td>
                        <td style="width:60%;">{{item.formula}}</td>
                        <td style="width:10%;" align="right">{{item.currentAmount}}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </nb-card-body>
</nb-card>

<!-- PDF  -->
<nb-card style="visibility: hidden;">
    <nb-card-header>
        <div id="reportHeader">
            <ngx-rpt-header></ngx-rpt-header>
        </div>
    </nb-card-header>
    <nb-card-body>
        <div class="grid-wrapper">
            <table id="header_table_top" class="table" style="width: 550px;">
                <tbody>
                    <tr>
                        <td>Ratio Analysis</td>
                    </tr>
                </tbody>
            </table>
            <table id="header_table" class="table" style="width: 550px;">
                <tr>
                    <td>For the year ended {{yearEndDate}}</td>
                </tr>
            </table>

            <div class="row" style="padding: 0px 15px 0px 15px;">
                <table id="body_table" class="table table-bordered">
                    <thead>
                        <tr>
                            <th>Ratios</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let item of bodyData;">
                            <td style="width:80%;">{{item.noteName}}</td>
                            <td style="width:20%;">{{item.currentAmount}}</td>

                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </nb-card-body>
    <nb-card-footer>
        <ngx-rpt-footer></ngx-rpt-footer>
    </nb-card-footer>
</nb-card>
