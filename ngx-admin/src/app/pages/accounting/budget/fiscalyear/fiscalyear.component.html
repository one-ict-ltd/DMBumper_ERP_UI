<nb-card class="actions-card">
    <nb-card-header>{{pageNavigation}}
        <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
    </nb-card-header>
</nb-card>

<nb-card *ngIf="show">
    <nb-card-header class="text-right">
        <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
    </nb-card-header>
    <nb-card-body>
        <div class="grid-wrapper">
            <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
                [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
                [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
                (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
            </ag-grid-angular>
        </div>
    </nb-card-body>
</nb-card>

<nb-card *ngIf="!show">
    <nb-card-header>
        <fieldset [disabled]="disabled ? 'disabled' : null">
            <form #masterForm="ngForm" novalidate>
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group row">
                            <label for="companyId" class="col-sm-3 col-form-label">Company Name <span>*</span></label>
                            <div class="col-sm-9">
                                <ng-select nbselect
                                    (change)="(master.companyId = this.$event.id);getSBU(this.$event.id);"
                                    [items]="companyItems" name="companyId" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="companyId" placeholder="Select Company"
                                    appendTo="body" [(ngModel)]="master.companySelected">
                                </ng-select>
                            </div>
                        </div>


                        <div class="form-group row">
                            <label for="yearName" class="col-sm-3 col-form-label">Year Name
                                <span>*</span></label>
                            <div class="col-sm-9">
                                <input type="text" (keyup)="getDuplicate();" class="form-control" id="yearName" required
                                    [(ngModel)]="master.yearName" name="yearName" nbInput fullWidth
                                    placeholder="Year Name">
                            </div>
                        </div>
                        <div class="form-group row">
                            <label for="yearStartDateShow" class="col-sm-3 col-form-label">Start Date
                                <span>*</span></label>
                            <div class="col-sm-9">
                                <input (ngModelChange)="getActualStartDate($event);" id="yearStartDateShow" required
                                    [(ngModel)]="master.yearStartDateShow" name="yearStartDateShow"
                                    [nbDatepicker]="yearStartDateShow" nbInput fullWidth placeholder="Start Date"
                                    [ngModelOptions]="{standalone: true}">
                                <nb-datepicker #yearStartDateShow></nb-datepicker>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label for="lockDateShow" class="col-sm-3 col-form-label">Lock Date
                                <span>*</span></label>
                            <div class="col-sm-9">
                                <input (ngModelChange)="getActualLockDate($event);" id="lockDateShow" required
                                    [(ngModel)]="master.lockDateShow" name="lockDateShow" [nbDatepicker]="lockDateShow"
                                    nbInput fullWidth placeholder="Lock Date" [ngModelOptions]="{standalone: true}">
                                <nb-datepicker #lockDateShow></nb-datepicker>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group row">
                            <label for="sbuId" class="col-sm-3 col-form-label">Branch Name <span>*</span></label>
                            <div class="col-sm-9">
                                <ng-select nbselect (change)="(master.sbuId = this.$event.id);" [items]="sbuItems"
                                    name="sbuName" bindLabel="name" [ngModelOptions]="{standalone: true}" id="sbuId"
                                    placeholder="Select Branch" appendTo="body" [(ngModel)]="master.sbuSelected">
                                </ng-select>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label for="financialYearName" class="col-sm-3 col-form-label">Financial Year Name
                                <span>*</span></label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" id="financialYearName" required
                                    [(ngModel)]="master.financialYearName" name="financialYearName" nbInput fullWidth
                                    placeholder="Financial Year Name">
                            </div>
                        </div>
                        <div class="form-group row">
                            <label for="yearEndDateShow" class="col-sm-3 col-form-label">End Date
                                <span>*</span></label>
                            <div class="col-sm-9">
                                <input (ngModelChange)="getActualEndDate($event);" id="yearEndDateShow" required
                                    [(ngModel)]="master.yearEndDateShow" name="yearEndDateShow"
                                    [nbDatepicker]="yearEndDateShow" nbInput fullWidth placeholder="End Date"
                                    [ngModelOptions]="{standalone: true}">
                                <nb-datepicker #yearEndDateShow></nb-datepicker>
                            </div>
                        </div>

                        <div class="form-group row">
                            <label for="islocked" class="col-sm-3 col-form-label">Is Locked?</label>
                            <div class="col-sm-3">
                                <div class="validation-checkboxes">
                                    <nb-checkbox [(ngModel)]="master.islocked" name="islocked" id="islocked"
                                        status="success">
                                    </nb-checkbox>
                                </div>
                            </div>
                            <label for="isActive" class="col-sm-3 col-form-label">Is Active?</label>
                            <div class="col-sm-3">
                                <div class="validation-checkboxes">
                                    <nb-checkbox [(ngModel)]="master.isActive" name="isActive" id="isActive"
                                        status="success">
                                    </nb-checkbox>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </fieldset>
    </nb-card-header>
</nb-card>
