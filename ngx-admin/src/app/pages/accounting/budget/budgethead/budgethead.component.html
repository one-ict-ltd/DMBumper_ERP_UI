<nb-card class="actions-card">
    <nb-card-header>{{pageNavigation}}
        <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
    </nb-card-header>
</nb-card>

<nb-card *ngIf="show">
    <nb-card-header class="text-right">
        <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
    </nb-card-header>
    <nb-card-body>
        <div class="grid-wrapper">
            <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
                [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
                [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
                (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
            </ag-grid-angular>
        </div>
    </nb-card-body>
</nb-card>

<nb-card *ngIf="!show">
    <nb-card-header>
        <fieldset [disabled]="disabled ? 'disabled' : null">
            <form #masterForm="ngForm" novalidate>
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group row">
                            <label for="companyId" class="col-sm-3 col-form-label">Company Name <span>*</span></label>
                            <div class="col-sm-9">
                                <ng-select nbselect
                                    (change)="(master.companyId = this.$event.id);getSBU(this.$event.id);getBudgetMainHead();"
                                    [items]="companyItems" name="companyId" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="companyId" placeholder="Select Company"
                                    appendTo="body" [(ngModel)]="master.companySelected">
                                </ng-select>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label for="budgetMainHeadId" class="col-sm-3 col-form-label">Main Head
                                <span>*</span></label>
                            <div class="col-sm-9">
                                <ng-select nbselect
                                    (change)="(master.budgetMainHeadId = this.$event.id);getBudgetSubHead();"
                                    [items]="budgetMainHeadItems" name="sbuName" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="budgetMainHeadId"
                                    placeholder="Select Main Head" appendTo="body"
                                    [(ngModel)]="master.budgetMainHeadSelected">
                                </ng-select>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label for="headCode" class="col-sm-3 col-form-label">Head Code
                                <span>*</span></label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" id="headCode" required
                                    [(ngModel)]="master.headCode" name="headCode" nbInput fullWidth
                                    placeholder="Head Code">
                            </div>
                        </div>
                        <div class="form-group row">
                            <label for="sortOrder" class="col-sm-3 col-form-label">Sort Order
                                <span>*</span></label>
                            <div class="col-sm-9">
                                <input type="number" class="form-control" id="sortOrder" required
                                    [(ngModel)]="master.sortOrder" name="sortOrder" nbInput fullWidth
                                    placeholder="Sort Order">
                            </div>
                        </div>
                        <div class="form-group row">
                            <label for="ledgerId" class="col-sm-3 col-form-label">Ledger Name <span>*</span></label>
                            <div class="col-sm-9">
                                <ng-select nbselect (change)="(master.ledgerId = this.$event.id);" [items]="ledgerItems"
                                    bindLabel="name" [ngModelOptions]="{standalone: true}" id="ledgerId"
                                    placeholder="Select Ledger" appendTo="body" [(ngModel)]="master.ledgerSelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group row">
                            <label for="sbuId" class="col-sm-3 col-form-label">Branch Name <span>*</span></label>
                            <div class="col-sm-9">
                                <ng-select nbselect
                                    (change)="(master.sbuId = this.$event.id);getBudgetMainHead();getLedger();"
                                    [items]="sbuItems" bindLabel="name" [ngModelOptions]="{standalone: true}" id="sbuId"
                                    placeholder="Select Branch" appendTo="body" [(ngModel)]="master.sbuSelected">
                                </ng-select>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label for="budgetSubHeadId" class="col-sm-3 col-form-label">Sub Head
                                <span>*</span></label>
                            <div class="col-sm-9">
                                <ng-select nbselect (change)="(master.budgetSubHeadId = this.$event.id);"
                                    [items]="budgetSubHeadItems" bindLabel="name" [ngModelOptions]="{standalone: true}"
                                    id="budgetSubHeadId" placeholder="Select Sub Head" appendTo="body"
                                    [(ngModel)]="master.budgetSubHeadSelected">
                                </ng-select>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label for="headName" class="col-sm-3 col-form-label">Head Name
                                <span>*</span></label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" id="headName" required
                                    [(ngModel)]="master.headName" name="headName" nbInput fullWidth
                                    placeholder="Head Name">
                            </div>
                        </div>
                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label">Is Active?</label>
                            <div class="col-sm-9">
                                <div class="validation-checkboxes">
                                    <nb-checkbox [(ngModel)]="master.isActive" name="checkbox" status="success">
                                    </nb-checkbox>
                                </div>
                            </div>
                        </div>
                        <div class="form-group row">
                            <div class="col-sm-6">
                                <button (click)="addDetails(dialog)" class="btn btn-warning btn-sm"><i
                                        class="fa fa-plus" aria-hidden="true"></i> Add Ledger
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </fieldset>
    </nb-card-header>
</nb-card>

<div class="row" *ngIf="!show">
    <div class="col-md-12 col-lg-12">
        <nb-card class="min-height">
            <fieldset [disabled]="disabled ? 'disabled' : null">
                <nb-tabset>
                    <nb-tab tabTitle="Ledger Details" class="btn-tab">
                        <div class="grid-wrapper">
                            <table class=" table table-bordered table-striped">
                                <tr>
                                    <th>SN</th>
                                    <th>Ledger Name</th>
                                    <td>Action</td>
                                </tr>
                                <tr *ngFor="let detail of master.lstdetailBudgetHead; let rowIndex = index">
                                    <td>{{rowIndex+1}}</td>
                                    <td>
                                        <input [(ngModel)]="detail.accountName" type="text" class="form-control"
                                            id="accountName" required name="accountName" nbInput fullWidth
                                            placeholder="Account Name">
                                    </td>
                                    <td *ngIf="detail.showtd">
                                        <button (click)="deleteDetail(rowIndex)" class="btn btn-danger btn-sm m-1">
                                            <i class="fa fa-trash" aria-hidden="true"></i>
                                        </button>
                                        <!-- <button (click)="editDetail(rowIndex)" class="btn btn-primary btn-sm m-1">
                                            <i class="fa fa-edit" aria-hidden="true"></i>
                                        </button> -->
                                    </td>
                                </tr>
                            </table>
                        </div>
                    </nb-tab>
                </nb-tabset>
            </fieldset>
        </nb-card>
    </div>
</div>
