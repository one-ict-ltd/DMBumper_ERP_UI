<nb-card class="actions-card">
    <nb-card-header>{{pageNavigation}}
        <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
    </nb-card-header>
</nb-card>

<nb-card *ngIf="show">
    <nb-card-header class="text-right">
        <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
    </nb-card-header>
    <nb-card-body>
        <div class="grid-wrapper">
            <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
                [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
                [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
                (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
            </ag-grid-angular>
        </div>
    </nb-card-body>
</nb-card>

<nb-card *ngIf="!show">
    <nb-card-header>
        <fieldset [disabled]="disabled ? 'disabled' : null">
            <form #masterForm="ngForm" novalidate>

                <div class="row">
                    <div class="col-6">
                        <div class="form-group row">
                            <label for="costCentreLocationName" class="col-sm-5 col-form-label">Cost Centre Location
                                Name
                                <span>*</span></label>
                            <div class="col-sm-7">
                                <input type="text" (keyup)="getDuplicate();" class="form-control"
                                    id="costCentreLocationName" required [(ngModel)]="master.costCentreLocationName"
                                    name="costCentreLocationName" nbInput fullWidth
                                    placeholder="Cost Centre Location Name" autocomplete="off">
                            </div>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="form-group row">
                            <label for="costCentreLocationCode" class="col-sm-5 col-form-label">Cost Centre Location
                                Code</label>
                            <div class="col-sm-7">
                                <input type="text" class="form-control" id="costCentreLocationCode" required
                                    [(ngModel)]="master.costCentreLocationCode" name="costCentreLocationCode" nbInput
                                    fullWidth placeholder="Location Code">
                            </div>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="form-group row">
                            <label for="" class="col-sm-5 col-form-label"> Is Active ?</label>
                            <div class="col-sm-7">
                                <div class="validation-checkboxes">
                                    <nb-checkbox [(ngModel)]="master.isActive" name="checkbox" status="success">
                                    </nb-checkbox>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </fieldset>
    </nb-card-header>
</nb-card>
