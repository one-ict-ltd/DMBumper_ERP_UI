<nb-card class="actions-card">
  <nb-card-header>{{pageNavigation}}
    <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
  </nb-card-header>
</nb-card>

<nb-card *ngIf="show">
  <nb-card-header class="text-right">
    <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
  </nb-card-header>
  <nb-card-body>
    <div class="grid-wrapper">
      <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
        [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
        [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
        (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
      </ag-grid-angular>
    </div>
  </nb-card-body>
</nb-card>

<nb-card *ngIf="!show">
  <nb-card-header>
    <fieldset [disabled]="disabled ? 'disabled' : null">
      <form #masterForm="ngForm" novalidate>
        <div class="row">          
          <div class="col-6">
            <div class="form-group row">
              <label for="companyId" class="col-sm-5 col-form-label">Company Name <span>*</span></label>
              <div class="col-sm-7">
                <ng-select nbselect (change)="(master.companyId = this.$event.id); getSBU(this.$event.id)"
                  [items]="companies" name="companyId" bindLabel="name" [ngModelOptions]="{standalone: true}"
                  id="companyId" placeholder="Select Company" appendTo="body" [(ngModel)]="master.companiesSelected">
                </ng-select>
              </div>
            </div>
          </div>
          <div class="col-6">
            <div class="form-group row">
              <label for="dropdown" class="col-sm-5 col-form-label">SBU Name <span>*</span></label>
              <div class="col-sm-7">
                <ng-select nbselect (change)="( master.sbuId = this.$event.id)" [items]="sbus" name="sbuName"
                  bindLabel="name" [ngModelOptions]="{standalone: true}" id="sbuId" placeholder="Select SBU"
                  appendTo="body" [(ngModel)]="master.sbusSelected">
                </ng-select>
              </div>
            </div>
          </div>
          <div class="col-6">
            <div class="form-group row">
              <label for="fundSourceName" class="col-sm-5 col-form-label">Fund Source Name <span>*</span></label>
              <div class="col-sm-7">
                <input type="text"  (keyup)="getDuplicate();" class="form-control" id="fundSourceName" required [(ngModel)]="master.fundSourceName"
                  name="fundSourceName" nbInput fullWidth placeholder="Fund Source Name">
              </div>
            </div>
          </div>
          <div class="col-6">
            <div class="form-group row">
              <label for="aliasName" class="col-sm-5 col-form-label">Alias Name</label>
              <div class="col-sm-7">
                <input type="text" class="form-control" id="aliasName" required [(ngModel)]="master.aliasName"
                  name="aliasName" nbInput fullWidth placeholder="Alias Name">
              </div>
            </div>
          </div>
          <div class="col-4">
            <div class="form-group row">
              <label for="" class="col-sm-5 col-form-label"> Is Active ?</label>
              <div class="col-sm-7">
                <div class="validation-checkboxes">
                  <nb-checkbox [(ngModel)]="master.isActive" name="checkbox" status="success"></nb-checkbox>
                </div>
              </div>
            </div>
          </div>
        </div>
      </form>
    </fieldset>
  </nb-card-header>
</nb-card>
