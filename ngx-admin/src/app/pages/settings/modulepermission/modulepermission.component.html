<nb-card class="actions-card">
    <nb-card-header>{{pageNavigation}}
        <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
    </nb-card-header>
</nb-card>
<nb-card *ngIf="show">
    <nb-card-header class="text-right">
        <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
    </nb-card-header>
    <nb-card-body>
        <div class="grid-wrapper">
            <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
                [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
                [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
                (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
            </ag-grid-angular>
        </div>
    </nb-card-body>
</nb-card>

<nb-card *ngIf="!show">
    <nb-card-header>
        <fieldset [disabled]="disabled ? 'disabled' : null">
            <form #masterForm="ngForm" novalidate>
                <div class="row">
                    <div class="col-4">
                        <div class="form-group row">
                            <label for="companyId" class="col-sm-5 col-form-label">Company Name <span>*</span></label>
                            <div class="col-sm-7">
                                <ng-select nbselect (change)="(master.companyId = this.$event.id);getModule();"
                                    [items]="companiesItems" name="companyId" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="companyId" placeholder="Select Company"
                                    appendTo="body" [(ngModel)]="master.companiesSelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </fieldset>
    </nb-card-header>
</nb-card>

<div class="row" *ngIf="!show">
    <div class="col-md-12 col-lg-12">
        <nb-card class="min-height">
            <fieldset [disabled]="disabled ? 'disabled' : null">
                <nb-tabset>
                    <nb-tab tabTitle="Module Details" class="btn-tab">
                        <div class="grid-wrapper">
                            <table class=" table table-bordered table-striped">
                                <tr>
                                    <th>Module ID</th>
                                    <th>Module Name</th>
                                    <th>Description</th>
                                    <th>Default Menu</th>
                                    <td>Action</td>
                                </tr>
                                <tr *ngFor="let detail of master.lstModel;let rowIndex = index">
                                    <!-- <td>{{detail.moduleId}}</td> -->
                                    <td>
                                        <input [(ngModel)]="detail.moduleId"
                                            (change)="(detail.moduleId = this.$event.target.value);" type="text"
                                            class="form-control" id="moduleId" required name="moduleId" nbInput
                                            fullWidth readonly>
                                    </td>
                                    <td>
                                        <input [(ngModel)]="detail.moduleName"
                                            (change)="(detail.moduleName = this.$event.target.value)" type="text"
                                            class="form-control" id="moduleName" required name="moduleName" nbInput
                                            fullWidth readonly>
                                    </td>
                                    <td>
                                        <input [(ngModel)]="detail.description"
                                            (change)="(detail.description = this.$event.target.value)" type="text"
                                            class="form-control" id="description" required name="description" nbInput
                                            fullWidth readonly>
                                    </td>
                                    <td>
                                        <ng-select (change)="(detail.defaultMenuId = this.$event.id);"
                                            [items]="defaultMenuItems" name="defaultMenuId" bindLabel="name"
                                            [ngModelOptions]="{standalone: true}" id="defaultMenuId"
                                            placeholder="Select Default Menu" appendTo="body"
                                            [(ngModel)]="detail.defaultMenuSelected">
                                        </ng-select>
                                    </td>
                                    <td>
                                        <nb-checkbox [(ngModel)]="detail.isActive" id="isActive" name="isActive"
                                            status="success">
                                        </nb-checkbox>
                                    </td>

                                </tr>
                            </table>
                        </div>
                    </nb-tab>
                </nb-tabset>
            </fieldset>
        </nb-card>
    </div>
</div>
