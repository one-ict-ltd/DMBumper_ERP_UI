<nb-card class="actions-card">
    <nb-card-header>{{pageNavigation}}
        <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
    </nb-card-header>
</nb-card>
<nb-card *ngIf="show">
    <nb-card-header class="text-right">
        <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
    </nb-card-header>
    <nb-card-body>
        <div class="grid-wrapper">
            <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
                [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
                [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
                (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
            </ag-grid-angular>
        </div>
    </nb-card-body>
</nb-card>

<nb-card *ngIf="!show">
    <nb-card-header>
        <fieldset [disabled]="disabled ? 'disabled' : null">
            <form #masterForm="ngForm" novalidate>
                <div class="row">
                    <div class="col-4">
                        <div class="form-group row">
                            <label for="moduleId" class="col-sm-5 col-form-label">Module Name <span>*</span></label>
                            <div class="col-sm-7">
                                <ng-select nbselect (change)="(master.moduleId = this.$event.id);getReoprtByModule();"
                                    [items]="moduleItems" name="moduleId" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="moduleId" placeholder="Select Module"
                                    appendTo="body" [(ngModel)]="master.moduleSelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="form-group row">
                            <label for="employeeId" class="col-sm-5 col-form-label">Employee Name</label>
                            <div class="col-sm-7">
                                <ng-select nbselect (change)="(master.employeeId = this.$event.id);"
                                    [items]="employeeItems" name="employeeId" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="employeeId" placeholder="Select Employee"
                                    appendTo="body" [(ngModel)]="master.employeeSelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </fieldset>
    </nb-card-header>
</nb-card>

<div class="row" *ngIf="!show">
    <div class="col-md-12 col-lg-12">
        <nb-card class="min-height">
            <fieldset [disabled]="disabled ? 'disabled' : null">
                <nb-tabset>
                    <nb-tab tabTitle="Report Details" class="btn-tab">
                        <div class="grid-wrapper">
                            <table class=" table table-bordered table-striped">
                                <tr>
                                    <th>Report ID</th>
                                    <th>Report Name</th>
                                    <td>Is Active?</td>
                                </tr>
                                <tr *ngFor="let detail of master.lstModel;let rowIndex = index">
                                    <td>
                                        <input [(ngModel)]="detail.reportId"
                                            (change)="(detail.reportId = this.$event.target.value);" type="text"
                                            class="form-control" id="reportId" required name="reportId" nbInput
                                            fullWidth readonly>
                                    </td>
                                    <td>
                                        <input [(ngModel)]="detail.reportName"
                                            (change)="(detail.reportName = this.$event.target.value)" type="text"
                                            class="form-control" id="reportName" required name="reportName" nbInput
                                            fullWidth readonly>
                                    </td>
                                    <td>
                                        <nb-checkbox [(ngModel)]="detail.isActive" id="isActive" name="isActive"
                                            status="success">
                                        </nb-checkbox>
                                    </td>
                                </tr>
                            </table>
                        </div>
                    </nb-tab>
                </nb-tabset>
            </fieldset>
        </nb-card>
    </div>
</div>
