<nb-card class="actions-card">
    <nb-card-header>{{pageNavigation}}
        <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
    </nb-card-header>
</nb-card>

<nb-card *ngIf="show">
    <nb-card-header class="text-right">
        <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
    </nb-card-header>
    <nb-card-body>
        <div class="grid-wrapper">
            <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
                [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
                [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
                (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
            </ag-grid-angular>
        </div>
    </nb-card-body>
</nb-card>

<nb-card *ngIf="!show">
    <nb-card-header>
        <fieldset [disabled]="disabled ? 'disabled' : null">
            <form #masterForm="ngForm">
                <div class="row">
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label for="moduleId" class="col-sm-3 col-form-label">Module <span>*</span></label>
                            <div class="col-sm-9">
                                <ng-select nbselect
                                    (change)="(master.moduleId = this.$event.id);getParentMenu(this.$event.id);"
                                    [items]="moduleItems" name="moduleId" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="moduleId" placeholder="Select Module"
                                    appendTo="body" [(ngModel)]="master.moduleSelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label for="menuTypeId" class="col-sm-3 col-form-label">Menu Type <span>*</span></label>
                            <div class="col-sm-9">
                                <ng-select nbselect (change)="(master.menuTypeId = this.$event.id);"
                                    [items]="menuTypeItems" name="menuTypeId" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="menuTypeId" placeholder="Select Menu Type"
                                    appendTo="body" [(ngModel)]="master.menuTypeSelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label" for="menuName">Menu Name <span>*</span></label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" required [(ngModel)]="master.menuName"
                                    id="menuName" name="menuName" nbInput fullWidth placeholder="Menu Name">
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label" for="menuShortName">Menu Short Name</label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" required [(ngModel)]="master.menuShortName"
                                    id="menuShortName" name="menuShortName" nbInput fullWidth
                                    placeholder="Menu Short Name">
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label" for="menuPath">Menu Path <span>*</span></label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" required [(ngModel)]="master.menuPath"
                                    id="menuPath" name="menuPath" nbInput fullWidth placeholder="Menu Path">
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label" for="menuIcon ">Menu Icon</label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" required [(ngModel)]="master.menuIcon"
                                    id="menuIcon" name="menuIcon" nbInput fullWidth placeholder="Menu Icon">
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label" for="reportName">Report Name</label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" required [(ngModel)]="master.reportName"
                                    id="reportName" name="reportName" nbInput fullWidth placeholder="Report Name">
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label" for="reportPath">Report Path</label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" required [(ngModel)]="master.reportPath"
                                    id="reportPath" name="reportPath" nbInput fullWidth placeholder="Report Path">
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <div class="col-sm-3 validation-checkboxes">
                                <nb-checkbox [(ngModel)]="master.isParent" (change)="unCheckParent($event)"
                                    id="isParent" name="isParent" status="success">
                                    <b>Is Parent?</b>
                                </nb-checkbox>
                            </div>
                            <div *ngIf="showParent" class="col-sm-9">
                                <ng-select nbselect (change)="(master.parentId = this.$event.id);" [items]="parentItems"
                                    name="parentId" bindLabel="name" [ngModelOptions]="{standalone: true}" id="parentId"
                                    placeholder="Select Parent Menu" appendTo="body"
                                    [(ngModel)]="master.parentSelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label for="sequence" class="col-sm-3 col-form-label">Sort Order</label>
                            <div class="col-sm-3">
                                <input type="number" class="form-control" id="sequence" required
                                    [(ngModel)]="master.sequence" name="sequence" nbInput fullWidth
                                    placeholder="Sort Order">
                            </div>
                            <div class="col-sm-6 validation-checkboxes">
                                <nb-checkbox [(ngModel)]="master.isActive" name="isActive" status="success">
                                    <b>Is Active?</b>
                                </nb-checkbox>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </fieldset>
    </nb-card-header>
</nb-card>
