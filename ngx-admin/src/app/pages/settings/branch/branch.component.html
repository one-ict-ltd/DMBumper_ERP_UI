<nb-card class="actions-card">
  <nb-card-header>{{pageNavigation}}
    <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
  </nb-card-header>
</nb-card>

<nb-card *ngIf="show">
  <nb-card-header class="text-right">
    <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
  </nb-card-header>
  <nb-card-body>

    <div class="grid-wrapper">
      <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
        [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
        [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
        (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
      </ag-grid-angular>
    </div>
  </nb-card-body>
</nb-card>

<nb-card *ngIf="!show">
  <nb-card-header>
    <fieldset [disabled]="disabled ? 'disabled' : null">
      <form #masterForm="ngForm" novalidate>

        <div class="row">
          <div class="col-md-6">
            <div class="form-group row">
              <label for="companyId" class="col-sm-3 col-form-label">Company Name</label>
              <div class="col-sm-9">
                <ng-select nbselect (change)="(master.companyId = this.$event.id);" [items]="companyItems"
                  name="companyId" bindLabel="name" [ngModelOptions]="{standalone: true}" id="companyId"
                  placeholder="Select Company" appendTo="body" [(ngModel)]="master.companySelected">
                </ng-select>
              </div>
            </div>
            <div class="form-group row">
              <label for="sbuName" class="col-sm-3 col-form-label">Branch Name</label>
              <div class="col-sm-9">
                <input type="text" class="form-control" id="sbuName" required [(ngModel)]="master.sbuName"
                  name="sbuName" nbInput fullWidth placeholder="Branch Name">
              </div>
            </div>
            <div class="form-group row">
              <label for="aliasName" class="col-sm-3 col-form-label">Short Name</label>
              <div class="col-sm-9">
                <input type="text" class="form-control" id="aliasName" required [(ngModel)]="master.aliasName"
                  name="aliasName" nbInput fullWidth placeholder="Short Name">
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group row">
              <label for="shortOrder" class="col-sm-3 col-form-label">Short Order</label>
              <div class="col-sm-9">
                <input type="number" class="form-control" id="shortOrder" required [(ngModel)]="master.shortOrder"
                  name="shortOrder" nbInput fullWidth placeholder="Short Order">
              </div>
            </div>
            <div class="form-group row">
              <label for="isActive" class="col-sm-3 col-form-label">Is Active ?</label>
              <div class="col-sm-9">
                <div class="validation-checkboxes">
                  <nb-checkbox [(ngModel)]="master.isActive" name="isActive" status="success">
                  </nb-checkbox>
                </div>
              </div>
            </div>
            <div class="form-group row">
              <label for="isDefault" class="col-sm-3 col-form-label">Is Default ?</label>
              <div class="col-sm-9">
                <div class="validation-checkboxes">
                  <nb-checkbox [(ngModel)]="master.isDefault" name="isDefault" (change)="onCheckboxChange($event)">
                  </nb-checkbox>
                </div>
              </div>
            </div>
          </div>

          <div class="col-md-6">
            <div class="form-group row">
              <label for="branchAddress" class="col-sm-3 col-form-label">Branch Address</label>
              <div class="col-sm-9">
                <textarea type="text" class="form-control" id="branchAddress" required
                  [(ngModel)]="master.branchAddress" name="branchAddress" nbInput fullWidth
                  placeholder="Branch Address"></textarea>
              </div>
            </div>
          </div>
        </div>

      </form>
    </fieldset>
  </nb-card-header>
</nb-card>
