<nb-card *ngIf="show">
    <nb-card-header>
        <fieldset [disabled]="disabled ? 'disabled' : null">
            <form #masterForm="ngForm">
                <div class="row">
                    <div class="col-2"></div>
                    <div class="col-10">
                        <div class="col-md-8 col-sm-12">
                            <div class="form-group row">
                                <label class="col-sm-3 col-form-label" for="Name">Old Password<span>*</span></label>
                                <div class="col-sm-9">
                                    <input type="password" class="form-control" required [(ngModel)]="master.Name"
                                        id="Name" name="Name" nbInput fullWidth placeholder="Old Password"
                                        autocomplete="off">
                                </div>
                            </div>
                        </div>
                        <div class="col-md-8 col-sm-12">
                            <div class="form-group row">
                                <label class="col-sm-3 col-form-label" for="Password">New Password<span>*</span></label>
                                <div class="col-sm-9">
                                    <input class="form-control" required nbInput fullWidth [(ngModel)]="master.Password"
                                        #Password="ngModel" name="Password" id="Password" type="password"
                                        placeholder="Password" fieldSize="large" minlength="6" maxlength="12"
                                        [status]="Password.dirty ? (Password.invalid  ? 'danger' : 'success') : 'basic'"
                                        [attr.aria-invalid]="Password.invalid && Password.touched ? true : null">
                                </div>
                            </div>
                        </div>
                        <div class="col-md-8 col-sm-12">
                            <div class="form-group row">
                                <label class="col-sm-3 col-form-label" for="ConfirmPassword">Confirm
                                    Password<span>*</span></label>
                                <div class="col-sm-9">
                                    <input class="form-control" required nbInput fullWidth
                                        [(ngModel)]="master.ConfirmPassword" #Password="ngModel" name="ConfirmPassword"
                                        id="ConfirmPassword" type="password" placeholder="Confirm Password"
                                        fieldSize="large" minlength="6" maxlength="12"
                                        [status]="Password.dirty ? (Password.invalid  ? 'danger' : 'success') : 'basic'"
                                        [attr.aria-invalid]="Password.invalid && Password.touched ? true : null">
                                </div>
                            </div>
                        </div>

                        <div class="col-md-8 col-sm-12">
                            <div class="form-group row">
                                <div class="col-8"></div>
                                <div class="col-4">
                                    <div style="text-align: center;">
                                        <button class="btn btn-success btn-sm m-6" (click)="UpdatePassword(dialog)"
                                            id="UpdatePassword" tabindex="7"> Update Password </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </form>
        </fieldset>
    </nb-card-header>
</nb-card>
