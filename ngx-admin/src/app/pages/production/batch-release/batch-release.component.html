<nb-card class="actions-card">
    <nb-card-header>{{pageNavigation}}
        <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
    </nb-card-header>
</nb-card>

<nb-card *ngIf="show">
    <nb-card-header class="text-right">
        <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
    </nb-card-header>
    <nb-card-body>
        <div class="row">
            <div class="col-lg-4 col-md-4 col-sm-4">
                <div class="form-group row">
                    <label class="col-sm-4 col-form-label" for="FromDate">From Date <span>*</span></label>
                    <div class="col-sm-8">
                        <input required [(ngModel)]="loadFromDateShow" name="loadFromDateShow" id="loadFromDateShow"
                            [nbDatepicker]="idatepicker" nbInput fullWidth placeholder="Date"
                            [ngModelOptions]="{standalone: true}">
                        <nb-datepicker #idatepicker></nb-datepicker>
                    </div>
                </div>
            </div>
            <div class="col-lg-4 col-md-4 col-sm-4">
                <div class="form-group row">
                    <label class="col-sm-4 col-form-label" for="ToDate">To Date <span>*</span></label>
                    <div class="col-sm-8">
                        <input required [(ngModel)]="loadToDateShow" name="loadToDateShow" id="loadToDateShow"
                            [nbDatepicker]="idatepicker2" nbInput fullWidth placeholder="Date"
                            [ngModelOptions]="{standalone: true}">
                        <nb-datepicker #idatepicker2></nb-datepicker>
                    </div>
                </div>
            </div>
            <div class="col-lg-4 col-md-4 col-sm-4">
                <div class="form-group row !important">
                    <button class="btn btn-info" (click)="GetGridData();">Search</button>
                </div>
            </div>
        </div>
        <div class="grid-wrapper">
            <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
                [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
                [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
                (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
            </ag-grid-angular>
        </div>
    </nb-card-body>
</nb-card>

<nb-card *ngIf="!show">
    <nb-card-header>
        <fieldset [disabled]="disabled ? 'disabled' : null">
            <form #masterForm="ngForm">
                <div class="row">


                    <div class="col-12">
                        <div class="form-group row">
                            <label for="transactionMasterId" class="col-3 col-form-label">Transfer Note No
                                <span>*</span></label>
                            <div class="col-9">
                                <ng-select nbselect
                                    (change)="(master.transactionMasterId = this.$event.id);getTransferDetailsDataLoad(this.$event.id)"
                                    [items]="transectionList" name="transactionMasterId" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="transactionMasterId"
                                    placeholder="Select Transfer Note No" appendTo="body"
                                    [(ngModel)]="master.transectionSelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>

                </div>
            </form>
        </fieldset>
    </nb-card-header>
</nb-card>

<div class="row" *ngIf="!show">
    <div class="col-12">
        <nb-card class="min-height">
            <fieldset [disabled]="disabled ? 'disabled' : null">
                <nb-tabset>
                    <nb-tab tabTitle="Stock In Details" class="btn-tab">

                        <div class="grid-wrapper">
                            <table class=" table table-bordered table-striped">
                                <thead>
                                    <tr>
                                        <th>SN</th>
                                        <!-- <th>Product</th> -->
                                        <th>Product Name</th>
                                        <th>Pack Size</th>

                                        <th>MGF Date</th>
                                        <th>Expire Date</th>
                                        <th>Batch No.</th>
                                        <!-- <th>Batch Status</th> -->
                                        <th>MRP</th>
                                        <!-- <th>Current Stock</th> -->
                                        <th style="color: blue;">Transfer Qty. (Box)</th>
                                        <th style="color: blue;">Release Date</th>
                                        <th>Remarks</th>
                                        <th style="color: blue;">Approve</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr *ngFor="let detail of master.TransferDetailsList; let rowIndex = index">
                                        <td>{{rowIndex+1}}</td>
                                        <td>{{detail.sProductName}}</td>
                                        <td>{{detail.sPackSize}}</td>
                                        <td>{{detail.manufacturingDate}}</td>
                                        <td>{{detail.ExpireDate}}</td>
                                        <td>{{detail.batchNo}}</td>
                                        <!-- <td>{{detail.batchStatus}}</td> -->
                                        <td>{{detail.MRP}}</td>
                                        <!-- <td>{{detail.CurrentStock}} </td> -->

                                        <td style="color: blue;"><b>{{detail.noOfBox}}</b> </td>
                                        <td style="color: blue;">
                                            <input required [(ngModel)]="detail.ReleaseDate" name="ReleaseDate"
                                                id="ReleaseDate" [nbDatepicker]="ReleaseDateP" nbInput fullWidth
                                                placeholder="Date" [ngModelOptions]="{standalone: true}">
                                            <nb-datepicker #ReleaseDateP></nb-datepicker>
                                        </td>
                                        <td style="width: 300px;">
                                            <input type="text" min="0" class="form-control"
                                                [(ngModel)]="detail.ReleaseRemarks" id="ReleaseRemarks"
                                                name="ReleaseRemarks" fullWidth placeholder="Remarks">
                                        </td>
                                        <td>
                                            <nb-checkbox name="isActive" id="isActive" status="success"
                                                [(ngModel)]="detail.isActive">
                                            </nb-checkbox>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </nb-tab>

                </nb-tabset>
            </fieldset>
        </nb-card>
    </div>
</div>
