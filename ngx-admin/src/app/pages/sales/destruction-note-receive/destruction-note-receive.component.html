<nb-card class="actions-card">
    <nb-card-header>{{pageNavigation}}
        <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
    </nb-card-header>
</nb-card>

<nb-card *ngIf="show">
    <nb-card-header class="text-right">
        <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
    </nb-card-header>
    <nb-card-body>
        <div class="grid-wrapper">
            <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
                [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
                [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
                (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
            </ag-grid-angular>
        </div>
    </nb-card-body>
</nb-card>


<div class="row" *ngIf="!show">
    <div class="col-sm-12 col-md-12 col-lg-12">

        <nb-card>
            <nb-card-header>
                <fieldset [disabled]="disabled ? 'disabled' : null">
                    <!-- <form #masterForm="ngForm" novalidate> -->

                    <div class="row">
                        <div class="col-lg-8 col-md-8 col-sm-8">
                            <div class="form-group row">
                                <label for="typeId" class="col-sm-3 col-form-label">Destruction
                                    No.<span>*</span></label>
                                <div class="col-sm-9">
                                    <ng-select nbselect name="typeId" bindLabel="name" [items]="DestructionNoteNoList"
                                        [(ngModel)]="DestructionNoteSelected"
                                        (change)="(master.damageExpireProductReturnMasterId = this.$event.id);(master.miscellaneousType = this.$event.miscellaneousType);(master.miscellaneousTypeId = this.$event.miscellaneousTypeId);GetDestructionDetails();"
                                        [ngModelOptions]="{standalone: true}" id="typeId" placeholder="Select any"
                                        appendTo="body" required>
                                    </ng-select>
                                </div>
                            </div>
                        </div>

                        <div class="col-lg-4 col-md-4 col-sm-4">
                            <div class="form-group row">
                                <label class="col-sm-3 col-form-label" for="destructionNoteReceiveDate">Date
                                    <span>*</span></label>
                                <div class="col-sm-9">
                                    <input required [(ngModel)]="master.destructionNoteReceiveDate"
                                        [nbDatepicker]="destructionNoteReceiveDate" nbInput fullWidth placeholder="Date"
                                        [ngModelOptions]="{standalone: true}" readonly>
                                    <nb-datepicker #destructionNoteReceiveDate></nb-datepicker>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- </form> -->
                </fieldset>
            </nb-card-header>
        </nb-card>

        <div class="row" *ngIf="!show">
            <div class="col-sm-12 col-md-12 col-lg-12">
                <nb-card class="min-height">
                    <fieldset [disabled]="disabled ? 'disabled' : null">
                        <nb-tabset>
                            <nb-tab tabTitle="{{master.miscellaneousType}} Product(s) List For Receive" class="btn-tab">
                                <div class="grid-wrapper" style="overflow-y:scroll ; max-height: 500px">
                                    <table class=" table table-bordered table-striped">
                                        <tr>
                                            <th>#</th>
                                            <th>Code</th>
                                            <th>Product Name</th>
                                            <th>Pack Size</th>
                                            <th>Qty.</th>
                                            <!-- <th>Value</th> -->
                                        </tr>

                                        <tr *ngFor="let details of master.lstMasterViewModel; let rowIndex = index">
                                            <td>{{rowIndex+1}}</td>
                                            <!-- <td>
                                                <nb-checkbox name="isSelect" id="isSelect" status="success"
                                                    [(ngModel)]="details.isSelect"></nb-checkbox>
                                            </td> -->
                                            <td>{{details.skuNumber}}</td>
                                            <td>{{details.productName}}</td>
                                            <td>{{details.packSize}}</td>
                                            <td>{{details.ttlQty}}</td>
                                            <!-- <td>{{details.totalAmount}}</td> -->
                                        </tr>
                                    </table>
                                </div>
                            </nb-tab>
                        </nb-tabset>
                    </fieldset>
                </nb-card>
            </div>
        </div>
    </div>
</div>
