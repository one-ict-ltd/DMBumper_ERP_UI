<nb-card class="actions-card">
    <nb-card-header>{{pageNavigation}}
        <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
    </nb-card-header>
</nb-card>

<nb-card *ngIf="show">
    <nb-card-header class="text-right">
        <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
    </nb-card-header>
    <nb-card-body>
        <div class="grid-wrapper">
            <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
                [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
                [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
                (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
            </ag-grid-angular>
        </div>
    </nb-card-body>
</nb-card>

<nb-card *ngIf="!show">
    <nb-card-header>
        <fieldset [disabled]="disabled ? 'disabled' : null">
            <form #masterForm="ngForm" novalidate>
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group row">
                            <label for="executiveId" class="col-sm-3 col-form-label">Executive
                                <span>*</span></label>
                            <div class="col-sm-9">
                                <ng-select [disabled]="disabled ? 'disabled' : null" nbselect [items]="EmployeeList"
                                    bindLabel="name" [ngModelOptions]="{standalone: true}" id="executiveId"
                                    placeholder="Select Executive" appendTo="body" [(ngModel)]="selectedEmployee">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group row">
                            <label class="col-form-label" for="productId" class="col-sm-3 col-form-label">Product
                                <span>*</span></label>
                            <div class="col-sm-6">
                                <ng-select [disabled]="disabled ? 'disabled' : null" nbselect [items]="products"
                                    name="productId" bindLabel="name" [ngModelOptions]="{standalone: true}"
                                    id="productId" placeholder="Select Product" appendTo="body"
                                    [(ngModel)]="selectedProduct">
                                </ng-select>
                            </div>
                            <div class="col-sm-3">
                                <button (click)="addDetails(dialog)" class="btn btn-warning btn-sm"><i
                                        class="fa fa-plus" aria-hidden="true"></i>
                                    Add
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </fieldset>
    </nb-card-header>
</nb-card>

<div class="row" *ngIf="!show">
    <div class="col-md-12 col-lg-12">
        <nb-card class="min-height">
            <fieldset [disabled]="disabled ? 'disabled' : null">
                <nb-tabset>
                    <nb-tab tabTitle="Executive Wise Product Details" class="btn-tab">
                        <div class="grid-wrapper">
                            <table class=" table table-bordered table-striped">
                                <tr>
                                    <th>SN</th>
                                    <th>Executive Name</th>
                                    <th>Product Name</th>
                                </tr>
                                <tr *ngFor="let detail of master.lstDetails; let rowIndex = index">
                                    <td>{{rowIndex+1}}</td>
                                    <td> {{detail.employeeName}} </td>
                                    <td> {{detail.productName}} </td>
                                    <td>
                                        <button (click)="deleteDetail(rowIndex)" class="btn btn-danger btn-sm m-1">
                                            <i class="fa fa-trash" aria-hidden="true"></i>
                                        </button>
                                    </td>
                                </tr>
                            </table>
                        </div>
                    </nb-tab>
                </nb-tabset>
            </fieldset>
        </nb-card>
    </div>
</div>
