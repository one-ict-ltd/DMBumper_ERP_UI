<nb-card class="actions-card">
  <nb-card-header>{{pageNavigation}}
    <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
  </nb-card-header>
</nb-card>

<nb-card *ngIf="show">
  <nb-card-header class="text-right">
    <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
  </nb-card-header>
  <nb-card-body>
    <div class="row">
      <div class="col-lg-4 col-md-4 col-sm-4">
        <div class="form-group row">
          <label class="col-sm-4 col-form-label" for="salesInvoiceDate">From Date <span>*</span></label>
          <div class="col-sm-8">
            <input required [(ngModel)]="loadFromDateShow" name="loadFromDateShow" id="loadFromDateShow"
              [nbDatepicker]="idatepicker" nbInput fullWidth placeholder="Date" [ngModelOptions]="{standalone: true}">
            <nb-datepicker #idatepicker></nb-datepicker>
          </div>
        </div>
      </div>
      <div class="col-lg-4 col-md-4 col-sm-4">
        <div class="form-group row">
          <label class="col-sm-4 col-form-label" for="salesInvoiceDate">To Date <span>*</span></label>
          <div class="col-sm-8">
            <input required [(ngModel)]="loadToDateShow" name="loadToDateShow" id="loadToDateShow"
              [nbDatepicker]="idatepicker2" nbInput fullWidth placeholder="Date" [ngModelOptions]="{standalone: true}">
            <nb-datepicker #idatepicker2></nb-datepicker>
          </div>
        </div>
      </div>
      <div class="col-lg-4 col-md-4 col-sm-4">
        <div class="form-group row !important">
          <button class="btn btn-info" (click)="GetGridData();">Search</button>
        </div>
      </div>
    </div>

    <div class="grid-wrapper">
      <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
        [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
        [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
        (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
      </ag-grid-angular>
    </div>

  </nb-card-body>
</nb-card>


<div class="row" *ngIf="!show">
  <div class="col-md-12">
    <nb-card>
      <nb-card-header>
        <fieldset [disabled]="disabled ? 'disabled' : null">
          <div class="row">

            <div class="col-lg-4 col-md-4 col-sm-4">
              <div class="form-group row">
                <label class="col-sm-12 col-form-label" for="territory">Territory <span class="text-danger">*</span></label>
                <div class="col-sm-12">
                  <ng-select nbselect [items]="territoryList" name="territory"
                    bindLabel="name" [ngModelOptions]="{standalone: true}" id="territory"
                    placeholder="Select product" appendTo="body" [(ngModel)]="territorySelected">
                  </ng-select>
                </div>
              </div>
            </div>
            <div class="col-lg-8 col-md-8 col-sm-8">
              <div class="form-group row">
                <label class="col-sm-12 col-form-label" for="productWiseSpecificationId">Product <span class="text-danger">*</span></label>
                <div class="col-sm-12">
                  <ng-select nbselect (change)="changeProductSpec($event)" [items]="productSpecList" name="productName"
                    bindLabel="name" [ngModelOptions]="{standalone: true}" id="productWiseSpecificationId"
                    placeholder="Select product" appendTo="body" [(ngModel)]="productSpecSelected">
                  </ng-select>
                </div>
              </div>
            </div>
            <div class="col-lg-4 col-md-4 col-sm-4">
              <div class="form-group row">
                <label class="col-sm-12 col-form-label" for="fromDate">From Date<span
                    class="text-danger">*</span></label>
                <div class="col-sm-12">
                  <input required [(ngModel)]="master.fromDate" name="fromDate" id="fromDate" [nbDatepicker]="fromDate"
                    nbInput fullWidth placeholder="From Date" [ngModelOptions]="{standalone: true}">
                  <nb-datepicker #fromDate></nb-datepicker>
                </div>
              </div>
            </div>
            <div class="col-lg-4 col-md-4 col-sm-4">
              <div class="form-group row">
                <label class="col-sm-12 col-form-label" for="toDate">To Date <span class="text-danger">*</span></label>
                <div class="col-sm-12">
                  <input required [(ngModel)]="master.toDate" name="toDate" id="toDate" [nbDatepicker]="toDate" nbInput
                    fullWidth placeholder="To Date" [ngModelOptions]="{standalone: true}">
                  <nb-datepicker #toDate></nb-datepicker>
                </div>
              </div>
            </div>
            <div class="col-lg-4 col-md-4 col-sm-4 text-right">
              <label class="col-sm-12 col-form-label" for="detailsButton"><span> </span></label>
              <button class="btn btn-success" type="button" id="detailsButton" (click)="addDetails()"><i class="fa fa-plus"
                  aria-hidden="true"></i> Add</button>
            </div>
          </div>
        </fieldset>
      </nb-card-header>
    </nb-card>

  </div>

  <div class="col-md-12">
    <nb-card>
      <nb-card-body>
        <div class="grid-wrapper">
          <table class=" table table-bordered table-striped">
            <tr>
              <th>#</th>
              <th>Territory</th>
              <th>Product Name</th>
              <th>From Date</th>
              <th>To Date</th>
              <th style="width: 90px;">Action</th>
            </tr>

            <tr *ngFor="let details of master.lstProductMonitor; let rowIndex = index">
              <td>{{rowIndex+1}}</td>
              <td>{{details.territoryName}}</td>
              <td>{{details.productName}}</td>
              <td>{{details.fromDate}}</td>
              <td>{{details.toDate}}</td>
              <td>
                <button (click)="deleteDetails(rowIndex)" class="btn btn-danger btn-sm m-1">
                  <i class="fa fa-trash" aria-hidden="true"></i>
                </button>
              </td>
            </tr>
          </table>
        </div>
      </nb-card-body>
    </nb-card>
  </div>
</div>
