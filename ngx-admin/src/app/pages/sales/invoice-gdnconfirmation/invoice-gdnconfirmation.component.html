<nb-card class="actions-card">
    <nb-card-header>{{pageNavigation}}
        <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
    </nb-card-header>
</nb-card>

<nb-card *ngIf="show">
    <nb-card-header class="text-right">
        <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
    </nb-card-header>
    <nb-card-body>
        <div class="row">
            <div class="col-lg-4 col-md-4 col-sm-4">
                <div class="form-group row">
                    <label class="col-sm-4 col-form-label" for="salesInvoiceDate">From Date <span>*</span></label>
                    <div class="col-sm-8">
                        <input required [(ngModel)]="fDate" name="loadFromDateShow" id="loadFromDateShow"
                            [nbDatepicker]="idatepicker" nbInput fullWidth placeholder="Date"
                            [ngModelOptions]="{standalone: true}">
                        <nb-datepicker #idatepicker></nb-datepicker>
                    </div>
                </div>
            </div>
            <div class="col-lg-4 col-md-4 col-sm-4">
                <div class="form-group row">
                    <label class="col-sm-4 col-form-label" for="salesInvoiceDate">To Date <span>*</span></label>
                    <div class="col-sm-8">
                        <input required [(ngModel)]="tDate" name="loadToDateShow" id="loadToDateShow"
                            [nbDatepicker]="idatepicker2" nbInput fullWidth placeholder="Date"
                            [ngModelOptions]="{standalone: true}">
                        <nb-datepicker #idatepicker2></nb-datepicker>
                    </div>
                </div>
            </div>
            <div class="col-lg-4 col-md-4 col-sm-4">
                <div class="form-group row !important">
                    <button class="btn btn-info" (click)="loadListData();">Search</button>
                </div>
            </div>
        </div>
        <div class="grid-wrapper">
            <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
                [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
                [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
                (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
            </ag-grid-angular>
        </div>
    </nb-card-body>
</nb-card>


<div class="row" *ngIf="!show">
    <div class="col-12">
        <nb-card class="min-height">
            <fieldset [disabled]="disabled ? 'disabled' : null">
                <nb-tabset>
                    <nb-tab tabTitle="Invoice GDN Confirmation" class="btn-tab">


                        <div class="row">
                            <div class="col-4">
                                <div class="form-group row">
                                    <label for="isConfirmed" class="col-sm-4 col-form-label">GDN Type</label>
                                    <div class="col-sm-8">
                                        <ng-select nbselect (change)="(master.isConfirmed = this.$event.id);"
                                            [items]="listOfConfirmation" name="name" bindLabel="name" [ngModelOptions]="{standalone:
                                          true}" id="confirmedId" placeholder="Select a Type" appendTo="body"
                                            [(ngModel)]="master.confirmedSelected" [aria-readonly]="true" disabled>
                                        </ng-select>
                                    </div>
                                </div>
                            </div>
                            <div class="col-4">
                                <div class="form-group row">
                                    <label class="col-sm-4 col-form-label" for="pickingDate">From Date
                                        <span>*</span></label>
                                    <div class="col-sm-8">
                                        <input required [(ngModel)]="master.fDate"
                                            (ngModelChange)="GetSalesInvoiceMasterListByTerritory(0);"
                                            name="pickingDate" id="pickingfDate" [nbDatepicker]="dpfPickingDate" nbInput
                                            readonly fullWidth placeholder="Date" [ngModelOptions]="{standalone: true}">
                                        <nb-datepicker #dpfPickingDate></nb-datepicker>
                                    </div>
                                </div>
                            </div>
                            <div class="col-4">
                                <div class="form-group row">
                                    <label class="col-sm-4 col-form-label" for="pickingDate">To Date
                                        <span>*</span></label>
                                    <div class="col-sm-8">
                                        <input required [(ngModel)]="master.tDate"
                                            (ngModelChange)="GetSalesInvoiceMasterListByTerritory(0);"
                                            name="pickingDate" id="pickingtDate" [nbDatepicker]="dptPickingDate" nbInput
                                            readonly fullWidth placeholder="Date" [ngModelOptions]="{standalone: true}">
                                        <nb-datepicker #dptPickingDate></nb-datepicker>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- <div class="grid-wrapper" style="overflow-y:scroll ; max-height: 300px">
                          <table class=" table table-bordered table-striped"> -->
                        <div class="table-wrapper-scroll-y my-custom-scrollbar">
                            <div class="grid-wrapper" style="overflow-y:scroll; max-height: 400px">
                                <table class=" table table-bordered table-striped" [virtualScroll]="true">
                                    <thead>
                                        <tr>
                                            <th>#</th>
                                            <th>
                                                <nb-checkbox name="isSelectAll" id="isSelectAll" status="warning"
                                                    [(ngModel)]="isSelectAll" (change)="selectAll($event)">
                                                </nb-checkbox> All
                                            </th>
                                            <th>Territory</th>
                                            <th>Sales Invoice No.</th>
                                            <th>Invoice Date</th>
                                            <th>Party Name</th>
                                            <!-- <th>Mobile No.</th> -->
                                            <!-- <th>Product(s) Name</th> -->
                                            <!-- <th>Invoice Amount</th> -->
                                            <th>Status</th>
                                            <!-- <th>ViewDetails</th> -->
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr *ngFor="let details of master.lstMasterViewModel; let rowIndex = index">
                                            <td>
                                                {{rowIndex+1}}
                                            </td>
                                            <td>
                                                <nb-checkbox name="isSelect" id="isSelect" status="success"
                                                    [(ngModel)]="details.isSelect"
                                                    (change)="AddProduct($event,details.salesInvoiceId)">
                                                </nb-checkbox>
                                            </td>
                                            <td>
                                                {{details.TerritoryName}}
                                            </td>
                                            <td>
                                                {{details.salesInvoiceNo}}
                                            </td>
                                            <td>
                                                {{details.salesInvoiceDate}}
                                            </td>
                                            <td>
                                                {{details.partyName}}
                                            </td>
                                            <!-- <td> {{details.mobileNo}} </td> -->
                                            <!-- <td [innerHTML]="details.productName"> </td> -->

                                            <!-- <td style="text-align: center;">
                                                {{details.grandTotal}}
                                            </td> -->
                                            <td>
                                                {{details.approvalStatus}}
                                            </td>
                                            <!-- <td>
                                      <button class="btn btn-warning m-0 !important"
                                          (click)="ViewDetails(dialog, details.salesInvoiceId)">Details</button>
                                  </td> -->

                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-8"></div>
                            <div class="col-4"><b>Total Invoice(s) : <span>{{totalRows}}</span></b>
                            </div>
                        </div>
                    </nb-tab>
                </nb-tabset>
            </fieldset>
        </nb-card>
    </div>
</div>
