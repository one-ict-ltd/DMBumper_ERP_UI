<nb-card class="actions-card">
    <nb-card-header>{{pageNavigation}}
        <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
    </nb-card-header>
</nb-card>

<nb-card *ngIf="show">
    <nb-card-header class="text-right">
        <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
    </nb-card-header>
    <nb-card-body>
        <div class="row">
            <div class="col-lg-4 col-md-4 col-sm-4">
                <div class="form-group row">
                    <label class="col-sm-4 col-form-label" for="salesInvoiceDate">From Date <span>*</span></label>
                    <div class="col-sm-8">
                        <input required [(ngModel)]="loadFromDateShow" name="loadFromDateShow" id="loadFromDateShow"
                            [nbDatepicker]="idatepicker" nbInput fullWidth placeholder="Date"
                            [ngModelOptions]="{standalone: true}">
                        <nb-datepicker #idatepicker></nb-datepicker>
                    </div>
                </div>
            </div>
            <div class="col-lg-4 col-md-4 col-sm-4">
                <div class="form-group row">
                    <label class="col-sm-4 col-form-label" for="salesInvoiceDate">To Date <span>*</span></label>
                    <div class="col-sm-8">
                        <input required [(ngModel)]="loadToDateShow" name="loadToDateShow" id="loadToDateShow"
                            [nbDatepicker]="idatepicker2" nbInput fullWidth placeholder="Date"
                            [ngModelOptions]="{standalone: true}">
                        <nb-datepicker #idatepicker2></nb-datepicker>
                    </div>
                </div>
            </div>
            <div class="col-lg-4 col-md-4 col-sm-4">
                <div class="form-group row !important">
                    <button class="btn btn-info" (click)="GetGridData();">Search</button>
                </div>
            </div>
        </div>
        <div class="grid-wrapper">
            <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
                [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
                [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
                (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
            </ag-grid-angular>
        </div>
    </nb-card-body>
</nb-card>

<nb-card *ngIf="!show">
    <nb-card-header>
        <fieldset [disabled]="disabled ? 'disabled' : null">
            <form #masterForm="ngForm" novalidate>

                <div class="row">
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label for="partyId" class="col-sm-3 col-form-label">
                                Is All Customer                               
                            </label>
                            <div class="col-sm-9">
                                <nb-checkbox [(ngModel)]="master.isAll" name="isAll" status="success"
                                    (change)="checkAll($event)"> </nb-checkbox>
                                <!-- <ng-select nbselect (change)="(master.partyId = this.$event.id);" [items]="parties"
                                    [virtualScroll]="true" name="partyId" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="partyId" placeholder="Select Customer"
                                    appendTo="body" [(ngModel)]="partiesSelected" required
                                    [disabled]="disabledNew ? 'disabledNew' : null">
                                </ng-select> -->
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label" for="depotCode">Depot<span>*</span></label>
                            <div class="col-sm-9">
                                <ng-select nbselect (change)="(depotCode= this.$event.id);getCustomerList();" [items]="depotList"
                                    name="depotCode" bindLabel="name" [ngModelOptions]="{standalone: true}" id="depotCode"
                                    placeholder="Select a Depot Name" appendTo="body" [(ngModel)]="depotSelected" [disabled]="disabledNew ? 'disabledNew' : null">
                                </ng-select>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label for="bonusforSpecificationId" class="col-sm-3 col-form-label">Select
                                Item<span>*</span></label>
                            <div class="col-sm-9">
                                <ng-select nbselect
                                    (change)="(master.bonusforSpecificationId = this.$event.id);ProductChange();"
                                    [items]="productSpecList" [virtualScroll]="true" name="bonusforSpecificationId"
                                    bindLabel="name" [ngModelOptions]="{standalone: true}" id="bonusforSpecificationId"
                                    placeholder="Select " appendTo="body" [(ngModel)]="productSpecListSelected"
                                    required>
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label for="partyId" class="col-sm-3 col-form-label">
                                <!-- Is All Customer <nb-checkbox [(ngModel)]="master.isAll" name="isAll" status="success"
                                    (change)="checkAll($event)">
                                </nb-checkbox> -->
                                Customer
                            </label>
                            <div class="col-sm-9">
                                <ng-select nbselect (change)="(master.partyId = this.$event.id);" [items]="parties"
                                    [virtualScroll]="true" name="partyId" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="partyId" placeholder="Select Customer"
                                    appendTo="body" [(ngModel)]="partiesSelected" required
                                    [disabled]="disabledNew ? 'disabledNew' : null">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label" for="forQuantity">Quantity For</label>
                            <div class="col-sm-9">
                                <input type="number" class="form-control" [(ngModel)]="master.forQuantity"
                                    id="forQuantity" name="forQuantity" nbInput fullWidth placeholder="Quantity For">
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-8 col-sm-12" hidden>
                        <div class="form-group row">
                            <label for="bonusSpecificationId" class="col-sm-3 col-form-label">Discount
                                Item<span>*</span></label>
                            <div class="col-sm-9">
                                <ng-select nbselect (change)="(master.bonusSpecificationId = this.$event.id);"
                                    [items]="productSpecList" [virtualScroll]="true" name="bonusSpecificationId"
                                    bindLabel="name" [ngModelOptions]="{standalone: true}" id="bonusSpecificationId"
                                    placeholder="Select " appendTo="body" [(ngModel)]="productSpecListBonusSelected"
                                    required [readonly]="true"
                                    >
                                </ng-select>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label" for="quantity">Bonus Quantity</label>
                            <div class="col-sm-9">
                                <input type="number" class="form-control" [(ngModel)]="master.quantity" id="quantity"
                                    name="quantity" nbInput fullWidth placeholder="Bonus Quantity">
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-8 col-sm-12" hidden>
                        <div class="form-group row">
                            <label for="" class="col-sm-5 col-form-label"> Is Active ?</label>
                            <div class="col-sm-7">
                                <div class="validation-checkboxes">
                                    <nb-checkbox [(ngModel)]="master.isActive" name="checkbox" status="success">
                                    </nb-checkbox>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label" for="fromDate">Start Date <span>*</span></label>
                            <div class="col-sm-9">
                                <input required [(ngModel)]="master.fromDate" [nbDatepicker]="fromDate" nbInput
                                    fullWidth placeholder="start Date" [ngModelOptions]="{standalone: true}">
                                <nb-datepicker #fromDate></nb-datepicker>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label" for="endDate">End Date <span>*</span> </label>
                            <div class="col-sm-9">
                                <input required [(ngModel)]="master.endDate" [nbDatepicker]="endDate" nbInput fullWidth
                                    placeholder="end Date" [ngModelOptions]="{standalone: true}">
                                <nb-datepicker #endDate></nb-datepicker>
                            </div>
                        </div>
                    </div>

                </div>
            </form>
        </fieldset>
    </nb-card-header>
</nb-card>
