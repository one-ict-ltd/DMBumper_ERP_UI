<nb-card class="actions-card">
    <nb-card-header><b>{{pageNavigation}}</b>
        <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
    </nb-card-header>
</nb-card>

<nb-card *ngIf="show">
    <nb-card-header class="text-right">
        <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
    </nb-card-header>
    <nb-card-body>
        <div class="row">
            <div class="col-4">
                <div class="form-group row">
                    <label class="col-4 col-form-label" for="grdFromDate">From Date <span>*</span></label>
                    <div class="col-8">
                        <input required [(ngModel)]="grdFromDate" name="grdFromDate" id="grdFromDate"
                            [nbDatepicker]="idatepicker" nbInput fullWidth placeholder="Date"
                            [ngModelOptions]="{standalone: true}">
                        <nb-datepicker #idatepicker></nb-datepicker>
                    </div>
                </div>
            </div>
            <div class="col-4">
                <div class="form-group row">
                    <label class="col-4 col-form-label" for="grdToDate">To Date <span>*</span></label>
                    <div class="col-8">
                        <input required [(ngModel)]="grdToDate" name="grdToDate" id="grdToDate"
                            [nbDatepicker]="idatepicker2" nbInput fullWidth placeholder="Date"
                            [ngModelOptions]="{standalone: true}">
                        <nb-datepicker #idatepicker2></nb-datepicker>
                    </div>
                </div>
            </div>
            <div class="col-4">
                <div class="form-group row !important">
                    <button class="btn btn-info" (click)="GetGridData();">Search</button>
                </div>
            </div>
        </div>
        <div class="grid-wrapper">
            <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
                [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
                [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
                (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
            </ag-grid-angular>
        </div>
    </nb-card-body>
</nb-card>

<nb-card class="actions-card" *ngIf="!show">
    <nb-card-body>
        <div class="row">
            <div class="col-6">
                <div class="form-group row">
                    <label class="col-4 col-form-label" for="moneyReceiptDate">Receipt Date
                        <span>*</span></label>
                    <div class="col-8">
                        <input required [(ngModel)]="master.moneyReceiptDate" (ngModelChange)="ChangeNumber();"
                            [nbDatepicker]="moneyReceiptDate" nbInput fullWidth placeholder="Date"
                            [ngModelOptions]="{standalone: true}" readonly>
                        <nb-datepicker #moneyReceiptDate [min]="minDate" [max]="maxDate"></nb-datepicker>
                    </div>
                </div>
            </div>
            <div class="col-6">
                <div class="form-group row">
                    <label class="col-4 col-form-label" for="receiptNo">Receipt Number<span> *</span></label>
                    <div class="col-8">
                        <input type="text" class="form-control" [(ngModel)]="master.receiptNo" id="receiptNo"
                            name="receiptNo" nbInput fullWidth placeholder="Money Receipt Number" readonly>
                    </div>
                </div>
            </div>
            <div class="col-6">
                <div class="form-group row">
                    <label class="col-4 col-form-label" for="depotCode">Depot <span>*</span></label>
                    <div class="col-8">
                        <ng-select nbselect (change)="(master.depotCode = $event.id);getAllTerritory($event.id);"
                            [items]="depotList" name="depotCode" bindLabel="name" [ngModelOptions]="{standalone: true}"
                            id="depotCode" placeholder="Select Depot Name" appendTo="body" [(ngModel)]="depotSelected">
                        </ng-select>
                    </div>
                </div>
            </div>
            <div class="col-6">
                <div class="form-group row">
                    <label class="col-4 col-form-label" for="partyId">Territory <span> *</span></label>
                    <div class="col-8">
                        <ng-select nbselect (change)="(master.territoryCode = $event.id);GetAllMIOByTerritory();"
                            [items]="territoryList" [virtualScroll]="true" name="territoryCode" bindLabel="name"
                            [ngModelOptions]="{standalone: true}" id="territoryCode" placeholder="Select territory"
                            appendTo="body" [(ngModel)]="territorySelected">
                        </ng-select>
                    </div>
                </div>
            </div>
            <div class="col-6">
                <div class="form-group row">
                    <label for="mioCode" class="col-4 col-form-label">MIO Name <span> *</span></label>
                    <div class="col-8">
                        <ng-select nbselect [items]="mioList" (change)="(master.mioCode = $event.id);" name="mioCode"
                            bindLabel="name" id="mioCode" [(ngModel)]="mioSelected"
                            [ngModelOptions]="{standalone: true}" placeholder="Select a MIO" [virtualScroll]="true"
                            appendTo="body">
                        </ng-select>
                    </div>
                </div>
            </div>
            <div class="col-6">
                <div class="form-group row">
                    <label for="mrTypeId" class="col-4 col-form-label">Money Receipt Type <span> *</span></label>
                    <div class="col-8">
                        <ng-select nbselect [items]="mrTypeList" (change)="(master.mrTypeId = $event.id);"
                            name="mrTypeId" bindLabel="name" id="mrTypeId" [(ngModel)]="mrTypeSelected"
                            [ngModelOptions]="{standalone: true}" placeholder="Select a receipt type"
                            [virtualScroll]="true" appendTo="body">
                        </ng-select>
                    </div>
                </div>
            </div>
            <div class="col-6">
                <div class="form-group row">
                    <label for="moneyBook" class="col-4 col-form-label">Money Received Book
                        <span> *</span></label>
                    <div class="col-8">
                        <input type="text" class="form-control" [(ngModel)]="master.moneyBook" id="moneyBook"
                            name="moneyBook" fullWidth placeholder="Money Received Book">
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-6">
                <div class="form-group row">
                    <label for="fromNumber" class="col-4 col-form-label">From Number
                        <span> *</span></label>
                    <div class="col-8">
                        <input type="number" class="form-control" [(ngModel)]="master.fromNumber" id="fromNumber"
                            name="fromNumber" fullWidth placeholder="From Number">
                    </div>
                </div>
            </div>
            <div class="col-6">
                <div class="form-group row">
                    <label for="moneyBook" class="col-4 col-form-label">To Number
                        <span> *</span></label>
                    <div class="col-8">
                        <input type="number" class="form-control" [(ngModel)]="master.toNumber" id="toNumber"
                            name="toNumber" fullWidth placeholder="To Number">
                    </div>
                </div>
            </div>
            <div class="col-12">
                <div style="text-align: center;">
                  <button (click)="addToDetailsGrid(dialog)" class="btn btn-success btn-sm m-3"> <i class="fa fa-plus"
                      aria-hidden="true"></i> Add </button>
                </div>
              </div>
        </div>
    </nb-card-body>
</nb-card>

<div class="row" *ngIf="!show">
    <div class="col-md-12 col-lg-12">
      <nb-card class="min-height">
        <fieldset [disabled]="disabled ? 'disabled' : null">
          <nb-tabset>
            <nb-tab tabTitle="Money Received No." class="btn-tab">
              <div class="row">
              </div>
              <div class="grid-wrapper">
                <div class="table-container">
                <table class="table table-sm table table-bordered table-striped">
                  <tr>
                    <th style="width: 5%;">#</th>
                    
                  </tr>
                  <tr *ngFor="let detail of master.lstDetailsViewModel">
                    <td>{{detail.number}}</td>
                  </tr>
                </table>
            </div>
              </div>
            </nb-tab>
          </nb-tabset>
        </fieldset>
      </nb-card>
    </div>
</div>
