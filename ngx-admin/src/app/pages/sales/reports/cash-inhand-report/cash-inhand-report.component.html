<nb-card class="actions-card">
  <nb-card-header>{{pageNavigation}}
    <ngx-report-button (click)="RptButtonAction()"></ngx-report-button>
  </nb-card-header>
  <nb-card-body>


    <div class="row">

      <div class="col-lg-6 col-md-6 col-sm-6">
        <div class="form-group row">
          <label class="col-sm-4 col-form-label" for="depotCode">Depot <span>*</span></label>
          <div class="col-sm-8">
            <ng-select nbselect (change)="depotCode = $event.id;" [items]="depotList" name="depotCode" bindLabel="name"
              [ngModelOptions]="{standalone: true}" id="depotCode" placeholder="Select Depot Name" appendTo="body"
              [(ngModel)]="depotSelected">
            </ng-select>
          </div>
        </div>
      </div>

      <div class="col-6">
        <div class="form-group row">
          <label for="fromdateSelected" class="col-sm-4 col-form-label">As On Date <span>*</span></label>
          <div class="col-sm-8">
            <input required [(ngModel)]="fDate" [nbDatepicker]="fdatepicker" nbInput fullWidth placeholder="From Date"
              [ngModelOptions]="{standalone: true}">
            <nb-datepicker #fdatepicker></nb-datepicker>
          </div>
        </div>
      </div>


    </div>
    <form [formGroup]="formSalesRemittanceSummary" hidden>
      <div class="row">
        <div class="col-lg-4 col-md-4 col-sm-4">
          <div class="form-group row">
            <label class="col-sm-12 col-form-label" for="depotCode">Depot<span class="text-danger">*</span></label>
            <div class="col-sm-12">
              <ng-select nbselect [items]="depotList" [virtualScroll]="true" formControlName="depotCode"
                bindValue="value"
                [ngClass]="formSalesRemittanceSummary.get('depotCode').errors?.required && submitted ? 'is-invalid':'is-valid'"
                bindLabel="text" id="depoCode" placeholder="Select Depot" appendTo="body">
              </ng-select>
            </div>
          </div>
        </div>


        <div class="col-lg-4 col-md-4 col-sm-4">
          <div class="form-group row">
            <label class="col-sm-12 col-form-label" for="fromDate">From Date<span class="text-danger">*</span></label>
            <div class="col-sm-12">
              <input id="fromDate" [nbDatepicker]="fromDate" nbInput fullWidth placeholder="Date"
                formControlName="fromDate" readonly
                [status]="formSalesRemittanceSummary.get('fromDate').errors?.required && submitted ? 'danger':''">
              <nb-datepicker #fromDate></nb-datepicker>
            </div>
          </div>
        </div>

      </div>
    </form>

    <!-- <div class="grid-wrapper" *ngIf="showbody" hidden>
      <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [columnDefs]="columnDefs"
        [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData" pagination='true'>
      </ag-grid-angular>
    </div> -->
  </nb-card-body>
</nb-card>



<nb-card *ngIf="showbody">
  <nb-card-header>
  </nb-card-header>
  <nb-card-body>
    <div class="table-wrapper-scroll-y my-custom-scrollbar">
      <table id="simple_table" #simple_table #table class="table table-bordered mb-0">
        <thead>
          <tr>
            <th colspan="3" class="reportHeaderClass" style="font: bold; text-align: center;">
              <h4>{{companyName}}</h4>
            </th>
          </tr>

          <tr>
            <th colspan="3" class="reportHeaderClass">{{reportTitleName}}</th>
          </tr>
          <tr>
            <th colspan="3" class="reportHeaderClass">{{dateRange}}</th>
          </tr>

          <tr>
            <th colspan="3" class="reportHeaderClass"></th>
          </tr>

          <tr>
            <th *ngFor="let item of tableHeaderP; let i = index;">{{item}}</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let item of bodyData; let i = index;">
            <td>{{item.sl}}</td>
            <td>{{item.DepotName}}</td>
            <td style="text-align: right;">{{item.CashInHand}}</td>
          </tr>

          <tr>
            <td colspan="2" style="font-weight: bold;">Total</td>
            <td style="font-weight: bold;text-align: right;">{{totalCashInHandAmount}}</td>

          </tr>
        </tbody>
      </table>
    </div>
  </nb-card-body>
  <nb-card-footer>
  </nb-card-footer>
</nb-card>
