<nb-card class="actions-card">
    <nb-card-header>{{pageNavigation}}
        <ngx-report-button (click)="RptButtonAction()"></ngx-report-button>
    </nb-card-header>
    <nb-card-body>
        <div class="row">
            <div class="col-lg-6 col-md-6 col-sm-6">
                <div class="form-group row">
                    <label class="col-sm-4 col-form-label" for="reportType">Report Type <span>*</span></label>
                    <div class="col-sm-8">
                        <ng-select nbselect (change)="reportType=$event.id" [items]="reportTypeList" name="reportType"
                            bindLabel="name" [ngModelOptions]="{standalone: true}" id="reportType"
                            placeholder="Select Report Type" appendTo="body" [(ngModel)]="reportTypeSelected">
                        </ng-select>
                    </div>
                </div>
            </div>
            <div class="col-lg-6 col-md-6 col-sm-6">
                <div class="form-group row">
                    <label class="col-sm-4 col-form-label" for="mioType">MIO Type <span>*</span></label>
                    <div class="col-sm-8">
                        <ng-select nbselect (change)="mioType=$event.id" [items]="mioTypeList" name="mioType"
                            bindLabel="name" [ngModelOptions]="{standalone: true}" id="mioType"
                            placeholder="Select MIO Type" appendTo="body" [(ngModel)]="mioTypeSelected">
                        </ng-select>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-6 col-md-6 col-sm-6">
                <div class="form-group row">
                    <label class="col-sm-4 col-form-label" for="zoneCode">Zone</label>
                    <div class="col-sm-8">
                        <ng-select nbselect (change)="GetAllRegion(zoneCode = $event.id);" [items]="zoneList"
                            name="zoneCode" bindLabel="name" [ngModelOptions]="{standalone: true}" id="zoneCode"
                            placeholder="Select Zone" appendTo="body" [(ngModel)]="zoneSelected">
                        </ng-select>
                    </div>
                </div>
            </div>
            <div class="col-lg-6 col-md-6 col-sm-6">
                <div class="form-group row">
                    <label class="col-sm-4 col-form-label" for="regionCode">Region</label>
                    <div class="col-sm-8">
                        <ng-select nbselect (change)="regionCode = $event.id;getAllArea($event.id);"
                            [items]="regionList" [virtualScroll]="true" name="regionCode" bindLabel="name"
                            [ngModelOptions]="{standalone: true}" id="regionCode" placeholder="Select Region"
                            appendTo="body" [(ngModel)]="regionSelected">
                        </ng-select>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-6 col-md-6 col-sm-6">
                <div class="form-group row">
                    <label class="col-sm-4 col-form-label" for="areaCode">Area</label>
                    <div class="col-sm-8">
                        <ng-select nbselect (change)="areaCode = $event.id;getAllTerritory($event.id);"
                            [items]="areaList" name="areaCode" bindLabel="name" [ngModelOptions]="{standalone: true}"
                            id="areaCode" placeholder="Select Area" appendTo="body" [(ngModel)]="areaSelected">
                        </ng-select>
                    </div>
                </div>
            </div>
            <div class="col-lg-6 col-md-6 col-sm-6">
                <div class="form-group row">
                    <label class="col-sm-4 col-form-label" for="territoryCode">Territory</label>
                    <div class="col-sm-8">
                        <ng-select nbselect (change)="territoryCode = $event.id;" [items]="territoryList"
                            [virtualScroll]="true" name="territoryCode" bindLabel="name"
                            [ngModelOptions]="{standalone: true}" id="territoryCode" placeholder="Select Territory"
                            appendTo="body" [(ngModel)]="territorySelected">
                        </ng-select>
                    </div>
                </div>
            </div>
        </div>
        <div class="row" hidden>
            <div class="col-12">
                <div class="form-group row">
                    <label for="partyId" class="col-2 col-form-label">Customer Name <span>*</span></label>
                    <div class="col-sm-10">
                        <ng-select nbselect [items]="parties" [virtualScroll]="true" name="partyId" bindLabel="name"
                            id="partyId" [(ngModel)]="partySelected" [ngModelOptions]="{standalone: true}"
                            placeholder="Select Customer" [virtualScroll]="true" appendTo="body">
                        </ng-select>
                    </div>
                </div>
            </div>
        </div>
        <div class="row" hidden>
            <div class="col-12">
                <div class="form-group row">
                    <label for="checkbox" class="col-sm-2 col-form-label">Show Date Range</label>
                    <div class="col-sm-10">
                        <div class="validation-checkboxes">
                            <nb-checkbox [(ngModel)]="showDateRange" name="checkbox" status="success"
                                (change)="onCheckboxChange($event)">
                            </nb-checkbox>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-6">
                <div class="form-group row">
                    <label for="fromdateSelected" class="col-sm-4 col-form-label">From Date <span>*</span></label>
                    <div class="col-sm-8">
                        <input required [(ngModel)]="fDate" [nbDatepicker]="fdatepicker" nbInput fullWidth
                            placeholder="From Date" [ngModelOptions]="{standalone: true}">
                        <nb-datepicker #fdatepicker></nb-datepicker>
                    </div>
                </div>
            </div>
            <div class="col-6">
                <div class="form-group row">
                    <label for="todateSelected" class="col-sm-4 col-form-label">To Date <span>*</span></label>
                    <div class="col-sm-8">
                        <input required [(ngModel)]="tDate" [nbDatepicker]="datepicker" nbInput fullWidth
                            placeholder="To Date" [ngModelOptions]="{standalone: true}">
                        <nb-datepicker #datepicker></nb-datepicker>
                    </div>
                </div>
            </div>
        </div>
    </nb-card-body>
</nb-card>

<nb-card>
    <nb-card-header>
    </nb-card-header>
    <nb-card-body>
        <div class="row">
            <iframe id="pdfPreview" [src]="base64Pdf" frameborder="0" width="100%" height="480px">
            </iframe>
        </div>
    </nb-card-body>
    <nb-card-footer>
    </nb-card-footer>
</nb-card>
