<nb-card class="actions-card">
  <nb-card-header>{{pageNavigation}}
    <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
  </nb-card-header>
</nb-card>

<nb-card *ngIf="show">
  <nb-card-header class="text-right">
    <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
  </nb-card-header>
  <nb-card-body>
    <div class="grid-wrapper">
      <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
        [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
        [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
        (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
      </ag-grid-angular>
    </div>
  </nb-card-body>
</nb-card>

<nb-card *ngIf="!show">
  <nb-card-header>
    <fieldset [disabled]="disabled ? 'disabled' : null">
      <form #masterForm="ngForm">
        <div class="row">
          <div class="col-lg-4 col-md-4 col-sm-4">
            <div class="form-group row">
              <label for="ApprovalStatus" class="col-sm-12 col-form-label">Approval Status <span>*</span></label>
              <div class="col-sm-12">
                <ng-select nbselect [items]="ApprovalStatusList"
                  (change)="(master.approvalStatusValue = this.$event.id); (master.approvalStatus = this.$event.name);"
                  name="ApprovalStatus" bindLabel="name" [ngModelOptions]="{standalone: true}"
                  id="approvalStatus" placeholder="Select one" appendTo="body"
                  [(ngModel)]="ApprovalStatusSelected">
                </ng-select>
              </div>
            </div>
          </div>
        </div>
      </form>
    </fieldset>
  </nb-card-header>
</nb-card>

<div class="row" *ngIf="!show">
  <div class="col-sm-12 col-md-12 col-lg-12">
    <nb-card class="min-height">
      <fieldset [disabled]="disabled ? 'disabled' : null">
        <nb-tabset>
          <nb-tab tabTitle="Quotation List For Approval" class="btn-tab">
            <div class="grid-wrapper">
              <table class="table table-bordered table-striped">
                <thead>
                  <tr>
                    <th>#</th>
                    <th>Quotation No.</th>
                    <th>Date</th>
                    <th>Customer Name</th>
                    <th>Address</th>
                    <th class="text-right">Net Total</th>
                    <th>Status</th>
                    <th>Print</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let details of master.lstMasterViewModel; let rowIndex = index">
                    <td>{{rowIndex + 1}}</td>
                    <td>{{details.quotationNo}}</td>
                    <td>{{details.quotationDate}}</td>
                    <td>{{details.partyName}}</td>
                    <td>{{details.address}}</td>
                    <td class="text-right">{{details.grandTotal | number:'1.2-2'}}</td>
                    <td>{{details.approveStatus}}</td>
                    <td>
                      <button (click)="printQuotation(details.quotationMasterId)"
                        class="btn btn-warning btn-sm">Print</button>
                    </td>
                    <td>
                      <nb-checkbox name="isSelect" id="isSelect" status="success"
                        [(ngModel)]="details.isSelect" [ngModelOptions]="{standalone: true}">
                      </nb-checkbox>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </nb-tab>
        </nb-tabset>
      </fieldset>
    </nb-card>
  </div>
</div>
