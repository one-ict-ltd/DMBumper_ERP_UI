<nb-card class="actions-card">
    <nb-card-header>{{pageNavigation}}
        <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
    </nb-card-header>
</nb-card>

<nb-card *ngIf="show">
    <nb-card-header class="text-right">
        <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
    </nb-card-header>
    <nb-card-body>
        <div class="grid-wrapper">
            <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
                [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
                [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
                (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
            </ag-grid-angular>
        </div>
    </nb-card-body>
</nb-card>

<nb-card *ngIf="!show">
    <nb-card-header>
        <fieldset [disabled]="disabled ? 'disabled' : null">
            <form #masterForm="ngForm" novalidate>

                <div class="row">
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label for="type" class="col-sm-3 col-form-label">Depo
                                <span>*</span></label>
                            <div class="col-sm-9">
                                <ng-select nbselect
                                    (change)="(master.depotCode = this.$event.depotCode);getCustomerList(this.$event.depotCode)"
                                    [items]="DepoList" name="type" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="type" placeholder="Select Depo"
                                    appendTo="body" [(ngModel)]="master.DepoSelected" required>
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label for="partyId" class="col-sm-3 col-form-label">Party<span>*</span></label>
                            <div class="col-sm-9">
                                <ng-select nbselect (change)="(master.partyId = this.$event.id);" [items]="parties"
                                    name="partyId" bindLabel="name" [ngModelOptions]="{standalone: true}" id="partyId"
                                    placeholder="Select Party" appendTo="body" [(ngModel)]="master.PartySelected"
                                    required>
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label for="CustomerType" class="col-sm-3 col-form-label">
                                Party Type<span>*</span></label>
                            <div class="col-sm-9">
                                <ng-select nbselect (change)="(master.CustomerType = this.$event.name);"
                                    [items]="CustomerTypeList" name="CustomerType" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="CustomerType"
                                    placeholder="Select Party Type" appendTo="body"
                                    [(ngModel)]="master.CustomerTypeSelected" required>
                                </ng-select>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label" for="Balance">Bonus Type</label>
                            <div class="col-sm-9">
                                <ng-select nbselect (change)="(master.BonusType = this.$event.name);"
                                    [items]="BonusTypeList" name="BonusType" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="BonusType" placeholder="Select Bonus Type"
                                    appendTo="body" [(ngModel)]="master.BonusTypeSelected" required>
                                </ng-select>
                            </div>
                        </div>
                    </div>




                </div>
            </form>
        </fieldset>
    </nb-card-header>
</nb-card>
