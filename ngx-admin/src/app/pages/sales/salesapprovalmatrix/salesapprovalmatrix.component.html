<nb-card class="actions-card">
    <nb-card-header>{{pageNavigation}}
        <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
    </nb-card-header>
</nb-card>

<nb-card *ngIf="show">
    <nb-card-header class="text-right">
        <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
    </nb-card-header>
    <nb-card-body>
        <div class="grid-wrapper">
            <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
                [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
                [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
                (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
            </ag-grid-angular>
        </div>
    </nb-card-body>
</nb-card>

<nb-card *ngIf="!show">
    <nb-card-header>
        <fieldset [disabled]="disabled ? 'disabled' : null">
            <form #masterForm="ngForm" novalidate>
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group row">
                            <label for="companyId" class="col-sm-3 col-form-label">Company Name <span>*</span></label>
                            <div class="col-sm-9">
                                <ng-select nbselect
                                    (change)="(master.companyId = this.$event.id);getSBU(this.$event.id);"
                                    [items]="companyItems" name="companyId" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="companyId" placeholder="Select Company"
                                    appendTo="body" [(ngModel)]="master.companySelected">
                                </ng-select>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label for="approvalTypeId" class="col-sm-3 col-form-label">Approval Type
                                <span>*</span></label>
                            <div class="col-sm-9">
                                <ng-select nbselect
                                    (change)="(master.approvalTypeId = this.$event.id);GetApproverType(this.$event.id);"
                                    [items]="approvalTypeItems" name="approvalTypeId" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="approvalTypeId"
                                    placeholder="Select Approval Type" appendTo="body"
                                    [(ngModel)]="master.approvalTypeSelected">
                                </ng-select>
                            </div>
                        </div>


                    </div>
                    <div class="col-md-6">
                        <div class="form-group row">
                            <label for="sbuId" class="col-sm-3 col-form-label">Branch Name <span>*</span></label>
                            <div class="col-sm-9">
                                <ng-select nbselect (change)="(master.sbuId = this.$event.id);" [items]="sbuItems"
                                    bindLabel="name" [ngModelOptions]="{standalone: true}" id="sbuId"
                                    placeholder="Select Branch" appendTo="body" [(ngModel)]="master.sbuSelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </fieldset>
    </nb-card-header>
</nb-card>

<nb-card *ngIf="!show">
    <nb-card-header>
        <fieldset [disabled]="disabled ? 'disabled' : null">
            <form #masterForm="ngForm" novalidate>
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group row">
                            <label for="approverTypeId" class="col-sm-3 col-form-label">Approver Type
                                <span>*</span></label>
                            <div class="col-sm-9">
                                <ng-select nbselect (change)="(master.approverTypeId = this.$event.id);"
                                    [items]="approverItems" bindLabel="name" [ngModelOptions]="{standalone: true}"
                                    id="approverTypeId" placeholder="Select Approver Type" appendTo="body"
                                    [(ngModel)]="master.approverSelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group row">
                            <label for="sequenceNo" class="col-sm-3 col-form-label">Sequence No
                                <span>*</span></label>
                            <div class="col-sm-6">
                                <input type="number" class="form-control" id="sequenceNo" required
                                    [(ngModel)]="master.sequenceNo" name="sequenceNo" nbInput fullWidth
                                    placeholder="Sequence No">
                            </div>
                            <div class="col-sm-3">
                                <button (click)="addDetails(dialog)" class="btn btn-warning btn-sm"><i
                                        class="fa fa-plus" aria-hidden="true"></i>
                                    Add
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </fieldset>
    </nb-card-header>
</nb-card>

<div class="row" *ngIf="!show">
    <div class="col-md-12 col-lg-12">
        <nb-card class="min-height">
            <fieldset [disabled]="disabled ? 'disabled' : null">
                <nb-tabset>
                    <nb-tab tabTitle="Approver Details" class="btn-tab">
                        <div class="grid-wrapper">
                            <table class=" table table-bordered table-striped">
                                <tr>
                                    <th>SN</th>
                                    <th>Approver Type</th>
                                    <th>Sequence No</th>
                                    <th>Is Active?</th>
                                    <td>Action</td>
                                </tr>
                                <tr *ngFor="let detail of master.lstDetails; let rowIndex = index">
                                    <td>{{rowIndex+1}}</td>
                                    <td>
                                        <input [(ngModel)]="detail.approverTypeName" type="text" class="form-control"
                                            id="approverTypeName" required name="approverTypeName" nbInput fullWidth
                                            placeholder="Approver Type Name">
                                    </td>
                                    <td>
                                        <input [(ngModel)]="detail.sequenceNo" type="text" class="form-control"
                                            id="sequenceNo" required name="sequenceNo" nbInput fullWidth
                                            placeholder="Sequence No">
                                    </td>
                                    <td>
                                        <nb-checkbox [(ngModel)]="detail.isActive" id="isActive" name="isActive"
                                            status="success">
                                        </nb-checkbox>
                                    </td>
                                    <td>
                                        <button (click)="deleteDetail(rowIndex)" class="btn btn-danger btn-sm m-1">
                                            <i class="fa fa-trash" aria-hidden="true"></i>
                                        </button>
                                    </td>
                                </tr>
                            </table>
                        </div>
                    </nb-tab>
                </nb-tabset>
            </fieldset>
        </nb-card>
    </div>
</div>
