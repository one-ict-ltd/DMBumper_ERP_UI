<nb-card class="actions-card">
    <nb-card-header>{{pageNavigation}}
        <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
    </nb-card-header>
</nb-card>

<nb-card *ngIf="show">
    <nb-card-header class="text-right">
        <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
    </nb-card-header>
    <nb-card-body>
        <div class="grid-wrapper">
            <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
                [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
                [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
                (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
            </ag-grid-angular>
        </div>
    </nb-card-body>
</nb-card>

<nb-card *ngIf="!show">
    <nb-card-header>
        <fieldset [disabled]="disabled ? 'disabled' : null">
            <form #masterForm="ngForm" novalidate>
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group row">
                            <label for="callName" class="col-sm-3 col-form-label">Assign By <span>*</span></label>
                            <div class="col-sm-9">
                                <ng-select nbselect (change)="(master.callName = this.$event.id);showHideDdl();"
                                    [items]="callNameItems" name="callName" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="callName" placeholder="Select Assign By"
                                    appendTo="body" [(ngModel)]="master.callNameSelected">
                                </ng-select>
                            </div>
                        </div>
                        <div class="form-group row" *ngIf="showCompany">
                            <label for="companyId" class="col-sm-3 col-form-label">Company Name <span>*</span></label>
                            <div class="col-sm-9">
                                <ng-select nbselect
                                    (change)="(master.companyId = this.$event.id);getSBU(this.$event.id);"
                                    [items]="companyItems" name="companyId" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="companyId" placeholder="Select Company"
                                    appendTo="body" [(ngModel)]="master.companySelected">
                                </ng-select>
                            </div>
                        </div>
                        <div class="form-group row" *ngIf="showSbu">
                            <label for="sbuId" class="col-sm-3 col-form-label">Branch Name <span>*</span></label>
                            <div class="col-sm-9">
                                <ng-select nbselect (change)="(master.sbuId = this.$event.id);" [items]="sbuItems"
                                    name="sbuId" bindLabel="name" [ngModelOptions]="{standalone: true}" id="sbuId"
                                    placeholder="Select Branch" appendTo="body" [(ngModel)]="master.sbuSelected">
                                </ng-select>
                            </div>
                        </div>

                        <div class="form-group row" *ngIf="showDepartment">
                            <label for="department" class="col-sm-3 col-form-label">Department <span>*</span></label>
                            <div class="col-sm-9">
                                <ng-select nbselect (change)="(master.department = this.$event.name);"
                                    [items]="departmentItems" name="department" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="department"
                                    placeholder="Select Department" appendTo="body"
                                    [(ngModel)]="master.departmentSelected">
                                </ng-select>
                            </div>
                        </div>
                        <div class="form-group row" *ngIf="showEmployee">
                            <label for="employeeId" class="col-sm-3 col-form-label">Employee Name
                                <span>*</span></label>
                            <div class="col-sm-9">
                                <ng-select nbselect (change)="(master.employeeId = this.$event.id);"
                                    [items]="employeeItems" bindLabel="name" [ngModelOptions]="{standalone: true}"
                                    id="employeeId" placeholder="Select Employee" appendTo="body"
                                    [(ngModel)]="master.employeeSelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group row">
                            <label for="shiftMasterId" class="col-sm-3 col-form-label">Shift Name <span>*</span></label>
                            <div class="col-sm-9">
                                <ng-select nbselect (change)="(master.shiftMasterId = this.$event.id);"
                                    [items]="shiftGroupItems" bindLabel="name" [ngModelOptions]="{standalone: true}"
                                    id="shiftMasterId" placeholder="Select Shift Name" appendTo="body"
                                    [(ngModel)]="master.shiftMasterSelected">
                                </ng-select>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label"></label>
                            <div class="col-sm-9">
                                <button (click)="SaveShiftAssign();" class="btn btn-success btn-sm">Assign</button>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </fieldset>
    </nb-card-header>
</nb-card>

<nb-card *ngIf="showbody">
    <nb-card-header>
        <fieldset>
            <div class="grid-wrapper">
                <table class=" table table-bordered table-striped">
                    <tr>
                        <th style="width: 5%;">SN</th>
                        <th style="width: 10%;">Employee's No</th>
                        <th style="width: 30%;">Employee's Name</th>
                        <th style="width: 20%;">Department</th>
                        <th style="width: 20%;">Shift Name</th>
                        <th style="width: 15%;">Punch Card No</th>
                    </tr>
                    <tr *ngFor="let item of master.lstDetails; let rowIndex = index">
                        <td>{{rowIndex+1}}</td>
                        <td>{{item.employeeNo}}</td>
                        <td>{{item.fullName}}</td>
                        <td>{{item.currentDepartment}}</td>
                        <td>{{item.shiftName}}</td>
                        <td>
                            <input [(ngModel)]="item.punchCardNo" type="text" class="form-control" id="punchCardNo"
                                name="punchCardNo" required fullWidth placeholder="Insert punch card no">
                        </td><!-- (change)="UpdatePunchCard(rowIndex,item.punchCardId)" -->
                        <td><button (click)="UpdatePunchCard(rowIndex,item.punchCardId);"
                                class="btn btn-success btn-sm">Update</button></td>

                    </tr>
                </table>
            </div>
        </fieldset>
    </nb-card-header>
</nb-card>
