<nb-card class="actions-card">
    <nb-card-header>{{pageNavigation}}
        <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
    </nb-card-header>
</nb-card>

<nb-card *ngIf="show">
    <nb-card-header class="text-right">
        <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
    </nb-card-header>
    <nb-card-body>
        <div class="grid-wrapper">
            <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
                [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
                [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
                (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
            </ag-grid-angular>
        </div>
    </nb-card-body>
</nb-card>

<nb-card *ngIf="!show">
    <nb-card-header>
        <fieldset [disabled]="disabled ? 'disabled' : null">
            <form #masterForm="ngForm" novalidate>
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group row">
                            <label for="shiftName" class="col-sm-3 col-form-label">Shift Group Name
                                <span>*</span></label>
                            <div class="col-sm-9">
                                <input type="text" (keyup)="getDuplicate();" class="form-control" required
                                    [(ngModel)]="master.shiftName" id="shiftName" name="shiftName" nbInput fullWidth
                                    placeholder="Shift Group Name">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group row">
                            <div class="col-sm-6 validation-checkboxes">
                                <nb-checkbox [(ngModel)]="master.isActive" name="isActive" status="success">
                                    <b>Is Active?</b>
                                </nb-checkbox>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </fieldset>
    </nb-card-header>
</nb-card>

<nb-card *ngIf="!show">
    <nb-card-header>
        <fieldset [disabled]="disabled ? 'disabled' : null">
            <form #masterForm="ngForm" novalidate>
                <div class="row">
                    <div class="col-md-3">
                        <div class="form-group row">
                            <label for="weekDay" class="col-sm-4 col-form-label">WeekDay <span>*</span></label>
                            <div class="col-sm-8">
                                <ng-select nbselect (change)="(master.weekDay = $event ? $event.name : null);"
                                    [items]="weekDayItems" bindLabel="name" [ngModelOptions]="{standalone: true}"
                                    id="weekDay" placeholder="Select WeekDay" appendTo="body"
                                    [(ngModel)]="master.weekDaySelected" [clearable]="true">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-group row">
                            <label for="startTime" class="col-sm-4 col-form-label">Start Time
                                <span>*</span></label>
                            <div class="col-sm-8">
                                <input type="time" class="form-control" required [(ngModel)]="master.startTime"
                                    id="startTime" name="startTime" nbInput fullWidth placeholder="Start Time">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-group row">
                            <label for="endTime" class="col-sm-4 col-form-label">End Time
                                <span>*</span></label>
                            <div class="col-sm-8">
                                <input type="time" class="form-control" required [(ngModel)]="master.endTime"
                                    id="endTime" name="endTime" nbInput fullWidth placeholder="End Time">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-group row">
                            <div class="col-sm-6 validation-checkboxes">
                                <nb-checkbox [(ngModel)]="master.isHoliday" name="isHoliday" status="success">
                                    <b>Is Holiday?</b>
                                </nb-checkbox>
                            </div>
                            <div class="col-sm-6">
                                <button (click)="addDetails(dialog)" class="btn btn-warning btn-sm"><i
                                        class="fa fa-plus" aria-hidden="true"></i>
                                    Add Day
                                </button>
                            </div>
                        </div>

                    </div>
                </div>
            </form>
        </fieldset>
    </nb-card-header>
</nb-card>

<div class="row" *ngIf="!show">
    <div class="col-md-12 col-lg-12">
        <nb-card class="min-height">
            <fieldset [disabled]="disabled ? 'disabled' : null">
                <nb-tabset>
                    <nb-tab tabTitle="Shift Group Details" class="btn-tab">
                        <div class="grid-wrapper">
                            <table class=" table table-bordered table-striped">
                                <tr>
                                    <th>SN</th>
                                    <th>Week Day</th>
                                    <th>Start Time</th>
                                    <th>End Time</th>
                                    <th>Is Holiday?</th>
                                    <td>Action</td>
                                </tr>
                                <tr *ngFor="let detail of master.lstDetails; let rowIndex = index">
                                    <td>{{rowIndex+1}}</td>
                                    <td>{{detail.weekDay}}</td>
                                    <td>{{detail.startTime}}</td>
                                    <td>{{detail.endTime}}</td>
                                    <td>{{detail.isHoliday}}</td>
                                    <td>
                                        <button (click)="deleteDetail(rowIndex)" class="btn btn-danger btn-sm m-1">
                                            <i class="fa fa-trash" aria-hidden="true"></i>
                                        </button>
                                        <button (click)="editDetail(rowIndex)" class="btn btn-primary btn-sm m-1">
                                            <i class="fa fa-edit" aria-hidden="true"></i>
                                        </button>
                                    </td>
                                </tr>
                            </table>
                        </div>
                    </nb-tab>
                </nb-tabset>
            </fieldset>
        </nb-card>
    </div>
</div>
