<nb-card class="actions-card">
    <nb-card-header>{{pageNavigation}}
        <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
    </nb-card-header>
</nb-card>
<nb-card *ngIf="show">
    <nb-card-header class="text-right">
        <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
    </nb-card-header>
    <nb-card-body>
        <div class="grid-wrapper">
            <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
                [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
                [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
                (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
            </ag-grid-angular>
        </div>
    </nb-card-body>
</nb-card>
<nb-card *ngIf="!show">
    <nb-card-header>
        <fieldset [disabled]="disabled ? 'disabled' : null">
            <form #masterForm="ngForm" novalidate>
                <div class="row">
                    <div class="col-6">
                        <div class="form-group row">
                            <label for="companyId" class="col-4 col-form-label">Company Name
                                <span>*</span></label>
                            <div class="col-sm-8">
                                <ng-select nbselect [items]="companyItems"
                                    (change)="(master.companyId = this.$event.id);LoadEmployee();" name="companyId"
                                    bindLabel="name" id="companyId" [(ngModel)]="companySelected"
                                    [ngModelOptions]="{standalone: true}" placeholder="Select Company" appendTo="body">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="form-group row">
                            <label for="empId" class="col-4 col-form-label">Employee Name<span>*</span></label>
                            <div class="col-sm-8">
                                <ng-select nbselect [items]="empItems" (change)="(master.empId = this.$event.id);"
                                    bindLabel="name" id="empId" name="empId" [(ngModel)]="empSelected"
                                    [ngModelOptions]="{standalone: true}" placeholder="Select Employee" appendTo="body">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-6">
                        <div class="form-group row">
                            <label for="attendanceDate" class="col-4 col-form-label">Attendance
                                Date<span>*</span></label>
                            <div class="col-sm-8">
                                <input id="attendanceDate" required [(ngModel)]="master.attendanceDate"
                                    name="attendanceDate" [nbDatepicker]="attendanceDate" nbInput fullWidth
                                    [ngModelOptions]="{standalone: true}">
                                <nb-datepicker #attendanceDate></nb-datepicker>
                            </div>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="form-group row">
                            <label for="clarification" class="col-4 col-form-label">Clarification<span>*</span></label>
                            <div class="col-sm-8">
                                <textarea type="text" class="form-control" id="clarification" required
                                    [(ngModel)]="master.clarification" name="clarification" nbInput fullWidth
                                    placeholder="clarification"></textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </fieldset>
    </nb-card-header>
</nb-card>
