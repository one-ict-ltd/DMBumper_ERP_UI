<nb-card class="actions-card">
    <nb-card-header>{{pageNavigation}}
        <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
    </nb-card-header>
</nb-card>

<nb-card *ngIf="show">
    <nb-card-header class="text-right">
        <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
    </nb-card-header>
    <nb-card-body>
        <div class="grid-wrapper">
            <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
                [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
                [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
                (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
            </ag-grid-angular>
        </div>
    </nb-card-body>
</nb-card>

<nb-card *ngIf="!show">
    <nb-card-header>
        <fieldset [disabled]="disabled ? 'disabled' : null">
            <form #masterForm="ngForm" novalidate>
                <div class="row">
                    <div class="col-sm-12 col-md-12 col-lg-12" style="width: 880px;">
                        <nb-card class="min-height">
                            <nb-card-header>
                                <div class="row">
                                    <div class="col-lg-11 col-md-11 col-sm-11">
                                        <h6>Late Clarification</h6>
                                    </div>
                                    <!-- <div class="col-lg-1 col-md-1 col-sm-1">
                                        <button style="text-align: right;" nbButton
                                            (click)="ref.close();"><span>X</span></button>
                                    </div> -->
                                </div>
                            </nb-card-header>
                            <nb-card-body>
                                <div class="row">
                                    <div class="col-lg-6 col-md-6 col-sm-12">
                                        <div class="form-group row">
                                            <label for="remarks" class="col-sm-4 col-form-label">Date</label>
                                            <div class="col-sm-8">
                                                <input type="text" class="form-control" id="remarks" required
                                                    [(ngModel)]="lateAttandanDate" name="remarks" nbInput fullWidth
                                                    readonly>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-lg-6 col-md-6 col-sm-12">
                                        <div class="form-group row">
                                            <label for="remarks" class="col-sm-4 col-form-label">Late</label>
                                            <div class="col-sm-8">
                                                <input type="text" class="form-control" id="remarks" required
                                                    [(ngModel)]="lateTime" name="remarks" nbInput fullWidth readonly>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-lg-12 col-md-12 col-sm-12">
                                        <div class="form-group row">
                                            <label for="narration" class="col-sm-2 col-form-label">Narration</label>
                                            <div class="col-sm-10">
                                                <textarea type="text" class="form-control" id="narration" required
                                                    [(ngModel)]="narration" name="narration" nbInput fullWidth
                                                    placeholder="Enter narration"></textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </nb-card-body>
                            <nb-card-footer>
                                <div class="row">
                                    <div class="col-lg-1 col-md-1 col-sm-1" style="margin-right: 5px;">
                                        <div style="text-align: center; margin-left: 725px;">
                                            <button type="button" class="btn btn-success"
                                                (click)="SubmitClarification();ref.close()">Submit</button>
                                        </div>
                                    </div>
                                </div>
                            </nb-card-footer>
                        </nb-card>
                    </div>
                </div>

            </form>
        </fieldset>
    </nb-card-header>
</nb-card>
