<nb-card class="actions-card">
    <nb-card-header>{{pageNavigation}}
        <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
    </nb-card-header>
</nb-card>

<nb-card *ngIf="show">
    <nb-card-header class="text-right">
        <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
    </nb-card-header>
    <nb-card-body>
        <div class="grid-wrapper">
            <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
                [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
                [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
                (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
            </ag-grid-angular>
        </div>
    </nb-card-body>
</nb-card>

<nb-card *ngIf="!show">
    <nb-card-header>
        <fieldset [disabled]="disabled ? 'disabled' : null">
            <form #masterForm="ngForm" novalidate>

                <div class="row">

                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label for="employeeId" class="col-sm-3 col-form-label">Employee
                                <span>*</span></label>
                            <div class="col-sm-9">
                                <ng-select nbselect (change)="(master.employeeId = this.$event.id);GetLeaveBalance();"
                                    [items]="EmployeeList" name="employeeId" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="employeeId" placeholder="Select Employee"
                                    appendTo="body" [(ngModel)]="master.EmployeeSelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>

                </div>

                <div class="row">
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label for="type" class="col-sm-3 col-form-label">Select
                                Type<span>*</span></label>
                            <div class="col-sm-9">
                                <ng-select nbselect (change)="(master.type = this.$event.id);" [items]="TypeList"
                                    name="type" bindLabel="name" [ngModelOptions]="{standalone: true}" id="type"
                                    placeholder="Select " appendTo="body" [(ngModel)]="master.TypeSelected" required>
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label for="leaveTypeId" class="col-sm-3 col-form-label">Leave Type<span>*</span></label>
                            <div class="col-sm-9">
                                <ng-select nbselect (change)="(master.leaveTypeId = this.$event.id);GetLeaveBalance()"
                                    [items]="LeaveTypeList" name="leaveTypeId" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="leaveTypeId"
                                    placeholder="Select Leave Type" appendTo="body"
                                    [(ngModel)]="master.LeaveTypeSelected" required>
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label for="yearId" class="col-sm-3 col-form-label">Leave Year<span>*</span></label>
                            <div class="col-sm-9">
                                <ng-select nbselect (change)="(master.yearId = this.$event.id);GetLeaveBalance()"
                                    [items]="LeaveYearList" name="yearId" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="yearId" placeholder="Select Leave Year"
                                    appendTo="body" [(ngModel)]="master.LeaveYearSelected" required>
                                </ng-select>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label" for="Balance">Leave Balance</label>
                            <div class="col-sm-9">
                                <input type="number" class="form-control" [(ngModel)]="Balance" id="Balance"
                                    name="Balance" nbInput fullWidth placeholder="Leave Balance" readonly>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label" for="startDate">Start Date <span>*</span></label>
                            <div class="col-sm-9">
                                <input required [(ngModel)]="master.startDate" (ngModelChange)="calculateDiff()"
                                    [nbDatepicker]="startDate" nbInput fullWidth placeholder="start Date"
                                    [ngModelOptions]="{standalone: true}">
                                <nb-datepicker #startDate></nb-datepicker>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label" for="endDate">End Date <span>*</span> </label>
                            <div class="col-sm-9">
                                <input required [(ngModel)]="master.endDate" (ngModelChange)="calculateDiff()"
                                    [nbDatepicker]="endDate" nbInput fullWidth placeholder="end Date"
                                    [ngModelOptions]="{standalone: true}">
                                <nb-datepicker #endDate></nb-datepicker>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label" for="leaveDays">Leave Day</label>
                            <div class="col-sm-9">
                                <input type="number" class="form-control" [(ngModel)]="master.leaveDay" id="leaveDay"
                                    name="leaveDay" nbInput fullWidth placeholder="Leave Day" readonly>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label for="substituteEmployeeId" class="col-sm-3 col-form-label">Substitute
                                Employee</label>
                            <div class="col-sm-9">
                                <ng-select nbselect (change)="(master.substituteEmployeeId = this.$event.id);"
                                    [items]="EmployeeList" name="substituteEmployeeId" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="substituteEmployeeId"
                                    placeholder="Select Employee" appendTo="body"
                                    [(ngModel)]="master.substituteEmployeeSelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label" for="leaveLocation">Leave Location</label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" [(ngModel)]="master.leaveLocation"
                                    id="leaveLocation" name="leaveLocation" nbInput fullWidth
                                    placeholder="Leave Location">
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label" for="remarks">Remarks</label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" [(ngModel)]="master.remarks" id="remarks"
                                    name="remarks" nbInput fullWidth placeholder="Leave remarks">
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label for="" class="col-sm-5 col-form-label"> Is Active ?</label>
                            <div class="col-sm-7">
                                <div class="validation-checkboxes">
                                    <nb-checkbox [(ngModel)]="master.isActive" name="checkbox" status="success">
                                    </nb-checkbox>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </fieldset>
    </nb-card-header>
</nb-card>
