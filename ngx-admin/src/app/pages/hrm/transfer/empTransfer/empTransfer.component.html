<nb-card class="actions-card">
    <nb-card-header>{{pageNavigation}}
        <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
    </nb-card-header>
</nb-card>

<nb-card *ngIf="show">
    <nb-card-header class="text-right">
        <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
    </nb-card-header>
    <nb-card-body>
        <div class="grid-wrapper">
            <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
                [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
                [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
                (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
            </ag-grid-angular>
        </div>
    </nb-card-body>
</nb-card>

<nb-card *ngIf="!show">
    <nb-card-header>
        <fieldset [disabled]="disabled ? 'disabled' : null">
            <form #masterForm="ngForm" novalidate>
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group row">
                            <label for="salaryTypeId" class="col-sm-3 col-form-label">Employee's Name
                                <span>*</span></label>
                            <div class="col-sm-9">
                                <ng-select nbselect (change)="(master.employeeId = this.$event.id);initEmployeeInfo(this.$event.id);"
                                    [items]="employeeItems" name="employeeId" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="employeeId" placeholder="Select Employee"
                                    appendTo="body" [(ngModel)]="master.employeeSelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                  

                    <div class="col-md-6">
                        <div class="form-group row">
                            <label for="designation" class="col-sm-3 col-form-label">Designation
                            </label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" id="designation" required
                                    [(ngModel)]="master.designation" name="designation" nbInput fullWidth
                                    placeholder="Designation" readonly>
                            </div>
                        </div>
                    </div>
                 
                    <div class="col-md-6">
                        <div class="form-group row">
                            <label for="department" class="col-sm-3 col-form-label">Department
                            </label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" id="department" required
                                    [(ngModel)]="master.department" name="department" nbInput fullWidth
                                    placeholder="Department"  readonly>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="form-group row">
                            <label for="joiningDate" class="col-sm-3 col-form-label">Joining Date
                            </label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" id="joiningDate" required
                                    [(ngModel)]="master.joiningDate" name="joiningDate" nbInput fullWidth
                                    placeholder="joining date" readonly>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="form-group row">
                            <label for="grossSalary" class="col-sm-3 col-form-label">Gross Salary
                            </label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" id="grossSalary" required
                                    [(ngModel)]="master.grossSalary" name="grossSalary" nbInput fullWidth
                                    placeholder="gross salary" readonly>
                            </div>
                        </div>
                    </div>


                    <div class="col-md-6">
                        <div class="form-group row">
                            <label for="currentLocation" class="col-sm-3 col-form-label">Current Location
                            </label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" id="currentLocation" required
                                    [(ngModel)]="master.currentLocation" name="currentLocation" nbInput fullWidth
                                    placeholder="Current Salary Location"  readonly>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label for="salaryLocation" class="col-sm-3 col-form-label">New Location</label>
                            <div class="col-sm-9">
                                <ng-select nbselect (change)="(master.salaryLocation = this.$event.name);(master.HrmNewSalaryLocationId = this.$event.id)"
                                    [items]="SalaryLocationList" name="salaryLocation" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="salaryLocation"
                                    placeholder="Select New Salary Location" appendTo="body"
                                    [(ngModel)]="master.salaryLocationSelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>

                    
                   <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label" for="transferDate">Transfer Date</label>
                            <div class="col-sm-9">
                                <input required [(ngModel)]="master.transferDate" [nbDatepicker]="transferDate" nbInput
                                    fullWidth placeholder="Transer Date" [ngModelOptions]="{standalone: true}">
                                <nb-datepicker #transferDate></nb-datepicker>
                            </div>
                        </div>
                    </div>

                    
                   
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label" for="remarks">Remarks</label>
                            <div class="col-sm-9">
                                <textarea type="text" class="form-control" id="remarks" required
                                [(ngModel)]="master.remarks" name="remarks" nbInput fullWidth></textarea>
                            </div>
                        </div>
                    </div>
                    
                </div>
            </form>
        </fieldset>
    </nb-card-header>
</nb-card>
