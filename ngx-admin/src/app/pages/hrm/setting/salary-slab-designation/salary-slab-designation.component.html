<nb-card class="actions-card">
    <nb-card-header>{{pageNavigation}}
        <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
    </nb-card-header>
</nb-card>

<nb-card *ngIf="show">
    <nb-card-header class="text-right">
        <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
    </nb-card-header>
    <nb-card-body>
        <div class="grid-wrapper">
            <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
                [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
                [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
                (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
            </ag-grid-angular>
        </div>
    </nb-card-body>
</nb-card>

<nb-card *ngIf="!show">
    <nb-card-header>
        <fieldset [disabled]="disabled ? 'disabled' : null">
            <form #masterForm="ngForm">
                <div class="row">

                    <div class="col-md-6">
                        <div class="form-group row">
                            <label for="fiscalYearId" class="col-sm-3 col-form-label">Grade Name <span>*</span>
                            </label>
                            <div class="col-sm-9">
                                <ng-select [items]="salaryGradeItems"
                                    (change)="(master.salaryGradeId = this.$event.id);LoadSalarySlab();"
                                    name="salaryGradeId" bindLabel="name" [ngModelOptions]="{standalone: true}"
                                    id="salaryGradeId" placeholder="Select Grade Name" appendTo="body"
                                    [(ngModel)]="master.salaryGradeSelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="form-group row">
                            <label for="salarySlabId" class="col-sm-3 col-form-label">Slab Name <span>*</span>
                            </label>
                            <div class="col-sm-9">
                                <ng-select [items]="salarySlabItems" (change)="(master.salarySlabId = this.$event.id);"
                                    name="salarySlabId" bindLabel="name" [ngModelOptions]="{standalone: true}"
                                    id="salarySlabId" placeholder="Select Slab Name" appendTo="body"
                                    [(ngModel)]="master.salarySlabSelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group row">
                            <label for="currentDesignation" class="col-sm-3 col-form-label">Designation
                            </label>
                            <div class="col-sm-9">
                                <ng-select nbselect (change)="(master.designationId = this.$event.id);"
                                    [items]="designationList" name="currentDesignation" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="currentDesignation"
                                    placeholder="Select Designation" appendTo="body"
                                    [(ngModel)]="master.designationSelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>

                </div>
                <div class="row justify-content-center">
                    <button type="button" class="btn btn-outline-success" (click)="addToTable()"><i class="fa fa-plus"
                            aria-hidden="true"></i>Add</button>
                </div>
            </form>
        </fieldset>
    </nb-card-header>
</nb-card>
<div class="row" *ngIf="!show">
    <div class="col-sm-12 col-md-12 col-lg-12">
        <nb-card class="min-height">
            <fieldset [disabled]="disabled ? 'disabled' : null">
                <nb-tabset>
                    <nb-tab tabTitle="Slab Wise Designation" class="btn-tab">
                        <div class="grid-wrapper" style="overflow-y:scroll ; max-height: 300px">
                            <table class=" table table-bordered table-striped">
                                <tr>
                                    <th>#</th>
                                    <th>Grade</th>
                                    <th>Slab</th>
                                    <th>Designation</th>
                                    <th class="justify-content-center">Action</th>
                                </tr>

                                <tr *ngFor="let details of master.lstMasterViewModel; let rowIndex = index">
                                    <td>
                                        {{rowIndex+1}}
                                    </td>
                                    <td>
                                        {{details.salaryGradeName}}
                                    </td>
                                    <td>
                                        {{details.salarySlabName}}
                                    </td>
                                    <td>
                                        {{details.designationName}}
                                    </td>
                                    <td class="justify-content-center">
                                        <button type="button" class="btn btn-danger"
                                            (click)="removeItemFromList(rowIndex)"><i class="fa fa-trash"
                                                aria-hidden="true"></i></button>
                                    </td>
                                </tr>
                            </table>
                        </div>
                    </nb-tab>
                </nb-tabset>
            </fieldset>
        </nb-card>
    </div>
</div>
