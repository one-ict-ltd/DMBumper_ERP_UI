<nb-card class="actions-card">
  <nb-card-header>{{pageNavigation}}
    <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
  </nb-card-header>
</nb-card>

<nb-card *ngIf="show">
  <nb-card-header class="text-right">
    <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
  </nb-card-header>
  <nb-card-body>
    <div class="grid-wrapper">
      <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
        [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
        [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
        (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
      </ag-grid-angular>
    </div>
  </nb-card-body>
</nb-card>

<nb-card *ngIf="!show">
  <nb-card-header>
    <fieldset [disabled]="disabled ? 'disabled' : null">
      <form #masterForm="ngForm">
        <div class="row">
          <div class="col-lg-6 col-md-8 col-sm-12">
            <div class="form-group row">
              <label class="col-sm-12 col-form-label" for="DegreeName">Degree Name<span>*</span></label>
              <div class="col-sm-12">
                <ng-select (change)="(master.degreeId=this.$event.id);" nbselect [items]="DegreeList" name="DegreeName"
                  bindLabel="name" [ngModelOptions]="{standalone: true}" id="DegreeName" placeholder="Select a Degree"
                  appendTo="body" [(ngModel)]="DegreeSelected">
                </ng-select>
              </div>
            </div>
          </div>
          <div class="col-lg-6 col-md-8 col-sm-12">
            <div class="form-group row">
              <label class="col-sm-12 col-form-label" for="EducationalSubject">Educational Subject<span>*</span></label>
              <div class="col-sm-12">
                <ng-select (change)="(master.subjectId=this.$event.id);" nbselect [items]="EducationalSubjectList"
                  name="EducationalSubject" bindLabel="name" [ngModelOptions]="{standalone: true}"
                  id="EducationalSubject" placeholder="Select a subject" appendTo="body"
                  [(ngModel)]="EducationalSubjectSelected">
                </ng-select>
              </div>
            </div>
          </div>

          <div class="col-lg-6 col-md-8 col-sm-12">
            <div class="form-group row">
              <label class="col-sm-12 col-form-label" for="isActive">Status</label>
              <div class="col-sm-12 validation-checkboxes">
                <nb-checkbox [(ngModel)]="master.isActive" name="isActive" status="success">
                  <b>Is Active?</b>
                </nb-checkbox>
              </div>
            </div>
          </div>

        </div>
      </form>
    </fieldset>
  </nb-card-header>
</nb-card>
