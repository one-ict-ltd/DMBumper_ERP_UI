<nb-card>
    <nb-card-header>
        <fieldset>
            <div class="row">

                <div class="col-sm-8 col-md-8 col-lg-8">

                </div>
                <div class="col-sm-4 col-md-4 col-lg-4">
                    <div class="form-group row">
                        <label for="voucherNo" class="col-sm-4 col-form-label">Search</label>
                        <div class="col-sm-8">
                            <input type="text" class="form-control" id="searchText" required [(ngModel)]="searchText"
                                name="searchText" nbInput fullWidth placeholder="Search...">
                        </div>
                    </div>
                </div>

            </div>
            <!-- <div class="grid-wrapper">
          <table class=" table table-bordered table-striped"> -->
            <div class="table-wrapper-scroll-y my-custom-scrollbar">
                <table id="simple_table" class="table table-bordered table-striped mb-0">
                    <thead>
                        <tr>
                            <th style="width: 5%;">SN</th>
                            <th style="width: 5%;">Emp ID</th>
                            <th style="width: 15%;">Name</th>
                            <th style="width: 15%;">Designation</th>
                            <th style="width: 15%;">Department</th>
                            <th style="width: 10%;">Salary Location</th>
                            <th style="width: 12%;">Other Allow. Cash (TK)</th>
                            <th style="width: 12%;">Transport/Driver Allowence</th>
                            <th style="width: 15%;">Others</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let item of master.lstDetailsViewModel | filter: searchText; let rowIndex = index">
                            <td>{{rowIndex+1}}</td>
                            <td>
                                {{item.employeeNo}}
                            </td>
                            <td>
                                {{item.fullName}}
                            </td>
                            <td>
                                {{item.currentDesignation}}
                            </td>
                            <td>
                                {{item.currentDepartment}}
                            </td>
                            <td>
                                {{item.salaryLocation}}
                            </td>
                            <td>
                                <input [(ngModel)]="item.cashAmount" (change)="validatePrice(rowIndex)" type="number"
                                    class="form-control text-right" id="cashAmount" name="cashAmount" required fullWidth
                                    placeholder="enter cashAmount">
                            </td>
                            <td>
                                <input [(ngModel)]="item.walletAmount" (change)="validatePrice(rowIndex)" type="number"
                                    class="form-control text-right" id="walletAmount" name="walletAmount" required
                                    fullWidth placeholder="enter walletAmount">
                            </td>
                            <td>
                                <input [(ngModel)]="item.defaultAmount" (change)="validatePrice(rowIndex)" type="number"
                                    class="form-control text-right" id="defaultAmount" name="defaultAmount" required
                                    fullWidth placeholder="enter others amount">
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </fieldset>
    </nb-card-header>
</nb-card>
