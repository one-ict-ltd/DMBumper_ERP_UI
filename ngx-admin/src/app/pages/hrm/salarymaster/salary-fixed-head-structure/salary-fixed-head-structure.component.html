<nb-card class="actions-card">
    <nb-card-header>{{pageNavigation}}
        <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
    </nb-card-header>
</nb-card>

<nb-card *ngIf="show">
    <nb-card-header class="text-right">
        <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
    </nb-card-header>



    <nb-card-body>

        <div class="row">
            <div class="col-lg-4 col-md-4 col-sm-4">
                <div class="form-group row">
                    <label class="col-sm-4 col-form-label" for="salesInvoiceDate">Salary Period <span>*</span></label>
                    <div class="col-sm-8">
                        <ng-select nbselect [items]="salaryPeriodItems"
                            (change)="(master.salaryPeriodLoadId = this.$event.id);" name="salaryPeriodLoadId"
                            bindLabel="name" id="salaryPeriodLoadId" [(ngModel)]="master.salaryPeriodLoadSelected"
                            [ngModelOptions]="{standalone: true}" placeholder="Select Salary Period" appendTo="body">
                        </ng-select>
                    </div>
                </div>
            </div>
            <div class="col-lg-4 col-md-4 col-sm-4">
                <!-- <div class="form-group row">
                    <label class="col-sm-4 col-form-label" for="salesInvoiceDate">To
                        Date <span>*</span></label>
                    <div class="col-sm-8">
                        <input required [(ngModel)]="master.loadToDateShow" name="loadToDateShow" id="loadToDateShow"
                            [nbDatepicker]="idatepicker2" nbInput fullWidth placeholder="Date"
                            [ngModelOptions]="{standalone: true}">
                        <nb-datepicker #idatepicker2></nb-datepicker>
                    </div>
                </div> -->
            </div>
            <div class="col-lg-4 col-md-4 col-sm-4">
                <div class="form-group row">
                    <button class="btn btn-primary" nbButton (click)="getSalaryHeadAmount();">Load Data</button>
                </div>
            </div>
        </div>

        <div class="grid-wrapper">
            <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
                [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
                [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
                (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
            </ag-grid-angular>
        </div>
    </nb-card-body>
</nb-card>

<nb-card *ngIf="!show">
    <nb-card-header>
        <fieldset [disabled]="disabled ? 'disabled' : null">
            <form #masterForm="ngForm" novalidate>
                <div class="row">
                    <div class="col-6">
                        <div class="form-group row">
                            <label for="salaryPeriodId" class="col-sm-4 col-form-label">Salary Period
                                <span>*</span></label>
                            <div class="col-sm-8">
                                <ng-select nbselect [items]="salaryPeriodItems"
                                    (change)="(master.salaryPeriodId = this.$event.id);" name="salaryPeriodId"
                                    bindLabel="name" id="salaryPeriodId" [(ngModel)]="salaryPeriodSelected"
                                    [ngModelOptions]="{standalone: true}" placeholder="Select Salary Period"
                                    appendTo="body">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group row">
                            <label for="salaryTypeId" class="col-sm-4 col-form-label">Employee's Name
                                <span>*</span></label>
                            <div class="col-sm-8">
                                <ng-select nbselect
                                    (change)="(master.employeeId = this.$event.id);GetSalaryFixedHeadByEmpId();"
                                    [items]="employeeItems" name="employeeId" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="employeeId"
                                    placeholder="Select an Employee" appendTo="body" [(ngModel)]="employeeSelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-6">
                        <div class="form-group row">
                            <label for="salaryHeadId" class="col-sm-4 col-form-label">Head Name <span>*</span>
                            </label>
                            <div class="col-sm-8">
                                <ng-select [items]="salaryHeadItems"
                                    (change)="(master.salaryHeadId = this.$event.id);getDuplicate(this.$event.id);"
                                    name="salaryHeadId" bindLabel="name" [ngModelOptions]="{standalone: true}"
                                    id="salaryHeadId" placeholder="Select Head Name" appendTo="body"
                                    [(ngModel)]="salaryHeadSelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>

                    <div class="col-4" *ngIf="statusShow">
                        <div class="form-group row">
                            <label for="salaryHeadId" class="col-sm-6 col-form-label">Diduction From <span>*</span>
                            </label>
                            <div class="col-sm-6">
                                <ng-select [items]="StatusList"
                                    (change)="(master.statusId = this.$event.id);LoadSalary(this.$event.id)"
                                    name="statusId" bindLabel="name" [ngModelOptions]="{standalone: true}" id="statusId"
                                    placeholder="Select Diduction From" appendTo="body" [(ngModel)]="StatusSelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>

                    <div class="col-2" *ngIf="statusShow">
                        <div class="form-group row">
                            <div class="col-sm-12">
                                <input type="number" class="form-control text-right" required min="0"
                                    [(ngModel)]="master.Amount" id="structureAmount" name="Amount" nbInput fullWidth
                                    placeholder="Amount">
                            </div>
                        </div>
                    </div>

                    <div class="col-6" *ngIf="statusShow">
                        <div class="form-group row">
                            <label for="salaryHeadId" class="col-sm-4 col-form-label">Days <span>*</span>
                            </label>
                            <div class="col-sm-8">
                                <input type="number" class="form-control text-right" required min="0"
                                    [(ngModel)]="master.days" id="days" name="days" nbInput fullWidth placeholder="days"
                                    (ngModelChange)="calculateTotal();">
                            </div>
                        </div>
                    </div>

                    <div class="col-6">
                        <div class="form-group row">
                            <label class="col-sm-4 col-form-label" for="structureAmount">Structure
                                Amount <span>*</span></label>
                            <div class="col-sm-8">
                                <input type="number" class="form-control text-right" required min="0"
                                    [(ngModel)]="master.structureAmount" id="structureAmount" name="structureAmount"
                                    nbInput fullWidth placeholder="Structure Amount">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12" style="text-align: center;">
                        <button (click)="addToDetailsGrid(dialog)" class="btn btn-success btn-md m-3"> <i
                                class="fa fa-plus" aria-hidden="true"></i> Add </button>
                    </div>
                </div>
            </form>
        </fieldset>
    </nb-card-header>
</nb-card>

<div class="row" *ngIf="!show">
    <div class="col-sm-12 col-md-12 col-lg-12">
        <nb-card class="min-height">
            <fieldset [disabled]="disabled ? 'disabled' : null">
                <nb-tabset>
                    <nb-tab tabTitle="Addition" class="btn-tab">
                        <div class="grid-wrapper">
                            <table class=" table table-bordered table-striped">
                                <tr>
                                    <th>SN</th>
                                    <th>Employee Name</th>
                                    <th>Salary Period</th>
                                    <th>Head Name</th>
                                    <th style="text-align: right;">Amount</th>
                                    <!-- <th>Is Active?</th> -->
                                    <th>Action</th>
                                </tr>
                                <tr *ngFor="let details of master.lstMaster; let rowIndex = index">
                                    <td>{{rowIndex+1}}</td>
                                    <td>{{details.employeeName}}</td>
                                    <td>{{details.salaryPeriod}}</td>
                                    <td>{{details.salaryHead}}</td>
                                    <td align="right">
                                        <input type="number" class="form-control text-right" required min="0"
                                            [(ngModel)]="details.structureAmount" id="Amount" name="Amount" nbInput
                                            fullWidth placeholder="Structure Amount">
                                        <!-- {{currencyFormatter(details.structureAmount)}} -->

                                    </td>
                                    <!-- <td>{{details.isActive}}</td> -->
                                    <td>
                                        <button (click)="deleteDetails(rowIndex)" class="btn btn-danger btn-sm m-1">
                                            <i class="fa fa-trash" aria-hidden="true"></i>
                                        </button>
                                    </td>
                                </tr>
                            </table>
                        </div>
                    </nb-tab>
                </nb-tabset>
            </fieldset>
        </nb-card>
    </div>
</div>
