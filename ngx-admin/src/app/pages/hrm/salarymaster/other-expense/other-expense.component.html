<nb-card class="actions-card">
    <nb-card-header>{{pageNavigation}}
        <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
    </nb-card-header>
</nb-card>

<nb-card *ngIf="show">
    <nb-card-header class="text-right">
        <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
    </nb-card-header>
    <nb-card-body>
        <div class="grid-wrapper">
            <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
                [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
                [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
                (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
            </ag-grid-angular>
        </div>
    </nb-card-body>
</nb-card>

<nb-card *ngIf="!show">
    <nb-card-header>
        <fieldset [disabled]="disabled ? 'disabled' : null">
            <form #masterForm="ngForm" novalidate>
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group row">
                            <label for="fiscalYearId" class="col-sm-2 col-form-label">Year Name <span>*</span>
                            </label>
                            <div class="col-sm-10">
                                <ng-select [items]="fiscalYearItems"
                                    (change)="(master.fiscalYearId = this.$event.id);getDuplicate();ShowPeriodName();"
                                    name="fiscalYearId" bindLabel="name" [ngModelOptions]="{standalone: true}"
                                    id="fiscalYearId" placeholder="Select Year Name" appendTo="body"
                                    [(ngModel)]="master.fiscalYearSelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group row">
                            <label for="monthName" class="col-sm-2 col-form-label">Month Name
                            </label>
                            <div class="col-sm-10">
                                <ng-select [items]="monthItems"
                                    (change)="(master.monthName = this.$event.name);getDuplicate();ShowPeriodName();"
                                    name="monthName" bindLabel="name" [ngModelOptions]="{standalone: true}"
                                    id="monthName" placeholder="Select Month Name" appendTo="body"
                                    [(ngModel)]="master.monthSelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>


                    <div class="col-md-12">
                        <div class="form-group row">
                            <div class="col-sm-1"></div>
                            <label class="col-sm-11 col-form-label" style="color: blue;"
                                for="partyId">{{TerritoryDetails}}</label>
                            <label for="salaryTypeId" class="col-sm-1 col-form-label">Employee
                                <span>*</span></label>
                            <div class="col-sm-11">
                                <ng-select nbselect
                                    (change)="(master.employeeId = this.$event.id);initEmployeeInfo(this.$event.id);"
                                    [items]="employeeItems" name="employeeId" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="employeeId" placeholder="Select Employee"
                                    appendTo="body" [(ngModel)]="master.employeeSelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-12">
                        <div class="form-group row">
                            <label for="amount" class="col-sm-1 col-form-label">Amount
                            </label>
                            <div class="col-sm-5">
                                <input type="number" class="form-control" id="amount" required
                                    [(ngModel)]="master.amount" name="amount" nbInput fullWidth placeholder="Amount">
                            </div>
                            <div class="col-sm-5"></div>
                            <div class="col-sm-1 validation-checkboxes">
                                <nb-checkbox [(ngModel)]="master.isActive" name="isActive" status="success">
                                    <b>Is Active?</b>
                                </nb-checkbox>
                            </div>
                        </div>
                    </div>

                </div>
            </form>
        </fieldset>
    </nb-card-header>
</nb-card>
