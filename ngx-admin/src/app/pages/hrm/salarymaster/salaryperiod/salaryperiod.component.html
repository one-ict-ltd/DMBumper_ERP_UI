<nb-card class="actions-card">
    <nb-card-header>{{pageNavigation}}
        <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
    </nb-card-header>
</nb-card>

<nb-card *ngIf="show">
    <nb-card-header class="text-right">
        <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
    </nb-card-header>
    <nb-card-body>
        <div class="grid-wrapper">
            <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
                [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
                [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
                (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
            </ag-grid-angular>
        </div>
    </nb-card-body>
</nb-card>

<nb-card *ngIf="!show">
    <nb-card-header>
        <fieldset [disabled]="disabled ? 'disabled' : null">
            <form #masterForm="ngForm" novalidate>
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group row">
                            <label for="salaryTypeId" class="col-sm-3 col-form-label">Salary Type
                                <span>*</span></label>
                            <div class="col-sm-9">
                                <ng-select [items]="salaryTypeItems"
                                    (change)="(master.salaryTypeId = this.$event.id);getDuplicate();ShowBonusType();ShowPeriodName();"
                                    name="salaryTypeId" bindLabel="name" [ngModelOptions]="{standalone: true}"
                                    id="salaryTypeId" placeholder="Select Salary Type" appendTo="body"
                                    [(ngModel)]="master.salaryTypeSelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group row">
                            <label for="fiscalYearId" class="col-sm-3 col-form-label">Year Name <span>*</span>
                            </label>
                            <div class="col-sm-9">
                                <ng-select [items]="fiscalYearItems"
                                    (change)="(master.fiscalYearId = this.$event.id);getDuplicate();ShowPeriodName();"
                                    name="fiscalYearId" bindLabel="name" [ngModelOptions]="{standalone: true}"
                                    id="fiscalYearId" placeholder="Select Year Name" appendTo="body"
                                    [(ngModel)]="master.fiscalYearSelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>


                    <div class="col-md-6" *ngIf="bonusTypeShow">
                        <div class="form-group row">
                            <label for="bonusTypeId" class="col-sm-3 col-form-label">Bonus Type
                            </label>
                            <div class="col-sm-9">
                                <ng-select [items]="bonusTypeItems" (change)="(master.bonusTypeId = this.$event.id);"
                                    name="bonusTypeId" bindLabel="name" [ngModelOptions]="{standalone: true}"
                                    id="bonusTypeId" placeholder="Select Bonus Type" appendTo="body"
                                    [(ngModel)]="master.bonusTypeSelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group row">
                            <label for="monthName" class="col-sm-3 col-form-label">Month Name
                            </label>
                            <div class="col-sm-9">
                                <ng-select [items]="monthItems"
                                    (change)="(master.monthName = this.$event.name);getDuplicate();ShowPeriodName();"
                                    name="monthName" bindLabel="name" [ngModelOptions]="{standalone: true}"
                                    id="monthName" placeholder="Select Month Name" appendTo="body"
                                    [(ngModel)]="master.monthSelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group row">
                            <label for="periodName" class="col-sm-3 col-form-label">Period Name
                            </label>
                            <div class="col-sm-9">
                                <input type="text" (keyup)="getDuplicate();" class="form-control" id="periodName"
                                    required [(ngModel)]="master.periodName" name="periodName" nbInput fullWidth
                                    placeholder="Period Name">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group row">
                            <label for="workingDays" class="col-sm-3 col-form-label">Working Days
                            </label>
                            <div class="col-sm-6">
                                <input type="number" class="form-control" id="workingDays" required
                                    [(ngModel)]="master.workingDays" name="workingDays" nbInput fullWidth
                                    placeholder="Working Days">
                            </div>
                            <div class="col-sm-3 validation-checkboxes">
                                <nb-checkbox [(ngModel)]="master.isActive" name="isActive" status="success">
                                    <b>Is Active?</b>
                                </nb-checkbox>
                            </div>
                        </div>
                    </div>

                </div>
            </form>
        </fieldset>
    </nb-card-header>
</nb-card>
