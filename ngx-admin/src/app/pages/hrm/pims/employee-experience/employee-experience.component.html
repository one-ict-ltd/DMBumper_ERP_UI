<nb-card class="actions-card">
    <nb-card-header>
        <a href="/#/pages/hrm/empallinfo?employeeId={{master.employeeId}}" title="Back">{{pageNavigation}}</a>
        <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
    </nb-card-header>
</nb-card>

<nb-card *ngIf="show">
    <nb-card-header class="text-right">
        <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
    </nb-card-header>
    <nb-card-body>
        <div class="grid-wrapper">
            <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
                [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
                [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
                (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
            </ag-grid-angular>
        </div>
    </nb-card-body>
</nb-card>

<nb-card *ngIf="!show">
    <nb-card-header>
        <fieldset [disabled]="disabled ? 'disabled' : null">
            <form #masterForm="ngForm" novalidate>
                <div class="row">
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label" for="name">Organization<span>*</span></label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" required [(ngModel)]="master.organization"
                                    id="organization" name="organization" nbInput fullWidth placeholder="Enter organization">
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label" for="name">Appointed Designation<span>*</span></label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" required [(ngModel)]="master.appointedDesignation"
                                    id="appointedDesignation" name="appointedDesignation" nbInput fullWidth placeholder="Enter appointed designation">
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label" for="name">Department<span>*</span></label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" required [(ngModel)]="master.department"
                                    id="department" name="department" nbInput fullWidth placeholder="Enter department">
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label" for="name">Last Designation<span>*</span></label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" required [(ngModel)]="master.designation"
                                    id="designation" name="designation" nbInput fullWidth placeholder="Enter last designation">
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label" for="dob">Start Date<span>*</span></label>
                            <div class="col-sm-9">
                                <input required [(ngModel)]="master.startDate" [nbDatepicker]="startdate" nbInput
                                    fullWidth placeholder="Enter start date" [ngModelOptions]="{standalone: true}">
                                <nb-datepicker #startdate></nb-datepicker>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label" for="dob">End Date<span>*</span></label>
                            <div class="col-sm-9">
                                <input required [(ngModel)]="master.endDate" [nbDatepicker]="enddate" nbInput
                                    fullWidth placeholder="Enter end date" [ngModelOptions]="{standalone: true}">
                                <nb-datepicker #enddate></nb-datepicker>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group row">
                            <label for="address" class="col-sm-3 col-form-label">Remarks</label>
                            <div class="col-sm-9">
                                <textarea type="text" class="form-control" id="address" required
                                    [(ngModel)]="master.remarks" name="address" nbInput fullWidth></textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </fieldset>
    </nb-card-header>
</nb-card>
