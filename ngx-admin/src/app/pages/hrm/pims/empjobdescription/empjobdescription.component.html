<nb-card class="actions-card">
    <nb-card-header>
        <a href="/#/pages/hrm/empallinfo?employeeId={{master.employeeId}}" title="Back">{{pageNavigation}}</a>
        <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
    </nb-card-header>
</nb-card>

<nb-card *ngIf="show">
    <nb-card-header class="text-right">
        <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
    </nb-card-header>
    <nb-card-body>
        <div class="grid-wrapper">
            <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
                [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
                [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
                (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
            </ag-grid-angular>
        </div>
    </nb-card-body>
</nb-card>

<nb-card *ngIf="!show">
    <nb-card-header>
        <fieldset [disabled]="disabled ? 'disabled' : null">
            <form #masterForm="ngForm" novalidate>
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group row">
                            <label for="jobDescription" class="col-sm-3 col-form-label">Job Description</label>
                            <div class="col-sm-9">
                                <textarea type="text" class="form-control" id="jobDescription" required
                                    [(ngModel)]="master.jobDescription" name="jobDescription" nbInput fullWidth></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group row">
                            <label for="slNo" class="col-sm-3 col-form-label">Sequence No
                                <span>*</span></label>
                            <div class="col-sm-6">
                                <input type="number" class="form-control" id="slNo" required [(ngModel)]="master.slNo"
                                    name="slNo" nbInput fullWidth placeholder="Sequence No">
                            </div>
                            <div class="col-sm-3">
                                <button (click)="addDetails(dialog)" class="btn btn-warning btn-sm"><i
                                        class="fa fa-plus" aria-hidden="true"></i>
                                    Add
                                </button>
                            </div>
                        </div>
                    </div>
                    
                </div>
            </form>
        </fieldset>
    </nb-card-header>
</nb-card>

<div class="row" *ngIf="!show">
    <div class="col-md-12 col-lg-12">
        <nb-card class="min-height">
            <fieldset [disabled]="disabled ? 'disabled' : null">
                <nb-tabset>
                    <nb-tab tabTitle="Job Description Details" class="btn-tab">
                        <div class="grid-wrapper">
                            <table class=" table table-bordered table-striped">
                                <tr>
                                    <th>SN</th>
                                    <th>Job Description</th>
                                    <th>Sequence No</th>
                                    <th>Is Active?</th>
                                    <td>Action</td>
                                </tr>
                                <tr *ngFor="let detail of master.lstDetails; let rowIndex = index">
                                    <td>{{rowIndex+1}}</td>
                                    <td>
                                        <input [(ngModel)]="detail.jobDescription" type="text" class="form-control"
                                            id="jobDescription" required name="jobDescription" nbInput fullWidth
                                            placeholder="Job Description">
                                    </td>
                                    <td>
                                        <input [(ngModel)]="detail.slNo" type="text" class="form-control" id="seqNo"
                                            required name="seqNo" nbInput fullWidth placeholder="Sequence No">
                                    </td>
                                    <td>
                                        <nb-checkbox [(ngModel)]="detail.isActive" id="isActive" name="isActive"
                                            status="success">
                                        </nb-checkbox>
                                    </td>
                                    <td>
                                        <button (click)="deleteDetail(rowIndex)" class="btn btn-danger btn-sm m-1">
                                            <i class="fa fa-trash" aria-hidden="true"></i>
                                        </button>
                                    </td>
                                </tr>
                            </table>
                        </div>
                    </nb-tab>
                </nb-tabset>
            </fieldset>
        </nb-card>
    </div>
</div>
