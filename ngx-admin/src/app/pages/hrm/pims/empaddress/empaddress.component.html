<nb-card class="actions-card">
    <nb-card-header>
        <a href="/#/pages/hrm/empallinfo?employeeId={{master.employeeId}}" title="Back">{{pageNavigation}}</a>
        <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
    </nb-card-header>
</nb-card>

<nb-card *ngIf="show">
    <nb-card-header class="text-right">
        <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
    </nb-card-header>
    <nb-card-body>
        <div class="grid-wrapper">
            <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
                [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
                [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
                (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
            </ag-grid-angular>
        </div>
    </nb-card-body>
</nb-card>

<nb-card *ngIf="!show">
    <nb-card-header>
        <fieldset [disabled]="disabled ? 'disabled' : null">
            <form #masterForm="ngForm" novalidate>
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group row">
                            <label for="addressTypeId" class="col-sm-3 col-form-label">Address Type
                                <span>*</span></label>
                            <div class="col-sm-9">
                                <ng-select nbselect (change)="master.addressTypeId = $event ? $event.id : null; getDuplicate();" 
                                    [items]="addressTypeItems" name="addressTypeId" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="addressTypeId"
                                    placeholder="Select Address Type" appendTo="body"
                                    [(ngModel)]="master.addressTypeSelected" [clearable]="true">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group row">
                            <label for="divisionId" class="col-sm-3 col-form-label">Division Name</label>
                            <div class="col-sm-9">
                                <ng-select nbselect
                                    (change)="(master.divisionId = this.$event.id);getDistrict(this.$event.id);"
                                    [items]="divisionItems" name="divisionId" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="divisionId" placeholder="Select division"
                                    appendTo="body" [(ngModel)]="master.divisionSelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group row">
                            <label for="districtId" class="col-sm-3 col-form-label">District Name</label>
                            <div class="col-sm-9">
                                <ng-select nbselect
                                    (change)="(master.districtId = this.$event.id);getThana(this.$event.id);"
                                    [items]="districtItems" name="districtId" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="districtId" placeholder="Select district"
                                    appendTo="body" [(ngModel)]="master.districtSelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group row">
                            <label for="thanaId" class="col-sm-3 col-form-label">Thana Name</label>
                            <div class="col-sm-9">
                                <ng-select nbselect (change)="(master.thanaId = this.$event.id);" [items]="thanaItems"
                                    name="thanaId" bindLabel="name" [ngModelOptions]="{standalone: true}" id="thanaId"
                                    placeholder="Select thana" appendTo="body" [(ngModel)]="master.thanaSelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group row">
                            <label for="address" class="col-sm-3 col-form-label">Address</label>
                            <div class="col-sm-9">
                                <textarea type="text" class="form-control" id="address" required
                                    [(ngModel)]="master.address" name="address" nbInput fullWidth></textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </fieldset>
    </nb-card-header>
</nb-card>
