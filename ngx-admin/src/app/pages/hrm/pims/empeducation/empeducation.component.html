<nb-card class="actions-card">
    <nb-card-header>
        <a href="/#/pages/hrm/empallinfo?employeeId={{master.employeeId}}" title="Back">{{pageNavigation}}</a>
        <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
    </nb-card-header>
</nb-card>

<nb-card *ngIf="show">
    <nb-card-header class="text-right">
        <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
    </nb-card-header>
    <nb-card-body>
        <div class="grid-wrapper">
            <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
                [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
                [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
                (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
            </ag-grid-angular>
        </div>
    </nb-card-body>
</nb-card>

<nb-card *ngIf="!show">
    <nb-card-header>
        <fieldset [disabled]="disabled ? 'disabled' : null">
            <form #masterForm="ngForm" novalidate>
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group row">
                            <label for="addressTypeId" class="col-sm-3 col-form-label">Level Of Education
                                <span>*</span></label>
                            <div class="col-sm-9">
                                <ng-select nbselect
                                    (change)="master.levelOfEducationId  = $event ? $event.id : null;getDegree(this.$event.id);getDuplicate();"
                                    [items]="levelOfEducationItems" name="addressTypeId" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="addressTypeId"
                                    placeholder="Select Level Of Education" appendTo="body"
                                    [(ngModel)]="master.levelOfEducationSelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group row">
                            <label for="degreeId" class="col-sm-3 col-form-label">Degree</label>
                            <div class="col-sm-9">
                                <ng-select nbselect
                                    (change)="master.degreeId  = $event ? $event.id : null;getMajor(this.$event.id);"
                                    [items]="degreeItems" name="degreeId" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="degreeId" placeholder="Select degree"
                                    appendTo="body" [(ngModel)]="master.degreeSelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group row">
                            <label for="degreesubjectId" class="col-sm-3 col-form-label">Subject/Major</label>
                            <div class="col-sm-9">
                                <ng-select nbselect (change)="master.degreesubjectId  = $event ? $event.id : null;"
                                    [items]="mejorItems" name="degreesubjectId" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="degreesubjectId"
                                    placeholder="Select Mejor/Subject" appendTo="body"
                                    [(ngModel)]="master.subjectOrGroupSelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label" for="fullName">Passing Year <span>*</span></label>
                            <div class="col-sm-9">
                                <input type="number" class="form-control" required [(ngModel)]="master.passingYear"
                                    id="passingYear" name="passingYear" nbInput fullWidth placeholder="Passing Year">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group row">
                            <label for="resultId" class="col-sm-3 col-form-label">Result Type</label>
                            <div class="col-sm-9">
                                <ng-select nbselect (change)="master.resultId  = $event ? $event.id : null;"
                                    [items]="resultTypeItems" name="resultId" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="resultId" placeholder="Select result type"
                                    appendTo="body" [(ngModel)]="master.resultTypeSelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label" for="grade">Result<span>*</span></label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" required [(ngModel)]="master.grade" id="grade"
                                    name="grade" nbInput fullWidth placeholder="Enter result">
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label" for="institution">Institution<span>*</span></label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" required [(ngModel)]="master.institution"
                                    id="institution" name="institution" nbInput fullWidth
                                    placeholder="Enter institution">
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </fieldset>
    </nb-card-header>
</nb-card>
