<nb-card class="actions-card">
    <nb-card-header>
        <a href="/#/pages/hrm/empallinfo?employeeId={{master.employeeId}}" title="Back">{{pageNavigation}}</a>
        <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
    </nb-card-header>
</nb-card>

<nb-card *ngIf="show">
    <nb-card-header class="text-right">
        <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
    </nb-card-header>
    <nb-card-body>
        <div class="grid-wrapper">
            <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
                [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
                [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
                (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
            </ag-grid-angular>
        </div>
    </nb-card-body>
</nb-card>

<nb-card *ngIf="!show">
    <nb-card-header>
        <fieldset [disabled]="disabled ? 'disabled' : null">
            <form #masterForm="ngForm" novalidate>
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group row">
                            <label for="relationId" class="col-sm-3 col-form-label">Relation
                                <span>*</span></label>
                            <div class="col-sm-9">
                                <ng-select nbselect (change)="master.relationId = $event ? $event.id : null;"
                                    [items]="relationItems" name="relationId" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="relationId"
                                    placeholder="Select relationship" appendTo="body"
                                    [(ngModel)]="master.relationSelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label" for="name">Name <span>*</span></label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" required [(ngModel)]="master.name"
                                    id="name" name="name" nbInput fullWidth placeholder="Enter name">
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label" for="dob">DOB</label>
                            <div class="col-sm-9">
                                <input required [(ngModel)]="master.dob" [nbDatepicker]="dob" nbInput
                                    fullWidth placeholder="Enter date of birth" [ngModelOptions]="{standalone: true}">
                                <nb-datepicker #dob></nb-datepicker>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label" for="mobile">Mobile <span>*</span></label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" required [(ngModel)]="master.mobile"
                                    id="mobile" name="mobile" nbInput fullWidth placeholder="Enter mobile number">
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label" for="nid">NID </label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" required [(ngModel)]="master.nid"
                                    id="nid" name="nid" nbInput fullWidth placeholder="Enter NID">
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label" for="passport">Passport </label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" required [(ngModel)]="master.passport"
                                    id="passport" name="passport" nbInput fullWidth placeholder="Enter passport">
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label" for="email">Email </label>
                            <div class="col-sm-9">
                                <input type="email" class="form-control" required [(ngModel)]="master.email"
                                    id="email" name="email" nbInput fullWidth placeholder="Enter email">
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label" for="occupation">Occupation </label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" required [(ngModel)]="master.occupation"
                                    id="occupation" name="occupation" nbInput fullWidth placeholder="Enter occupation">
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </fieldset>
    </nb-card-header>
</nb-card>
