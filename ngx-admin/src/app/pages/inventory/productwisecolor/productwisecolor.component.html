<nb-card class="actions-card">
    <nb-card-header>{{pageNavigation}}
        <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
    </nb-card-header>
</nb-card>

<nb-card *ngIf="show">
    <nb-card-header class="text-right">
        <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
    </nb-card-header>
    <nb-card-body>
        <div class="grid-wrapper">
            <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
                [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
                [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
                (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
            </ag-grid-angular>
        </div>
    </nb-card-body>
</nb-card>

<nb-card *ngIf="!show">
    <nb-card-header>
        <fieldset [disabled]="disabled ? 'disabled' : null">
            <form #masterForm="ngForm">
                <div class="row">
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label for="productId" class="col-sm-3 col-form-label">Product
                                Name <span>*</span></label>
                            <div class="col-sm-9">
                                <ng-select nbselect
                                    (change)="getAllProductSpecification(master.productId = this.$event.id);"
                                    [items]="ProductList" name="productId" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="productId"
                                    placeholder="Select Product Name" appendTo="body"
                                    [(ngModel)]="master.productSelected">
                                </ng-select>
                            </div>

                        </div>
                    </div>
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label for="productWiseSpecificationId" class="col-sm-3 col-form-label">Product
                                Specification<span>*</span></label>
                            <div class="col-sm-9">
                                <ng-select nbselect (change)=" (master.productWiseSpecificationId = this.$event.id);"
                                    [items]="ProductSpecificationList" name="productWiseSpecificationId"
                                    bindLabel="name" [ngModelOptions]="{standalone: true}"
                                    id="productWiseSpecificationId" placeholder="Select Product Specification"
                                    appendTo="body" [(ngModel)]="master.productspecificationSelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label for="colorCode" class="col-sm-3 col-form-label">Color Name</label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" required [(ngModel)]="master.colorCode"
                                    id="colorCode" name="colorCode" nbInput fullWidth placeholder="Color Name">
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label for="minRange" class="col-sm-3 col-form-label">Minimum Range</label>
                            <div class="col-sm-9">
                                <input type="number" class="form-control" required [(ngModel)]="master.minRange"
                                    id="minRange" name="minRange" nbInput fullWidth placeholder="Color Name">
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label for="maxRange" class="col-sm-3 col-form-label">Maximum Range</label>
                            <div class="col-sm-9">
                                <input type="number" class="form-control" required [(ngModel)]="master.maxRange"
                                    id="maxRange" name="maxRange" nbInput fullWidth placeholder="Color Name">
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </fieldset>
    </nb-card-header>
</nb-card>
