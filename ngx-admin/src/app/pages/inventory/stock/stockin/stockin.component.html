<nb-card class="actions-card">
    <nb-card-header>{{pageNavigation}}
        <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
    </nb-card-header>
</nb-card>

<nb-card *ngIf="show">
    <nb-card-header class="text-right">
        <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
    </nb-card-header>
    <nb-card-body>
        <div class="grid-wrapper">
            <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
                [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
                [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
                (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
            </ag-grid-angular>
        </div>
    </nb-card-body>
</nb-card>

<nb-card *ngIf="!show">
    <nb-card-header>
        <fieldset [disabled]="disabled ? 'disabled' : null">
            <form #masterForm="ngForm">
                <div class="row">


                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label for="companyId" class="col-sm-12 col-form-label">Company<span>*</span></label>
                            <div class="col-sm-12">
                                <ng-select nbselect (change)="getSBU(master.companyId = this.$event.id);"
                                    [items]="companyList" name="companyId" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="companyId" placeholder="Select Company"
                                    appendTo="body" [(ngModel)]="master.companySelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label for="sbuId" class="col-sm-12 col-form-label">Branch<span>*</span> </label>
                            <div class="col-sm-12">
                                <ng-select nbselect (change)="getStore(master.sbuId = this.$event.id);" [items]="sbus"
                                    name="sbuId" bindLabel="name" [ngModelOptions]="{standalone: true}" id="sbuId"
                                    placeholder="Select a Warehouse" appendTo="body"
                                    [(ngModel)]="master.branchSelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label for="storeId" class="col-sm-12 col-form-label">Store <span>*</span></label>
                            <div class="col-sm-12">
                                <ng-select nbselect (change)="(master.storeId = this.$event.id);" [items]="StoreList"
                                    name="storeId" bindLabel="name" [ngModelOptions]="{standalone: true}" id="storeId"
                                    placeholder="Select a Warehouse" appendTo="body" [(ngModel)]="master.storeSelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-12 col-form-label" for="stockNo">MR No.<span>*</span></label>
                            <div class="col-sm-12">
                                <input type="text" class="form-control" required [(ngModel)]="master.stockNo"
                                    id="stockNo" name="stockNo" nbInput fullWidth placeholder="Purchase Order No.">
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-12 col-form-label" for="stockDate">MR Date<span>*</span></label>
                            <div class="col-sm-12">
                                <input required [(ngModel)]="master.stockDate" [nbDatepicker]="fdatepicker" nbInput
                                    fullWidth placeholder="Date" [ngModelOptions]="{standalone: true}">
                                <nb-datepicker #fdatepicker></nb-datepicker>
                            </div>
                        </div>
                    </div>


                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label for="poReceiveId" class="col-sm-12 col-form-label">PO Receive
                                No.<span>*</span></label>
                            <div class="col-sm-12">
                                <ng-select nbselect (change)="(master.poReceiveId = this.$event.id);"
                                    [items]="POReceiveList" name="poReceiveId" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="poReceiveId"
                                    placeholder="Select a Warehouse" appendTo="body"
                                    [(ngModel)]="master.POReceiveSelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-12 col-form-label" for="remarks">Remarks</label>
                            <div class="col-sm-12">
                                <input type="text" class="form-control" required [(ngModel)]="master.remarks"
                                    id="remarks" name="remarks" nbInput fullWidth placeholder="remarks">
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-12 col-form-label" for="stockCategory">Stock Category</label>
                            <div class="col-sm-12">
                                <input type="text" readonly class="form-control" required
                                    [(ngModel)]="master.stockCategory" id="stockCategory" name="stockCategory" nbInput
                                    fullWidth placeholder="Purchase">
                            </div>
                        </div>
                    </div>

                </div>
            </form>
        </fieldset>
    </nb-card-header>
</nb-card>

<div class="row" *ngIf="!show">
    <div class="col-md-12 col-lg-12">
        <nb-card class="min-height">
            <fieldset [disabled]="disabled ? 'disabled' : null">
                <nb-tabset>
                    <nb-tab tabTitle="Stock In Details" class="btn-tab">

                        <div class="text-right">
                            <button (click)="Clear()" class="btn btn-warning btn-sm"> <i class="fa fa-refresh"
                                    aria-hidden="true"></i> Clear </button>
                            <button (click)="getPOReceivedetails(dialog)" class="btn btn-success btn-sm m-3"> <i
                                    class="fa fa-plus" aria-hidden="true"></i> Add </button>
                        </div>

                        <div class="grid-wrapper">
                            <table class=" table table-bordered table-striped">
                                <tr>
                                    <th>SN</th>
                                    <th>POReceive</th>
                                    <th>Product</th>
                                    <th>Purchase Qty</th>
                                    <th>Purchase Rate</th>
                                    <th>Stock Qty</th>
                                </tr>

                                <tr *ngFor="let detail of master.stockDetailsList; let rowIndex = index">
                                    <td>{{rowIndex+1}}</td>
                                    <td>
                                        <input [(ngModel)]="detail.purReqNo" readonly type="text" class="form-control"
                                            id="purReqNo" required name="purReqNo" nbInput fullWidth
                                            placeholder="purReqNo">
                                    </td>
                                    <td>
                                        <input [(ngModel)]="detail.productName" readonly type="text"
                                            class="form-control" id="productName" required name="productName" nbInput
                                            fullWidth placeholder="Product Name">
                                    </td>
                                    <td>
                                        <input [(ngModel)]="detail.poQty" type="text" readonly
                                            class="form-control text-right" id="poQty" required name="poQty" nbInput
                                            fullWidth placeholder="poQty">
                                    </td>
                                    <td>
                                        <input [(ngModel)]="detail.purchaseRate" readonly type="text"
                                            class="form-control text-right" id="purchaseRate" required
                                            name="purchaseRate" nbInput fullWidth placeholder="purchaseRate">
                                    </td>
                                    <td>
                                        <input [(ngModel)]="detail.stockQty" type="number"
                                            class="form-control text-right" id="stockQty" required name="stockQty"
                                            nbInput fullWidth placeholder="stockQty">
                                    </td>

                                </tr>
                            </table>
                        </div>
                    </nb-tab>

                </nb-tabset>
            </fieldset>
        </nb-card>
    </div>
</div>

<nb-card style="visibility: hidden;">
    <nb-card-header>
        <div id="reportHeader">
            <ngx-rpt-header></ngx-rpt-header>
        </div>
    </nb-card-header>
    <nb-card-body>
        <div class="grid-wrapper">

            <table id="header_table_top" class="table" style="width: 550px;">
                <tbody>
                    <tr>
                        <td> <strong>Stock In</strong></td>
                    </tr>
                </tbody>
            </table>

            <table id="header_table" class="table" style="width: 550px;">
                <tbody>
                    <tr>
                        <td> <strong>Stock No:</strong></td>
                        <td>{{stockNo}}</td>
                        <td><strong>Stock Date:</strong></td>
                        <td>{{stockDate}}</td>
                    </tr>
                </tbody>
            </table>
            <table id="body_table" class="table" style="width: 550px;">
                <thead>
                    <tr>
                        <th *ngFor="let item of tableHeader; let i = index;">{{item}}</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of bodyData; let j = index;">
                        <td>{{j+1}}</td>
                        <td>{{item.productName}}</td>
                        <td>{{item.storeName}}</td>
                        <td>{{item.CurrentStock}}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </nb-card-body>
    <nb-card-footer>
        <ngx-rpt-footer></ngx-rpt-footer>
    </nb-card-footer>
</nb-card>
