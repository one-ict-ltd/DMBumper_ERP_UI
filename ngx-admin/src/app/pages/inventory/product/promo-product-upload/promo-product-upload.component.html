<nb-card class="actions-card">
    <nb-card-header> <label class="col-form-label" for="">{{pageNavigation}}</label>
        <ngx-common-button (click)="ButtonAction()" *ngIf="!isDisabled"></ngx-common-button>
    </nb-card-header>
</nb-card>

<nb-card *ngIf="show">
    <nb-card-header class="text-right">
        <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
    </nb-card-header>
    <nb-card-body>
        <div class="grid-wrapper">
            <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
                [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
                [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
                (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
            </ag-grid-angular>
        </div>
    </nb-card-body>
</nb-card>



<div class="row" *ngIf="!show">
    <div class="col-md-12 col-lg-12">
        <nb-card class="min-height">
            <fieldset [disabled]="disabled ? 'disabled' : null">
                <nb-tabset>
                    <nb-tab tabTitle="Promo Product Upload Details" class="btn-tab">
                        <div class="row">
                            <div class="col-6">
                                <div class="form-group row">
                                    <label for="salaryHeadId" class="col-sm-4 col-form-label">Upload Data Format</label>
                                    <div class="col-sm-8">
                                        <a href="./../../../../assets/DocFormat/OPL_PromoProducts_Upload_Sample_Format.xlsx"
                                            download="OPL_PromoProducts_Upload_Sample_Format.xlsx"
                                            class="form-control btn btn-warning btn-sm">
                                            Download Sample Format or Promo Product Upload
                                        </a>
                                    </div>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="form-group row">
                                    <label class="col-sm-4 col-form-label" for="structureAmount">Upload Promo Product
                                        file
                                        <span>*</span></label>
                                    <div class="col-sm-8">
                                        <input type="file" (change)="onFileChange($event)" multiple="false"
                                            class="form-control" />
                                    </div>
                                </div>
                            </div>
                        </div>
                    </nb-tab>
                </nb-tabset>
            </fieldset>
        </nb-card>
    </div>
</div>
<nb-card *ngIf="!show">
    <nb-card-header>
        <div class="col-12" style="text-align: center;">
            <button (click)="VerifyData()" class="btn btn-success btn-md m-3"> Verify Data <i class="fa fa-check"
                    aria-hidden="true"></i></button>
        </div>
    </nb-card-header>
    <nb-card-body>
        <div class="row">
            <div class="col-5">
                <h6> Total <span>{{totalData}}</span> record<span *ngIf="totalData>0" style="color: black;">s</span>
                    found</h6>
            </div>
            <div class="col-7">
                <h6> Verification Status: <span
                        [style.color]="verifyStatus === 'Successed' ? 'green' : 'red'">{{verifyStatus}}</span></h6>
            </div>
        </div>
        <div class="table-wrapper-scroll-y my-custom-scrollbar">
            <div class="grid-wrapper" style="overflow-y:scroll; overflow-x: scroll; max-height: 500px">
                <table class=" table table-bordered table-striped">
                    <tr>
                        <th>#</th>
                        <th>Brand</th>
                        <th>SKU Number</th>
                        <th>SKU Name</th>
                        <th>Product Category</th>
                        <th>Status</th>
                        <th hidden>Action</th>
                    </tr>
                    <tr *ngFor="let details of master.lstDetailsViewModel; let rowIndex = index">
                        <td>{{rowIndex+1}}</td>
                        <td>{{details.brand}}</td>
                        <td>{{details.skuNumber}}</td>
                        <td>{{details.skuName}}</td>
                        <td>{{details.productCategory}}</td>
                        <td [style.color]="details.status === 'OK' ? 'green' : 'red'">{{details.status}}</td>
                        <td hidden>
                            <button (click)="deleteDetails(rowIndex)" class="btn btn-danger btn-sm m-1">
                                <i class="fa fa-trash" aria-hidden="true"></i>
                            </button>
                        </td>
                    </tr>
                </table>
            </div>
        </div>
    </nb-card-body>
    <nb-card-footer>
    </nb-card-footer>
</nb-card>
