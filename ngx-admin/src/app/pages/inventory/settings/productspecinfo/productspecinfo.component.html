<nb-card class="actions-card">
    <nb-card-header>{{pageNavigation}}
        <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
    </nb-card-header>
</nb-card>

<nb-card *ngIf="show">
    <nb-card-header class="text-right">
        <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
    </nb-card-header>
    <nb-card-body>
        <div class="grid-wrapper">
            <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
                [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
                [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
                (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
            </ag-grid-angular>
        </div>
    </nb-card-body>
</nb-card>

<nb-card *ngIf="!show">
    <nb-card-header>
        <fieldset [disabled]="disabled ? 'disabled' : null">
            <form #masterForm="ngForm">
                <div class="row">
                    <div class="col-md-12">
                        <div class="form-group row">
                            <div class="col-sm-4">
                                <label class="col-form-label" for="productName">Product
                                    Type<span>*</span></label>
                                <ng-select nbselect
                                    (change)="(getTypeWiseProducts(0,this.$event.id)); (master.productTypeId = this.$event.id);"
                                    [items]="productTypeList" name="productTypeId" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="productTypeId"
                                    placeholder="Select Product Type" appendTo="body"
                                    [(ngModel)]="master.productTypeSelected">
                                </ng-select>
                            </div>
                             <div class="col-sm-8">
                                        <label class="col-form-label" for="productName">Product
                                            Name<span>*</span></label>
                                        <ng-select nbselect
                                            (change)="(master.productWiseSpecificationId = this.$event.id);getLastPurchaseOrderDetailsBySpecId(this.$event,this.$event.id);"
                                            [items]="productList" name="productWiseSpecificationId" bindLabel="name"
                                            [ngModelOptions]="{standalone: true}" id="productWiseSpecificationId"
                                            placeholder="Select product" appendTo="body"
                                            [(ngModel)]="master.productSelected">
                                        </ng-select>
                                    </div>
                            <div class="col-sm-4">
                                <label class="col-form-label" for="specificationDetails">Specification Details</label>
                                <textarea type="text" class="form-control" required [(ngModel)]="master.specificationDetails"
                                id="specificationDetails" name="specificationDetails" nbInput fullWidth
                                placeholder="Specification Details" rows="4"></textarea>
                            </div>
                            <div class="col-sm-4">
                                <div class="form-group row">
                                <div class="col-sm-12 validation-checkboxes">
                                    <nb-checkbox [(ngModel)]="master.isActive" name="isActive" status="success">
                                        <b>Is Active?</b>
                                    </nb-checkbox>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                </div>
              </div>
            </form>
        </fieldset>
    </nb-card-header>
</nb-card>
