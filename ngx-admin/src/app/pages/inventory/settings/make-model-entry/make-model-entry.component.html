<nb-card class="actions-card">
    <nb-card-header>{{pageNavigation}}
        <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
    </nb-card-header>
</nb-card>

<nb-card *ngIf="show">
    <nb-card-header class="text-right">
        <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
    </nb-card-header>
    <nb-card-body>
        <div class="grid-wrapper">
            <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules" [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData" [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
                (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
            </ag-grid-angular>
        </div>
    </nb-card-body>
</nb-card>

<nb-card *ngIf="!show">
    <nb-card-header>
        <fieldset [disabled]="disabled ? 'disabled' : null">
            <form #masterForm="ngForm">
                <div class="row">
                    <div class="col-lg-12 col-md-12 col-sm-12">
                            <div class="form-group row">
                                <label for="makeId" class="col-sm-2 col-form-label">Make<span style="color: red;">*</span></label>
                                <div class="col-sm-10">
                                    <ng-select nbselect
                                        (change)="(master.makeId = this.$event.id);(master.make = this.$event.name);"
                                        [items]="makeList" name="makeId" bindLabel="name"
                                        [ngModelOptions]="{standalone: true}" id="makeId"
                                        placeholder="Select Make" appendTo="body"
                                        [(ngModel)]="master.makeSelected"
                                        [disabled]="disabled ? 'disabled' : null" required>
                                    </ng-select>
                                </div>
                            </div>
                        </div>
                    
                    <div class="col-lg-12 col-md-12 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-2 col-form-label" for="makeModelName">Model<span style="color: red;">*</span></label>
                            <div class="col-sm-10">
                                <input type="text" class="form-control" required [(ngModel)]="master.makeModelName" id="makeModelName" name="makeModelName" nbInput fullWidth placeholder="Model Name">
                            </div>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="form-group row">
                            <div class="col-sm-12 validation-checkboxes">
                                <nb-checkbox [(ngModel)]="master.isActive" name="isActive" status="success">
                                    <b>Is Active?</b>
                                </nb-checkbox>
                            </div>
                        </div>
                    </div>

                </div>
            </form>
        </fieldset>
    </nb-card-header>
</nb-card>
