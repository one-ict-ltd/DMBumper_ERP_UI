<nb-card class="actions-card">
    <nb-card-header>{{pageNavigation}}
        <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
    </nb-card-header>
</nb-card>

<nb-card *ngIf="show">
    <nb-card-header class="text-right">
        <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
    </nb-card-header>
    <nb-card-body>
        <div class="grid-wrapper">
            <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
                [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
                [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
                (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
            </ag-grid-angular>
        </div>
    </nb-card-body>
</nb-card>


<div class="row" *ngIf="!show">
    <div class="col-md-12 col-lg-12">
        <nb-card class="min-height">
            <fieldset [disabled]="disabled ? 'disabled' : null">
                <nb-tabset>

                    <nb-tab tabTitle=" List of Terms and Conditions" class="btn-tab">

                        <div class="row">
                            <div class="col-md-12">
                                <div class="form-group row">
                                    <div class="col-sm-3" hidden>
                                        <label class="col-form-label" for="supplierId">Supplier Name<span
                                                style="color: red;">*</span></label>
                                        <ng-select nbselect
                                            (change)="(master.supplierId = this.$event.id);gettermsandconditionbypartyid(this.$event.id);"
                                            [items]="supplierList" name="supplierId" bindLabel="name"
                                            [ngModelOptions]="{standalone: true}" id="supplierId"
                                            placeholder="Select Supplier" appendTo="body"
                                            [(ngModel)]="master.partyNameSelected">
                                        </ng-select>
                                    </div>

                                    <div class="col-sm-3">
                                        <label class="col-form-label" for="supplierId">Product Type<span
                                                style="color: red;">*</span></label>
                                        <ng-select nbselect
                                            (change)="(master.productTypeId = this.$event.id);gettermsandconditionbypartyid(this.$event.id);"
                                            [items]="productTypeList" name="productTypeId" bindLabel="name"
                                            [ngModelOptions]="{standalone: true}" id="productTypeId"
                                            placeholder="Select Product Type" appendTo="body"
                                            [(ngModel)]="master.productTypeSelected"
                                            [disabled]="disabled ? 'disabled' : null">
                                        </ng-select>
                                    </div>
                                    <div class="col-sm-3">
                                        <label class="col-form-label" for="partytTerms">Terms and Conditions<span
                                                style="color: red;">*</span></label>
                                        <input type="text" class="form-control" required
                                            [(ngModel)]="master.partytTerms" id="partytTerms" name="partytTerms" nbInput
                                            fullWidth placeholder="Write terms and conditions">
                                    </div>

                                    <div class="col-md-3">
                                        <div class="text-right">
                                            <button (click)="refesh()" class="btn btn-warning btn-sm"> <i
                                                    class="fa fa-refresh" aria-hidden="true"></i> Refresh </button>
                                            <button (click)="addDetails(dialog)" class="btn btn-success btn-sm m-3"> <i
                                                    class="fa fa-plus" aria-hidden="true"></i> Add </button>

                                            <!-- [hidden]="!master.partytTerms"  -->
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="grid-wrapper">
                            <table class=" table table-bordered table-striped">
                                <tr>
                                    <th>SN</th>
                                    <th hidden>Supplier Name</th>
                                    <th>Product Type Name</th>
                                    <th>Terms and Conditions</th>
                                    <td>Action</td>
                                </tr>

                                <tr *ngFor="let detail of lstdetailmodel; let rowIndex = index">
                                    <td>{{rowIndex+1}}</td>
                                    <td hidden>
                                        <input [(ngModel)]="detail.supplierName" type="text" class="form-control"
                                            id="partyName" value="detail.partyName" required name="partyName" nbInput
                                            fullWidth placeholder="Supplier Name">
                                    </td>

                                    <td>
                                        <input [(ngModel)]="detail.productTypeName" type="text" class="form-control"
                                            id="productTypeName" value="detail.productTypeName" required
                                            name="partyName" nbInput fullWidth placeholder="product Type Name" readonly>
                                    </td>


                                    <td>
                                        <input [(ngModel)]="detail.termsAndConditions" type="text" class="form-control"
                                            id="text" value="detail.partytTerms" required name="text" nbInput fullWidth
                                            placeholder="Terms and Conditions">
                                    </td>

                                    <td>
                                        <button (click)="deleteDetail(rowIndex)" class="btn btn-danger btn-sm m-1">
                                            <i class="fa fa-trash" aria-hidden="true"></i>
                                        </button>
                                    </td>
                                </tr>

                            </table>
                        </div>


                    </nb-tab>

                </nb-tabset>
            </fieldset>
        </nb-card>
    </div>
</div>
