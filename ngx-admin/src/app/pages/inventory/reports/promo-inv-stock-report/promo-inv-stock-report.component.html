<nb-card class="actions-card">
    <nb-card-header>{{pageNavigation}}
        <ngx-report-button (click)="RptButtonAction()"></ngx-report-button>
    </nb-card-header>
    <nb-card-body>
        <div class="row">
            <div class="col-12">
                <div class="form-group row">
                    <label for="checkbox" class="col-sm-2 col-form-label">Product Name <span>*</span></label>
                    <div class="col-sm-10">
                        <ng-select nbselect [items]="productSpecList" [virtualScroll]="true" name="productId"
                            bindLabel="name" id="productId" [(ngModel)]="productSelected"
                            [ngModelOptions]="{standalone: true}" placeholder="Select Product" [virtualScroll]="true"
                            appendTo="body">
                        </ng-select>
                    </div>
                </div>
            </div>
            <div class="col-6">
                <div class="form-group row">
                    <label for="fromdateSelected" class="col-sm-4 col-form-label">From Date <span>*</span></label>
                    <div class="col-sm-8">
                        <input required [(ngModel)]="fDate" [nbDatepicker]="fdatepicker" nbInput fullWidth
                            placeholder="From Date" [ngModelOptions]="{standalone: true}">
                        <nb-datepicker #fdatepicker></nb-datepicker>
                    </div>
                </div>
            </div>
            <div class="col-6">
                <div class="form-group row">
                    <label for="todateSelected" class="col-sm-4 col-form-label">To Date <span>*</span></label>
                    <div class="col-sm-8">
                        <input required [(ngModel)]="tDate" [nbDatepicker]="datepicker" nbInput fullWidth
                            placeholder="To Date" [ngModelOptions]="{standalone: true}">
                        <nb-datepicker #datepicker></nb-datepicker>
                    </div>
                </div>
            </div>
        </div>
    </nb-card-body>
</nb-card>
