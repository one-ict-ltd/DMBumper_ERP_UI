<nb-card class="actions-card">
    <nb-card-header>{{pageNavigation}}
      <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
    </nb-card-header>
  </nb-card>
  
  <nb-card *ngIf="show">
    <nb-card-header class="text-right">
      <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
    </nb-card-header>
    <nb-card-body>
      <div class="grid-wrapper">
        <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
          [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
          [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
          (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
        </ag-grid-angular>
      </div>
    </nb-card-body>
  </nb-card>


  <div class="row" *ngIf="!show">
    <div class="col-md-12 col-lg-12">
        <nb-card class="min-height">
            <fieldset [disabled]="disabled ? 'disabled' : null">
                <nb-tabset>
                    <nb-tab tabTitle=" LC Amendment Charge Information" class="btn-tab">
                      <div class="row">
                        <div class="col-4">
                          <div class="form-group row">
                            <label for="dropdown" class="col-sm-4 col-form-label"><span>*</span>Ref. No.</label>
                            <div class="col-sm-8">
                              <ng-select nbselect (change)="( master.ImpLCAmendmentId = this.$event.id); getPreLcAndLcAndAmendmentData(this.$event.id)" [items]="referenceList" name="refNo"
                                bindLabel="name" [ngModelOptions]="{standalone: true}" id="ImpLCAmendmentId" placeholder="Select Reference No"
                                appendTo="body" [(ngModel)]="master.referenceSelected">
                              </ng-select>
                            </div>
                          </div>
                        </div>
                        <div class="col-4">
                            <div class="form-group row">
                              <label for="lcNo" class="col-sm-4 col-form-label">LC No</label>
                              <div class="col-sm-8">
                                <input type="text" class="form-control" id="lcNo" required [(ngModel)]="master.lcNo"
                                  name="lcNo" nbInput fullWidth placeholder="" disabled>
                              </div>
                            </div>
                          </div>
                          <div class="col-4">
                            <div class="form-group row">
                              <label for="freightAmount" class="col-sm-4 col-form-label">Freight Amount</label>
                              <div class="col-sm-8">
                                <input type="number" class="form-control" id="freightAmount" required [(ngModel)]="master.freightAmount"
                                  name="freightAmount" nbInput fullWidth placeholder="" disabled>
                              </div>
                            </div>
                          </div>
                          <div class="col-4">
                            <div class="form-group row">
                              <label for="lcAmount" class="col-sm-4 col-form-label"><span>*</span>LC Amount</label>
                              <div class="col-sm-8">
                                <input type="number" class="form-control" id="lcAmount" required [(ngModel)]="master.lcAmount"
                                  name="lcAmount" nbInput fullWidth placeholder="" disabled>
                              </div>
                            </div>
                          </div>
                          <div class="col-4">
                              <div class="form-group row">
                                <label for="totalLcAmount" class="col-sm-4 col-form-label">Total LC Amount</label>
                                <div class="col-sm-8">
                                  <input type="number" class="form-control" id="totalLcAmount" required [(ngModel)]="master.totalLcAmount"
                                    name="totalLcAmount" nbInput fullWidth placeholder="" disabled>
                                </div>
                              </div>
                            </div>
                            <div class="col-4" hidden>
                              <div class="form-group row">
                                <label for="lcaNo" class="col-sm-4 col-form-label">LCA No</label>
                                <div class="col-sm-8">
                                  <input type="text" class="form-control" id="lcaNo" required [(ngModel)]="master.lcaNo"
                                    name="lcaNo" nbInput fullWidth placeholder="" disabled>
                                </div>
                              </div>
                            </div>

                            <div class="col-4">
                                <div class="form-group row">
                                  <label for="amendmentNo" class="col-sm-4 col-form-label">Amendment No</label>
                                  <div class="col-sm-8">
                                    <input type="text" class="form-control" id="amendmentNo" required [(ngModel)]="master.amendmentNo"
                                      name="amendmentNo" nbInput fullWidth placeholder="" disabled>
                                  </div>
                                </div>
                              </div>

                        <div class="col-4">
                          <div class="form-group row">
                            <label for="amendmentDate" class="col-sm-4 col-form-label">Amendment Date</label>
                            <div class="col-sm-8">
                              <input id="amendmentDate" 
                                [(ngModel)]="master.amendmentDate" name="amendmentDate"
                                [nbDatepicker]="amendmentDate" nbInput fullWidth [ngModelOptions]="{standalone: true}" disabled>
                              <nb-datepicker #amendmentDate></nb-datepicker>
                            </div>
                          </div>
                        </div>

                        <div class="col-4">
                            <div class="form-group row">
                              <label for="amendmentChargeDate" class="col-sm-4 col-form-label" style="font-size: 12px;">Amendment Charge Date</label>
                              <div class="col-sm-8">
                                <input  id="amendmentChargeDate" 
                                  [(ngModel)]="master.amendmentChargeDate" name="amendmentChargeDate"
                                  [nbDatepicker]="amendmentChargeDate" nbInput fullWidth [ngModelOptions]="{standalone: true}">
                                <nb-datepicker #amendmentChargeDate></nb-datepicker>
                              </div>
                            </div>
                          </div>
  

                        <div class="col-4">
                          <div class="form-group row">
                            <label for="amendmentAmount" class="col-sm-4 col-form-label" style="font-size: 12px;">Amendment Amount(Tk)</label>
                            <div class="col-sm-8">
                              <input type="number" class="form-control" id="amendmentAmount" required [(ngModel)]="master.amendmentAmount"
                                name="amendmentAmount" nbInput fullWidth placeholder="">
                            </div>
                          </div>
                        </div>
                        <div class="col-8">
                            <div class="form-group row">
                              <label for="amendmentCase" class="col-sm-2 col-form-label">Amendment case</label>
                              <div class="col-sm-10">
                                <input type="text" class="form-control" id="amendmentCase" required [(ngModel)]="master.amendmentCase"
                                  name="amendmentCase" nbInput fullWidth placeholder="" disabled>
                              </div>
                            </div>
                          </div>

                          <div class="col-8">
                            <div class="form-group row">
                              <label for="remarks" class="col-sm-2 col-form-label">Remarks</label>
                              <div class="col-sm-10">
                                <input type="text" class="form-control" id="remarks" required [(ngModel)]="master.remarks"
                                  name="remarks" nbInput fullWidth placeholder="">
                              </div>
                            </div>
                          </div>
                         

                      </div>

                    </nb-tab>
                </nb-tabset>
            </fieldset>
        </nb-card>
    </div>
</div>
