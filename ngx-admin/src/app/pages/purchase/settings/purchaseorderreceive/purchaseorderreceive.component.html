<nb-card class="actions-card">
    <nb-card-header>{{pageNavigation}}
        <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
    </nb-card-header>
</nb-card>

<nb-card *ngIf="show">
    <nb-card-header class="text-right">
        <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
    </nb-card-header>
    <nb-card-body>
        <div class="grid-wrapper">
            <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
                [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
                [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
                (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
            </ag-grid-angular>
        </div>
    </nb-card-body>
</nb-card>

<nb-card *ngIf="!show">
    <nb-card-header>
        <fieldset [disabled]="disabled ? 'disabled' : null">
            <form #masterForm="ngForm">
                <div class="row">


                    <div class="col-lg-4 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-12 col-form-label" for="purchaseOrderRecvDate">Purchase Order Recv.
                                Date<span>*</span></label>
                            <div class="col-sm-12">
                                <input required [(ngModel)]="master.purchaseOrderRecvDate"
                                    (ngModelChange)="getPORecvdate();" name="purchaseOrderRecvDate"
                                    id="purchaseOrderRecvDate" [nbDatepicker]="fdatepicker" nbInput fullWidth
                                    placeholder="Date" [ngModelOptions]="{standalone: true}">
                                <nb-datepicker #fdatepicker></nb-datepicker>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-4 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-12 col-form-label" for="purOrderRecvNo">Purchase Order Receive
                                No.</label>
                            <div class="col-sm-12">
                                <text type="text" class="form-control" required [(ngModel)]="master.purOrderRecvNo"
                                    id="purOrderRecvNo" name="purOrderRecvNo" nbInput fullWidth readonly
                                    placeholder="purOrderRecvNo">{{master.purOrderRecvNo}}</text>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-4 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-12 col-form-label" for="purOrderNo">Purchase Order
                                No.<span>*</span></label>
                            <!-- [onchange]="getPurchaseOrderDetails()" -->
                            <div class="col-sm-12">
                                <ng-select nbselect
                                    (change)="( master.purchaseOrderId = this.$event.id); getPurchaseOrderDetails(this.$event.id);"
                                    [items]="purchaseOrderNos" name="purOrderNo" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="purchaseOrderId"
                                    placeholder="Select purchase order no." appendTo="body"
                                    [(ngModel)]="master.purchaseOrderNoSelected"
                                    [disabled]="isPurOrderNoDisable ? 'disabled' : null">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-4 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-12 col-form-label" for="fromsbuId">Product Receive
                                To<span>*</span></label>
                            <div class="col-sm-12">
                                <ng-select nbselect (change)="( master.fromsbuId = this.$event.id);" [items]="sbus"
                                    name="sbuName" bindLabel="name" [ngModelOptions]="{standalone: true}" id="sbuId"
                                    placeholder="Select SBU" appendTo="body" [(ngModel)]="master.tosbusSelected"
                                    [disabled]="isPurOrderNoDisable ? 'disabled' : null">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </fieldset>
    </nb-card-header>
</nb-card>
<div class="row" *ngIf="!show">
    <div class="col-md-12 col-lg-12">
        <nb-card class="min-height">
            <fieldset [disabled]="disabled ? 'disabled' : null">
                <nb-tabset>
                    <nb-tab tabTitle="Details" class="btn-tab">
                        <div class="grid-wrapper">
                            <table class=" table table-bordered table-striped">
                                <tr>
                                    <th>SN</th>
                                    <th>Select</th>
                                    <!-- <th>Purchase Order No.</th> -->
                                    <th>Product Specification Name</th>
                                    <th>Order Qty.</th>
                                    <th>Total Received Qty.</th>
                                    <th>Remaining Qty.</th>
                                    <!-- <th>Current Stock</th> -->
                                    <th>Receive Qty.</th>
                                    <th>Price</th>
                                    <th>UOM</th>
                                </tr>

                                <tr *ngFor="let detail of master.lstDetailsViewModel; let rowIndex = index">
                                    <td>{{rowIndex+1}}</td>
                                    <td>
                                        <nb-checkbox name="isUpdate" id="isUpdate" status="success"
                                            [(ngModel)]="detail.isUpdate">
                                        </nb-checkbox>
                                    </td>
                                    <!-- <td>
                                        <input [(ngModel)]="detail.purReqNo" readonly type="text" class="form-control"
                                            id="purReqNo" required name="purReqNo" nbInput fullWidth
                                            placeholder="purReqNo">
                                    </td> -->

                                    <td>
                                        <!-- <input [(ngModel)]="detail.productName" readonly type="text"
                                            class="form-control" id="productName" required name="productName" nbInput
                                            fullWidth placeholder="Product Name"> -->
                                        <div>{{detail.productName}}</div>
                                    </td>
                                    <td>
                                        <input [(ngModel)]="detail.reqQty" type="number" class="form-control text-right"
                                            id="reqQty" required name="reqQty" nbInput readonly fullWidth
                                            placeholder="reqQty">
                                    </td>
                                    <td>
                                        <input [(ngModel)]="detail.receivedQty" type="number"
                                            class="form-control text-right" id="receivedQty" readonly name="receivedQty"
                                            nbInput fullWidth placeholder="receivedQty">
                                    </td>
                                    <td>
                                        <input [(ngModel)]="detail.remainingQty" type="number"
                                            class="form-control text-right" id="remainingQty" readonly
                                            name="remainingQty" nbInput fullWidth placeholder="remainingQty">
                                    </td>
                                    <td>
                                        <input [(ngModel)]="detail.receiveQty" type="number"
                                            class="form-control text-right" id="receiveQty" required name="receiveQty"
                                            nbInput fullWidth placeholder="receiveQty" min="0"
                                            (keyup)="validateReceiveQty(rowIndex);"
                                            (change)="validateReceiveQty(rowIndex);">
                                    </td>
                                    <td>
                                        <input [(ngModel)]="detail.price" type="number" class="form-control text-right"
                                            id="price" required name="price" min="0" nbInput fullWidth
                                            placeholder="price">

                                    </td>
                                    <td>
                                        <input [(ngModel)]="detail.uomName" readonly type="text" class="form-control"
                                            id="uomName" required readonly name="uomName" nbInput fullWidth
                                            placeholder="uomName">
                                    </td>
                                </tr>
                            </table>
                        </div>
                    </nb-tab>

                </nb-tabset>
            </fieldset>
        </nb-card>
    </div>
</div>
