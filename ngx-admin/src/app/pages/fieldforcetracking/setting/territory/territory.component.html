<nb-card class="actions-card">
    <nb-card-header>{{pageNavigation}}
        <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
    </nb-card-header>
</nb-card>

<nb-card *ngIf="show">
    <nb-card-header class="text-right">
        <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
    </nb-card-header>
    <nb-card-body>
        <div class="grid-wrapper">
            <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
                [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
                [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
                (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
            </ag-grid-angular>
        </div>
    </nb-card-body>
</nb-card>

<nb-card *ngIf="!show">
    <nb-card-header>
        <fieldset [disabled]="disabled ? 'disabled' : null">
            <form #masterForm="ngForm">
                <div class="row">

                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-12 col-form-label" for="Code">Code </label>
                            <div class="col-sm-12">
                                <input type="text" class="form-control" required [(ngModel)]="master.Code" id="Code"
                                    name="Code" nbInput fullWidth placeholder="Code">
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-12 col-form-label" for="Name">Name <span>*</span></label>
                            <div class="col-sm-12">
                                <input type="text" class="form-control" required [(ngModel)]="master.Name" id="Name"
                                    name="Name" nbInput fullWidth placeholder="Territory Name">
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-12 col-form-label" for="Name">Zone Name <span>*</span></label>
                            <div class="col-sm-12">
                                <ng-select nbselect
                                    (change)="getdepotbyCode(master.ZoneCode = this.$event.id);getregionbydepoCode(master.ZoneCode = this.$event.id);"
                                    [items]="zoneList" name="zoneCode" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="zoneCode" placeholder="Select Zone"
                                    appendTo="body" [(ngModel)]="master.zoneSelected"
                                    [disabled]="disabled ? 'disabled' : null">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-12 col-form-label" for="Name">Depot Name <span>*</span></label>
                            <div class="col-sm-12">
                                <ng-select nbselect (change)="(master.DepotCode = this.$event.id);" [items]="depotList"
                                    name="DepotCode" bindLabel="name" [ngModelOptions]="{standalone: true}"
                                    id="DepotCode" placeholder="Select Depot" appendTo="body"
                                    [(ngModel)]="master.depotSelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-12 col-form-label" for="Name">Region Name <span>*</span></label>
                            <div class="col-sm-12">
                                <ng-select nbselect (change)="getareabyregionCode(master.RegionCode = this.$event.id);"
                                    [items]="RegionList" name="RegionCode" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="RegionCode" placeholder="Select Region"
                                    appendTo="body" [(ngModel)]="master.regionSelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-12 col-form-label" for="Name">Area Name <span>*</span></label>
                            <div class="col-sm-12">
                                <ng-select nbselect (change)="(master.AreaCode = this.$event.id);" [items]="AreaList"
                                    name="AreaCode" bindLabel="name" [ngModelOptions]="{standalone: true}" id="AreaCode"
                                    placeholder="Select Area" appendTo="body" [(ngModel)]="master.areaSelected">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <!-- <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-12 col-form-label" for="mobileNo">Mobile No </label>
                            <div class="col-sm-12">
                                <input type="text" class="form-control" required [(ngModel)]="master.mobileNo" id="mobileNo"
                                    name="mobileNo" nbInput fullWidth placeholder="Mobile NO">
                            </div>
                        </div>
                    </div> -->
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-12 col-form-label" for="mobileNo">Mobile No</label>
                            <div class="col-sm-12">
                                <input type="text" 
                                       class="form-control" 
                                       required 
                                       [(ngModel)]="master.mobileNo" 
                                       id="mobileNo"
                                       name="mobileNo" 
                                       nbInput 
                                       fullWidth 
                                       placeholder="Mobile NO"
                                       [disabled]="master.mobileNo && master.mobileNo.trim() !== ''">
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-12 col-form-label" for="salesLimit">Sales Limit <span>*</span></label>
                            <div class="col-sm-12">
                                <input type="number" class="form-control" required [(ngModel)]="master.salesLimit"
                                    id="salesLimit" name="salesLimit" nbInput fullWidth placeholder="Sales Limit"
                                    oninput="this.value = (Math.abs(this.value)<1?1:Math.abs(this.value))">
                            </div>
                        </div>
                    </div>
                    <!-- <div class="col-lg-6 col-md-8 col-sm-12">
                    </div> -->

                    <div class="col-lg-6 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <div class="col-sm-12 validation-checkboxes">
                                <nb-checkbox [(ngModel)]="master.IsActive" name="IsActive" status="success">
                                    <b>Is Active?</b>
                                </nb-checkbox>
                            </div>
                        </div>
                    </div>

                </div>
            </form>
        </fieldset>
    </nb-card-header>
</nb-card>
