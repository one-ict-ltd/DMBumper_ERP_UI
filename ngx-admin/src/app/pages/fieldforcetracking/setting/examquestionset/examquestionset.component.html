<nb-card class="actions-card">
    <nb-card-header>{{pageNavigation}}
        <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
    </nb-card-header>
</nb-card>

<nb-card *ngIf="show">
    <nb-card-header class="text-right">
        <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
    </nb-card-header>
    <nb-card-body>
        <div class="grid-wrapper">
            <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
                [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
                [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
                (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
            </ag-grid-angular>
        </div>
    </nb-card-body>
</nb-card>

<nb-card *ngIf="!show">
    <nb-card-header>
        <fieldset [disabled]="disabled ? 'disabled' : null">
            <form #masterForm="ngForm">
                <div class="row">
                    <div class="col-lg-4 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-12 col-form-label" for="productCode">Exam Name<span>*</span></label>
                            <div class="col-sm-12">
                                <input type="text" class="form-control" required [(ngModel)]="master.productCode"
                                    id="productCode" name="productCode" nbInput fullWidth placeholder="Exam Name">
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-4 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-12 col-form-label" for="productName">Exam Time<span
                                    style="color: red;">*</span></label>
                            <div class="col-sm-12">
                                <input type="number" class="form-control" required [(ngModel)]="master.productName"
                                    id="productName" name="productName" nbInput fullWidth
                                    placeholder="Exam Time in minutes">
                            </div>
                        </div>
                    </div>


                    <div class="col-lg-4 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label for="productTypeId" class="col-sm-12 col-form-label">Exam Content<span
                                    style="color: red;">*</span></label>
                            <div class="col-sm-12">
                                <ng-select nbselect (change)="(master.productTypeId = this.$event.id);"
                                    [items]="contentList" name="productTypeId" bindLabel="name"
                                    [ngModelOptions]="{standalone: true}" id="productSubCategoryId"
                                    placeholder="Select Content" appendTo="body"
                                    [(ngModel)]="master.productTypeSelected" [disabled]="disabled ? 'disabled' : null">
                                </ng-select>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-4 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-12 col-form-label" for="width">Total Marks</label>
                            <div class="col-sm-12">
                                <input type="text" class="form-control" required [(ngModel)]="master.width" id="width"
                                    name="width" nbInput fullWidth placeholder="Total Marks">
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-4 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-12 col-form-label" for="expiryDate">Exam Date</label>
                            <div class="col-sm-12">
                                <!-- <input type="text" class="form-control" required [(ngModel)]="master.expiryDate" id="expiryDate" name="Expiry Date" nbInput fullWidth placeholder="notification Day"> -->
                                <input required [(ngModel)]="master.expiryDate" [nbDatepicker]="fdatepicker" nbInput
                                    fullWidth placeholder="Exam Date" [ngModelOptions]="{standalone: true}">
                                <nb-datepicker #fdatepicker></nb-datepicker>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-4 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <label class="col-sm-12 col-form-label" for="startTime">Start Time</label>
                            <div class="col-sm-12">
                                <!-- <input type="text" class="form-control" required [(ngModel)]="master.expiryDate" id="expiryDate" name="Expiry Date" nbInput fullWidth placeholder="notification Day"> -->
                                    <ng-select nbselect (change)="(master.startTime = this.$event.id);"
                                    [items]="timeList" name="startTime" bindLabel="name" bindValue="name"
                                    [ngModelOptions]="{standalone: true}" id="startTime"
                                    placeholder="Select Time" appendTo="body"
                                    [(ngModel)]="master.startTime" [disabled]="disabled ? 'disabled' : null">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-4 col-md-8 col-sm-12">
                      <div class="form-group row">
                          <label class="col-sm-12 col-form-label" for="lastSubmitDate">End Date</label>
                          <div class="col-sm-12">
                              <!-- <input type="text" class="form-control" required [(ngModel)]="master.expiryDate" id="expiryDate" name="Expiry Date" nbInput fullWidth placeholder="notification Day"> -->
                              <input required [(ngModel)]="master.lastSubmitDate" [nbDatepicker]="endDatepicker" nbInput id="lastSubmitDate"
                                  fullWidth placeholder="Exam End Date" [ngModelOptions]="{standalone: true}">
                              <nb-datepicker #endDatepicker></nb-datepicker>
                          </div>
                      </div>
                  </div>

                  <div class="col-lg-4 col-md-8 col-sm-12">
                      <div class="form-group row">
                          <label class="col-sm-12 col-form-label" for="startTime">End Time</label>
                          <div class="col-sm-12">
                              <!-- <input type="text" class="form-control" required [(ngModel)]="master.expiryDate" id="expiryDate" name="Expiry Date" nbInput fullWidth placeholder="notification Day"> -->
                                  <ng-select nbselect (change)="(master.endTime = this.$event.id);"
                                  [items]="timeList" name="endTime" bindLabel="name" bindValue="name"
                                  [ngModelOptions]="{standalone: true}" id="endTime"
                                  placeholder="Select Time" appendTo="body"
                                  [(ngModel)]="master.endTime" [disabled]="disabled ? 'disabled' : null">
                              </ng-select>
                          </div>
                      </div>
                  </div>

                    <div class="col-lg-4 col-md-8 col-sm-12">
                        <div class="form-group row">
                            <div class="col-sm-12 validation-checkboxes">
                                <nb-checkbox [(ngModel)]="master.isActive" name="isActive" status="success">
                                    <b>Is Active?</b>
                                </nb-checkbox>
                            </div>
                        </div>
                    </div>

                </div>
            </form>
        </fieldset>
    </nb-card-header>
</nb-card>

<div class="row" *ngIf="!show">
    <div class="col-md-12 col-lg-12">
        <nb-card class="min-height">
            <fieldset [disabled]="disabled ? 'disabled' : null">
                <nb-tabset>
                    <nb-tab tabTitle="ExamQuestion " class="btn-tab">
                        <ul class="list-inline text-right">
                            <li> <button (click)="addSpecificationDetails()" class="btn btn-success btn-sm m-3"> <i
                                        class="fa fa-plus" aria-hidden="true"></i>Add</button>
                                <button (click)="clearSpecificationDetails()" class="btn btn-success btn-sm m-3"> <i
                                        class="fa fa-clear" aria-hidden="true"></i>Clear</button>
                                <!-- <button (click)="SaveOtherSpecification()" [hidden]="!master.productCategoryId" class="btn btn-success btn-sm m-3"> <i class="fa fa-save"
                                        aria-hidden="true"></i>Save</button> -->
                            </li>
                        </ul>
                        <div class="grid-wrapper">
                            <table class=" table table-bordered table-striped">
                                <tr>
                                    <th>Question</th>
                                    <th>Marks</th>
                                    <th>Option</th>
                                    <th>Is Correct?</th>
                                    <th>Action</th>
                                </tr>
                                <tr *ngFor="let detail of master.Specificationdetail; let rowIndex = index">
                                    <td [attr.rowspan]="detail.rowMerge" *ngIf="!detail.isHide">
                                        <input [(ngModel)]="detail.skuName"
                                            (change)="(detail.skuName = this.$event.target.value)" type="text"
                                            class="form-control" id="text" required name="text" nbInput fullWidth
                                            placeholder="Question">
                                    </td>
                                    <td [attr.rowspan]="detail.rowMerge" *ngIf="!detail.isHide">
                                        <input [(ngModel)]="detail.skuNumber"
                                            (change)="( detail.skuNumber = this.$event.target.value)" type="text"
                                            class="form-control" id="text" name="SKUCode" nbInput fullWidth
                                            placeholder="Question Marks">
                                    </td>
                                    <td>
                                        <input [(ngModel)]="detail.specificationType"
                                            (change)="( detail.specificationType = this.$event.target.value)"
                                            type="text" class="form-control" id="text" name="text" nbInput fullWidth
                                            placeholder="Options">
                                    </td>
                                    <td>
                                        <nb-checkbox [(ngModel)]="detail.value" name="Value" status="success">
                                            <b>Is Correct?</b>
                                        </nb-checkbox>
                                    </td>
                                    <td [attr.rowspan]="detail.rowMerge" *ngIf="!detail.isHide">
                                        <button (click)="deleteDetails(detail.Specificationindex)"
                                            class="btn btn-danger btn-sm m-1">
                                            <i class="fa fa-trash" aria-hidden="true"></i>
                                        </button>
                                    </td>
                            </table>
                        </div>
                    </nb-tab>
                </nb-tabset>
            </fieldset>
        </nb-card>
    </div>
</div>
