<nb-card class="actions-card">
    <nb-card-header>{{pageNavigation}}
        <ngx-common-button (click)="ButtonAction()"></ngx-common-button>
    </nb-card-header>
</nb-card>
<nb-card *ngIf="show">
    <nb-card-header class="text-right">
        <ngx-common-action (click)="agButtonAction()"></ngx-common-action>
    </nb-card-header>
    <nb-card-body>
        <div class="grid-wrapper">
            <ag-grid-angular #agGrid style="height: 500px;" id="myGrid" class="ag-theme-alpine" [modules]="modules"
                [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [debug]="true" [rowData]="rowData"
                [frameworkComponents]="frameworkComponents" (gridReady)="onGridReady($event)"
                (rowClicked)="onRowClicked($event)" rowSelection="multiple" pagination='true'>
            </ag-grid-angular>
        </div>
    </nb-card-body>
</nb-card>

<nb-card *ngIf="!show">
    <nb-card-header>
        <fieldset [disabled]="disabled ? 'disabled' : null">
            <form #masterForm="ngForm" novalidate>
                <div class="row">
                    <div class="col-4">
                        <div class="form-group row">
                            <label for="Year" class="col-sm-5 col-form-label">Year Name <span>*</span></label>
                            <div class="col-sm-7">
                                <ng-select [items]="fiscalYearItems" (change)="(master.Year = $event ? $event.name : null);"
                                    name="Year" bindLabel="name" [ngModelOptions]="{standalone: true}" id="Year"
                                    placeholder="Select Year Name" appendTo="body"
                                    [(ngModel)]="master.fiscalYearSelected" [clearable]="true" [disabled]="isEdit">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="form-group row">
                            <label for="MonthNo" class="col-sm-5 col-form-label">Month Name <span>*</span></label>
                            <div class="col-sm-7">
                                <ng-select [items]="monthItems"
                                    (change)="(master.MonthNo = $event ? $event.id : null);GetFullMonthCalender();" name="MonthNo"
                                    bindLabel="name" [ngModelOptions]="{standalone: true}" id="MonthNo"
                                    placeholder="Select Month Name" appendTo="body" [(ngModel)]="master.monthSelected" [clearable]="true" [disabled]="isEdit">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </fieldset>
    </nb-card-header>
</nb-card>

<div class="row" *ngIf="!show">
    <div class="col-md-12 col-lg-12">
        <nb-card class="min-height">
            <fieldset [disabled]="disabled ? 'disabled' : null">
                <nb-tabset>
                    <nb-tab tabTitle="Month Details" class="btn-tab">
                        <div class="grid-wrapper">
                            <table class=" table table-bordered table-striped">
                                <tr>
                                    <th>Day No</th>
                                    <th>Day Name</th>
                                    <th>Date</th>
                                    <td>Off Day</td>
                                </tr>

                                <tr *ngFor="let detail of master.lstModel;let rowIndex = index">
                                    <td>{{detail.Day}}</td>
                                    <td>{{detail.DayName}}</td>
                                    <td>{{this.GetFormattedDate(detail.Date)}}</td>
                                    <td>
                                        <nb-checkbox [(ngModel)]="detail.isActive" id="isActive" name="isActive"
                                            status="success">
                                        </nb-checkbox>
                                    </td>

                                </tr>
                            </table>
                        </div>
                    </nb-tab>
                </nb-tabset>
            </fieldset>
        </nb-card>
    </div>
</div>
