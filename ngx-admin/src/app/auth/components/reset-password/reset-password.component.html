<h1 id="title" class="title">Change password</h1>
<p class="sub-title">Please set a new password</p>

<form [formGroup]="frmResetPassword" aria-labelledby="title">

  <div class="form-control-group">
    <label class="label" for="input-password">New Password:</label>
    <input class="form-control" formControlName="Password" required nbInput fullWidth type="password" id="password"
      placeholder="Password" fieldSize="large" minlength="6" maxlength="12"
      [status]="password.dirty ? (password.invalid  ? 'danger' : 'success') : 'basic'"
      [attr.aria-invalid]="password.invalid && password.touched ? true : null">
    <ng-container *ngIf="password.invalid && password.touched">
      <p class="caption status-danger" *ngIf="password.errors?.required">
        Password is required!
      </p>
      <p class="caption status-danger" *ngIf="password.errors?.minlength || password.errors?.maxlength">
        Password should contains from 6 to 12 characters
      </p>
    </ng-container>
  </div>

  <div class="form-control-group">
    <label class="label" for="input-re-password">Confirm Password:</label>
    <input class="form-control" formControlName="ConfirmPassword" required nbInput fullWidth type="password"
      id="confirmPassword" placeholder="Confirm Password" fieldSize="large" minlength="6" maxlength="12"
      [status]="confirmPassword.dirty ? (confirmPassword.invalid  ? 'danger' : 'success') : 'basic'"
      [attr.aria-invalid]="confirmPassword.invalid && confirmPassword.touched ? true : null"
      (blur)="IsDummayPassword()">
    <ng-container *ngIf="confirmPassword.touched">
      <p class="caption status-danger" *ngIf="confirmPassword.invalid && confirmPassword.errors?.required">
        Password confirmation is required!
      </p>
      <p class="caption status-danger" *ngIf="IsDummayPassword()">
        Invalid Password({{confirmPasscode}}), please try with different one!
      </p>
      <p class="caption status-danger"
        *ngIf="password.value != confirmPassword.value && !confirmPassword.errors?.required">
        Password does not match the confirm password.
      </p>
    </ng-container>
  </div>

  <button class="btn btn-success btn-block" nbButton fullWidth status="success" size="medium"
    [disabled]="submitted || !frmResetPassword.valid || IsDummayPassword()" [class.btn-success]="submitted"
    (click)="changePasswordSave()">
    Change password
  </button>
</form>
